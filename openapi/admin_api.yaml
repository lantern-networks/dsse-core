  /admin/grants/{id}/revoke:
    post:
      summary: Revoke a federated-auth grant (continuous revocation).
      description: >-
        Requires admin.grants.write. Checks the exact caller tenant and grant under
        one lock. Revokes locally and attempts persistence; a save failure retains
        local denial and returns partial, requiring a retry before restart. A repeat
        retries saving even if already revoked. Success confirms local acceptance,
        not fleet delivery or durable storage when no persister is configured.
        A completed synced in-place write returns 200 with saved_non_atomic and
        a Console storage warning. A completed replacement with unconfirmed flush
        returns partial 500 and remains pending for retry.
        The grant ID is a bearer credential; audit records use a SHA-256 reference.
        See docs/idp.md for distribution and persistence limits.
      tags:
        - AdminGrants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revocation accepted locally.
          content:
            application/json:
              schema:
                type: object
                required: [status, grant_id, tenant_id, audit_ref]
                properties:
                  persistence:
                    type: string
                    enum: [saved_non_atomic]
                    description: Present only for a completed save without atomic replacement.
                  status:
                    type: string
                    enum: [revoked]
                  grant_id:
                    type: string
                  tenant_id:
                    type: string
                  audit_ref:
                    type: string
                    description: SHA-256 reference, not the bearer grant ID.
        "500":
          description: Local denial applied but persistence is unconfirmed; restore storage and retry before restarting.
          content:
            application/json:
              schema:
                type: object
                required: [status, applied, grant_id, tenant_id, audit_ref, persistence, error]
                properties:
                  status:
                    type: string
                    enum: [partial]
                  applied:
                    type: boolean
                    enum: [true]
                  grant_id:
                    type: string
                  tenant_id:
                    type: string
                  audit_ref:
                    type: string
                  persistence:
                    type: string
                    enum: [unconfirmed]
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
