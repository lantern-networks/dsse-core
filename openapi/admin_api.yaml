        "404":
          $ref: "#/components/responses/NotFound"
  /admin/connectors/{connector_id}/routes:
    get:
      summary: List a connector's effective network routes (self-declared + admin-authored, with held state).
      description: Requires admin.connectors.read. Returns each self-declared reachable CIDR with its held/routable state, plus admin-authored routes. Only routable routes enter the connector route layer.
      tags:
        - AdminConnectors
      parameters:
        - name: connector_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The connector's governed routes.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Govern a connector's network routes (hold / unhold a self-declared CIDR, add / remove an admin-authored CIDR).
      description: Requires admin.connectors.write. action=hold|unhold blocks/restores a self-declared route; action=add|remove manages an admin-authored route. Only routable routes enter the connector route layer (fail-safe against a mis-declared or rogue route).
      tags:
        - AdminConnectors
      parameters:
        - name: connector_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
