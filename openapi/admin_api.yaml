        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove (decommission) a connector.
      description: Requires admin.connectors.write. Deletes the connector from the registry. Tenant-scoped (a connector in another tenant is 404). A live connector that keeps heartbeating will re-register, so this is for offline / retired connectors.
      tags:
