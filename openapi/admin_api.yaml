          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Operator supplied replay reason for audit metadata. Defaults to admin_replay.
      responses:
        "200":
          description: Dead row was reset to pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditOutboxReplayResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          description: Audit Outbox replay is not configured for this Edge process.
  /admin/domain-event-outbox/dead:
