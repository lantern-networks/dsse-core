              - active
              - draft
              - disabled
          description: Optional exact status filter.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Maximum rows returned. Values outside 1..1000 are clamped by the server.
      responses:
        "200":
          description: Tenant policy list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Upsert a tenant-scoped Policy Engine policy.
      description: Requires admin.policy.write. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. Bearer automation requests do not use CSRF. With a configured persistent store, the authored policy is saved before publication to the live policy store. Successful local publication does not establish delivery to every Edge.
      tags:
        - AdminPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        "200":
          description: Upserted tenant policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: A rejected store save leaves live configuration and generation unchanged. If the store accepted the change but Network Extension snapshot publication failed, the response has status partial and applied true. Publication may have written some files; fleet delivery is not established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyMutationError"
  /admin/effective-policy:
    get:
      summary: Explain the precedence-ordered policy basis for a destination ("Why").
      description: >
        Requires admin.policy.read. Returns the precedence-ordered decision basis for one destination — every
        policy that competes (authored rules AND built-in base policies loaded via -policy), in the exact order
        the engine evaluates them, with the winner and shadowed (matched-but-out-precedenced) matches marked and
        each row tagged by source (authored / built_in). This surfaces the hidden competition behind a
        surprising decision (e.g. an authored Authenticate rule losing a priority tie to a built-in allow). Also
        returns the inspect/bypass basis (whether the Edge decrypts or raw-forwards the flow, and which source
        decided it: decrypt-all default / known-bypass / authored bypass / materialized cert-pin).
        inspection.decision may be depends_on_device when a source-device selector changes the result;
        this destination-only request has no authenticated source device. Response is metadata-only.
      tags:
        - AdminPolicy
      parameters:
        - name: destination
          in: query
          required: true
          schema:
            type: string
          description: Destination host to explain (matched as SNI and FQDN), e.g. accounts.google.com.
        - name: actor_type
          in: query
          required: false
          schema:
            type: string
            default: human
          description: Actor type for the simulated request (default human).
        - name: service_family
          in: query
          required: false
          schema:
            type: string
            default: https
          description: Service family for the simulated request (default https).
        - name: destination_port
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 65535
            default: 443
          description: Destination port for the simulated request (default 443).
        - name: saas_application_id
          in: query
          required: false
          schema:
            type: string
          description: Optional explicit SaaS application id; otherwise classified from the destination.
      responses:
        "200":
          description: Precedence-ordered, provenance-tagged policy basis for the destination.
          content:
            application/json:
              schema:
                type: object
                properties:
                  destination: { type: string }
                  actor_type: { type: string }
                  winner_policy_id: { type: string }
                  winner_decision: { type: string }
                  final_decision: { type: string }
                  final_policy_id: { type: string }
                  note: { type: string }
                  inspection:
                    type: object
                    description: Whether the Edge decrypts (inspect) or raw-forwards (bypass) the flow, and which source decided it. Orthogonal to the policy decision — a bypassed flow is still steered and policy-gated.
                    properties:
                      decision: { type: string, enum: [inspect, bypass] }
                      source: { type: string, enum: [default_decrypt_all, known_bypass, authored_bypass, cert_pin_materialized, static_bypass] }
                      detail: { type: string }
                  trace:
                    type: array
                    items:
                      type: object
                      properties:
                        policy_id: { type: string }
                        name: { type: string }
                        priority: { type: integer }
                        decision: { type: string }
                        status: { type: string }
                        matched: { type: boolean }
                        matched_conditions: { type: array, items: { type: string } }
                        winner: { type: boolean }
                        shadowed: { type: boolean }
                        source: { type: string, enum: [authored, built_in] }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/policies/{policy_id}/status:
    post:
      summary: Enable/disable a single policy without deleting it.
      description: >
        Requires admin.policy.write. Sets a policy's status to active or disabled — a built-in (seeded) policy
        too — without removing it; a disabled policy is skipped at decision time. The override is persisted so a
        disable survives a restart even though the policy re-seeds from config.
      tags:
        - AdminPolicy
      parameters:
        - name: policy_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        "200":
          description: Updated status.
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Policy not found.
  /admin/effective-policies:
    get:
      summary: List every policy the engine evaluates (authored + built-in), precedence-ordered + source-tagged.
      description: >
        Requires admin.policy.read. Returns the standing full policy set in the exact precedence order the
        engine applies (first match wins), each tagged by source (authored = compiled from an Egress/East-West
        rule or directly upserted; built_in = loaded via -policy / the bundle). Surfaces the built-in policies
        rather than leaving them discoverable only per-destination via /admin/effective-policy. Read-only.
        Metadata-only.
      tags:
        - AdminPolicy
      responses:
        "200":
          description: The full precedence-ordered, source-tagged policy set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { type: string }
                  policies:
                    type: array
                    items:
                      type: object
                      properties:
                        policy_id: { type: string }
                        name: { type: string }
                        priority: { type: integer }
                        decision: { type: string }
                        status: { type: string }
                        source: { type: string, enum: [authored, built_in] }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/egress-effective-rules:
    get:
      summary: List EVERY effective egress rule across all surfaces (single-pane view).
      description: >
        Requires admin.policy.read. Aggregates every egress rule the edge owns into one precedence-ordered list,
        not just authored ones: authored rules (editable), the built-in catch-all default (toggleable), the
        known-bypass OS/cert floor (master-toggleable), legacy SaaS Optimize posture selections, and approved
        cert-pin bypasses — each normalized to one source -> destination : service => access x inspection shape
        with a kind tag and capability flags (editable / deletable / toggle_kind). Phase B-3 of the unified policy
        model. Read-only. Metadata-only. An authored entry with service_unresolved=true matches no traffic,
        including deny/authenticate rules. Repair its service reference; other rules and defaults still apply.
      tags:
        - AdminPolicy
      responses:
        "200":
          description: The effective egress rules across all surfaces, in precedence order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { type: string }
                  rules:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [authored, builtin_default, known_bypass, optimize_bypass, cert_pin_bypass] }
                        id: { type: string }
                        name: { type: string }
                        priority: { type: integer }
                        source_text: { type: string }
                        destination_text: { type: string }
                        service_text: { type: string }
                        access: { type: string, enum: [allow, deny, authenticate] }
                        inspection: { type: string, enum: [inspect, bypass] }
                        service_unresolved: { type: boolean, description: The named service is missing or invalid; the authored rule matches no traffic. }
                        status: { type: string, enum: [active, disabled, off] }
                        editable: { type: boolean }
                        deletable: { type: boolean }
                        toggle_kind: { type: string, enum: [rule, policy_status, known_bypass_master, none] }
                        policy_id: { type: string }
                        patterns: { type: array, items: { type: string } }
                        detail: { type: string }
                        candidate_id: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/catalog-groups:
    get:
      summary: List built-in SaaS catalog groups (as endpoint groups).
      description: >
        Requires admin.policy.read. Returns the built-in SaaS catalog presented as named endpoint groups — the
        sign-in / AI / collaboration decrypt groups and the Optimize bypass groups, each with its category, axis
        (decrypt | bypass) and host patterns. Phase A of the unified policy model. Read-only. Metadata-only.
      tags:
        - AdminPolicy
      responses:
        "200":
          description: The built-in SaaS catalog groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        category: { type: string }
                        axis: { type: string, enum: [decrypt, bypass] }
                        description: { type: string }
                        patterns: { type: array, items: { type: string } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/inspection-posture:
    get:
      summary: Show the default inspection posture (mode + decrypt allowlist + known-bypass).
      description: >
        Requires admin.policy.read. Surfaces the otherwise-invisible default inspection posture: the deployment
        mode (decrypt_all = decrypt every steered HTTPS flow except the bypass set; bypass_default = decrypt ONLY
        the allowlist and raw-forward the rest), the decrypt allowlist (explicit hosts + selected SaaS auth-group
        presets), the curated hardcoded known-bypass groups (each marked active when in the live bypass set), and
        the local engine's intercept/bypass sets selected for the requesting tenant. scope=deployment describes
        the shared posture settings; the host lists include only this tenant's contributions shared by all
        source devices. device_scoped indicates additional selectors using the authenticated device identity.
        configurable indicates whether this caller can edit the defaults; runtime_available is false on a
        server without an interception engine. can_manage_rules is separate and covers tenant-authored SaaS
        bypass rules. A control-plane response does not confirm that every Edge has applied the settings.
      tags:
        - AdminPolicy
      responses:
        "200":
          description: The default inspection posture.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  scope: { type: string, enum: [deployment] }
                  configurable: { type: boolean }
                  runtime_available: { type: boolean }
                  can_manage_rules: { type: boolean }
                  device_scoped: { type: boolean, description: Additional device-specific inspection selectors exist. }
                  default_mode: { type: string, enum: [decrypt_all, bypass_default] }
                  intercept_hosts: { type: array, items: { type: string } }
                  effective_bypass: { type: array, items: { type: string } }
                  known_bypass_enabled: { type: boolean }
                  decrypt_allowlist_hosts: { type: array, items: { type: string } }
                  decrypt_allowlist_groups: { type: array, items: { type: string } }
                  bypass_groups: { type: array, items: { type: string } }
                  warnings: { type: array, items: { type: string } }
                  note: { type: string }
                  auth_decrypt_groups:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        patterns: { type: array, items: { type: string } }
                        category: { type: string }
                        selected: { type: boolean }
                  saas_bypass_groups:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        patterns: { type: array, items: { type: string } }
                        category: { type: string }
                        selected: { type: boolean }
                  known_bypass_groups:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        patterns: { type: array, items: { type: string } }
                        active: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Change the inspection posture (deployment mode + decrypt allowlist + known-bypass).
      description: >
        Requires admin.policy.write and the deployment operator outside an X-Operate-Tenant customer context.
        Customer administrators cannot edit deployment defaults. Config-sourced nodes reject local writes. Partial update — only the provided fields change. Set mode=bypass_default to
        decrypt ONLY the allowlist (decrypt_allowlist_hosts + decrypt_allowlist_groups, e.g. m365_auth/google_auth)
        and raw-forward everything else; a bypassed flow is still steered and policy-gated, so keep a SaaS auth
        group selected to keep tenant restriction working. known_bypass_enabled toggles the curated raw-forward
        list. Known presets and DNS host patterns (or IPv4 literals) are validated. URLs, ports, unknown presets
        and unsupported IPv6 literals are rejected. The candidate is saved before the local live settings and
        engine callback are updated. A storage failure returns 500 and retains the previous live settings.
        Re-read after uncertain responses and retry once storage is restored. Edges receive the change through
        configuration synchronization; failed persistence keeps the bundle generation pending for retry.
        Returns the updated posture. A dedicated audit event records the scope, mode, counts, digest and outcome
        without recording destination lists, in addition to the common HTTP mutation audit.
      tags:
        - AdminPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [decrypt_all, bypass_default] }
                decrypt_allowlist_hosts: { type: array, items: { type: string } }
                decrypt_allowlist_groups: { type: array, items: { type: string } }
                bypass_groups: { type: array, items: { type: string } }
                known_bypass_enabled: { type: boolean }
      responses:
        "200":
          description: Updated inspection posture.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Posture storage is not configured, or this node pulls its configuration from an authority.
        "500":
          description: Saving the candidate was not confirmed; the previous live settings remain active. Reload and retry after storage recovers.
  /admin/policies/{policy_id}:
    get:
      summary: Get a tenant-scoped Policy Engine policy.
      description: Requires admin.policy.read. Returns one policy by identifier within the authenticated tenant scope.
      tags:
        - AdminPolicy
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
          description: Tenant-scoped policy identifier. Slash characters are rejected by the server.
      responses:
        "200":
          description: Tenant policy detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete an admin-authored Policy Engine policy.
      description: Requires admin.policy.write. Removes a policy that was created through POST /admin/policies, together with any status override for it. Policies sourced from the policy bundle or startup flags are configuration, not runtime state, and refuse with 409 — they would be resurrected by the next bundle apply. Returns 404 when no admin-authored policy has the identifier.
      tags:
        - AdminPolicy
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
          description: Tenant-scoped policy identifier. Slash characters are rejected by the server.
      responses:
        "200":
          description: Deleted; returns the removed policy's identifier and name.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The policy exists but is bundle-sourced; it cannot be deleted through the Admin API.
        "500":
          description: Deletion is applied on this server, but Network Extension snapshot publication is unconfirmed. Reload before retrying; the removed policy now returns 404. This does not establish durable deletion or delivery to every endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyMutationError"
  /admin/rbac/catalog:
    get:
      summary: Return Admin RBAC role and API token scope catalog.
      description: Requires admin.api_tokens.read. The catalog lets Admin UI clients render API token Role / Scope pickers without copying role permission rules from the server contract.
      tags:
        - AdminAuth
      responses:
        "200":
          description: Role and permission catalog for API token creation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRBACCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/logout:
    post:
      summary: Revoke current Admin Session and clear admin_session cookie.
      tags:
        - AdminAuth
      parameters:
        - name: x-csrf-token
          in: header
          required: false
          schema:
            type: string
          description: Required for admin_session cookie callers and must match the server-side session CSRF secret.
      responses:
        "200":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/state:
    get:
      summary: Get admin runtime state summary.
      tags:
        - Admin
      responses:
        "200":
          description: Runtime state summary.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/config-bundle:
    get:
      summary: Get the tenant config bundle (Phase 1 config distribution).
      description: >-
        Requires admin.policy.read. Returns the control plane's versioned config bundle — a monotonic
        generation plus the tenant's authoritative resources (slice 1: access policies) — that each Edge pulls
        and applies atomically so a fleet enforces identically. See
        docs/edge_config_distribution_phase1_design.md. Metadata-only; no raw credential/cert/payload material.
      tags:
        - Admin
      responses:
        "200":
          description: The current config bundle (generation + resources).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/config-sync-status:
    get:
      summary: Get this Edge's config-bundle puller status (fleet-health / staleness signal).
      description: >-
        Requires admin.state.read. Reports the LAST control-plane generation this Edge applied (plus last
        poll / error), so a fleet-health checker can compare it to the CP's current generation and drain a
        lagging Edge. Returns {"enabled": false} on an authoritative-local Edge (no -config-source-url). See
        docs/edge_config_distribution_phase1_design.md 
      tags:
        - Admin
      responses:
        "200":
          description: >-
            Config-sync status (or {"enabled": false} when sync is off).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /connectors:
    get:
      summary: List registered connectors for the authenticated admin tenant.
      description: Requires admin.state.read. Returns public connector registrations in the authenticated admin tenant scope only. Runtime secret hashes are redacted; runtime_secret_configured and server-managed rotation metadata are included when available.
      tags:
        - Admin
      responses:
        "200":
          description: Tenant-scoped connector registrations.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /connectors/{connector_id}/health:
    get:
      summary: Get public connector health for the authenticated admin tenant.
      description: Requires admin.state.read. Connectors outside the authenticated admin tenant are returned as 404, the same as absent connectors.
      tags:
        - Admin
      parameters:
        - name: connector_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public connector registration with redacted runtime secret metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /connectors/{connector_id}/runtime-secret/rotate:
    post:
      summary: Rotate a registered connector runtime secret.
      description: Requires admin.connectors.write. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token. The target connector must belong to the authenticated admin tenant; cross-tenant targets return 404. The request may supply a new runtime_secret of at least 24 characters; when omitted, the server generates one. The server stores only metadata.runtime_secret_hash, records server-managed metadata.runtime_secret_rotated_at and metadata.runtime_secret_rotated_by, returns the raw runtime_secret once, and redacts the hash from connector metadata in the response.
      tags:
        - Admin
      parameters:
        - name: connector_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                runtime_secret:
                  type: string
                  minLength: 24
                  description: Optional caller-supplied replacement runtime secret. If omitted, the server generates a high-entropy secret and returns it once.
      responses:
        "200":
          description: Connector runtime secret rotated; raw replacement secret is returned once.
          content:
            application/json:
              schema:
                type: object
                required:
                  - connector
                  - runtime_secret
                  - rotated_at
                properties:
                  connector:
                    type: object
                    additionalProperties: true
                    description: Public connector registration with runtime_secret_hash redacted, runtime_secret_configured metadata set when configured, and server-managed rotation metadata included when available.
                  runtime_secret:
                    type: string
                    description: Replacement runtime secret. Store it in connector configuration; it is not retrievable later.
                  rotated_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/access-decisions/{decision_id}:
