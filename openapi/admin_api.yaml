  /admin/legal-hold:
    get:
      summary: List legal holds and whether this tenant is held.
      description: Requires admin.retention.read. Returns the tenants under a legal hold (litigation / e-discovery), whose logs the retention pruner preserves, and whether the authenticated tenant is currently held.
      tags:
        - AdminRetention
      responses:
        "200":
          description: Current legal holds.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Place or release a legal hold on the tenant.
      description: Requires admin.retention.write. Sets (active=true) or releases (active=false) a legal hold on the authenticated tenant. While held, ALL of the tenant's logs are preserved — retention/tiering is frozen — until released. The hold survives a restart.
      tags:
        - AdminRetention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  description: true to place the hold, false to release it.
                reason:
                  type: string
                  description: Optional non-secret note (e.g. matter reference).
      responses:
        "200":
          description: Resulting legal-hold state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/retention-config:
    get:
      summary: Read the admin-configured per-stream retention overrides.
      description: Requires admin.retention.read. Returns the per-stream retention overrides (in days) that take precedence over the startup-flag defaults. A stream not listed uses the flag default. A failed persisted-settings load returns 503 and pauses retention until a clean reload.
      tags:
        - AdminRetention
      responses:
        "503":
          description: Retention settings could not be loaded or are unavailable.
        "200":
          description: Current per-stream retention overrides (days).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Set (or clear) a per-stream retention override.
      description: Requires admin.retention.write and deployment-wide administration. An unavailable store returns 503 without overwriting persisted settings. Sets the retention (in days) for a log stream at runtime, overriding the startup flag without a redeploy; 0 days keeps the stream forever, and clear=true reverts to the flag default.
      tags:
        - AdminRetention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stream:
                  type: string
                  description: The log stream (e.g. access, audit).
                days:
                  type: integer
                  minimum: 0
                  maximum: 106751
                  description: Whole days, required unless clear=true; explicit 0 keeps the stream forever.
                clear:
                  type: boolean
                  description: If true, remove the override and revert to the flag default.
      responses:
        "503":
          description: Retention settings could not be loaded or are unavailable.
        "200":
          description: Resulting overrides.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/audit-chain/verify:
    get:
      summary: Verify the audit cold-archive tamper-evident hash chain.
      description: Requires admin.retention.read. Checks the listed tenant audit segments for valid headers, contiguous sequence numbers, previous-object hashes and complete gzip integrity. Status is empty (ok=false), broken (ok=false), or links_verified (ok=true). Scope is listed_segments_only. Success does not establish completeness against a trusted checkpoint, detect a removed suffix or detect a consistently rewritten chain.
      tags:
        - AdminRetention
      responses:
        "200":
          description: Chain verification result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: No cold archive is configured.
