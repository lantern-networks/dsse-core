      summary: Set an operator display name for a connector (rename).
      description: Requires admin.connectors.write. Sets a friendly display name for the connector, stored as server-managed metadata that survives re-registration and heartbeats. An empty name clears the override (the connector's own name is shown again). The target connector must belong to the authenticated admin tenant; cross-tenant targets return 404.
