        actor_nhi_id:
          type:
            - string
            - "null"
        delegated_access_grant_id:
          type:
            - string
            - "null"
        agent_task_session_id:
          type:
            - string
            - "null"
        application_id:
          type:
            - string
            - "null"
        audience:
          type:
            - string
            - "null"
        resource:
          type:
            - string
            - "null"
        action_type:
          type:
            - string
            - "null"
        task_id:
          type:
            - string
            - "null"
        run_id:
          type:
            - string
            - "null"
        requested_scopes:
          type: array
          items:
            type: string
        reason_code:
          type:
            - string
            - "null"
          description: Non-secret approval reason code. Free-form comments are intentionally omitted.
        approval_result:
          type: string
          enum:
            - approved
            - denied
            - expired
            - revoked
        activated_at:
          type:
            - string
            - "null"
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
