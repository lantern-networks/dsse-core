    ApplicationPublishCIDRCollision:
      type: object
      description: Slice 5 CIDR route collision response (HTTP 409). Lists the overlapping routes and the recommended resolution choices.
      required:
        - schema_version
        - error
        - cidr
        - collisions
      properties:
        schema_version:
          type: string
          enum:
            - application_publish_collision.v1
        error:
          type: string
          enum:
            - cidr_route_collision
        application_id:
          type: string
        cidr:
          type: string
          description: The candidate CIDR that was rejected.
        namespace:
          type: string
          description: The candidate routing namespace (empty when none was assigned).
        site:
          type: string
          description: The candidate Site / connector group.
        ambiguous:
          type: boolean
          description: True when the candidate has no routing namespace to scope the overlap (blocked by default).
        collisions:
          type: array
          items:
            type: object
            properties:
              cidr:
                type: string
              with_cidr:
                type: string
                description: The existing CIDR the candidate overlaps.
              namespace:
                type: string
              site:
                type: string
              source:
                type: string
                description: Non-secret label for the existing route owner (e.g. published_app:<id>, site:<group>, connector:<id>).
              relation:
                type: string
                enum:
                  - equal
                  - contains
                  - contained_by
                  - overlap
              ambiguous:
                type: boolean
        choices:
          type: array
          description: Recommended ways to resolve the collision.
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              recommended:
                type: boolean
              requires_permission:
                type: string
        override:
          type: object
          properties:
            flag:
              type: string
            requires_permission:
              type: string
