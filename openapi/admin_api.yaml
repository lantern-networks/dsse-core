openapi: 3.1.0
info:
  title: DSSE Admin API
  version: 0.1.0
  description: |
    Admin API contract for Phase 1 Lab and MVP-Alpha transition.

    Tenant scoping : every admin resource is scoped to the
    authenticated identity's own tenant. The single controlled exception is the optional `X-Operate-Tenant`
    request header (see components/parameters/OperateTenantHeader): an operator holding the
    `admin.tenant.admin` permission (super_admin / owner) may send it to "operate within" a selected tenant,
    re-scoping all per-resource calls to that tenant. For any identity WITHOUT `admin.tenant.admin` the header
    is silently ignored (not an error) and the request stays scoped to self — there is no cross-tenant reach.
    An effective override on a mutating request (POST/PUT/PATCH/DELETE) is audited
    (`admin_operate_within_tenant`) with the operator principal and the target tenant; reads are not audited
    here. Tenant resolution is fail-closed: when no tenant can be resolved the request is denied.
servers:
  - url: https://{tenant_admin_host}
    variables:
      tenant_admin_host:
        default: admin.example.local
security:
  - AdminSession: []
  - AdminBearer: []
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
    AdminSession:
      type: apiKey
      in: cookie
      name: admin_session
    ConnectorSecret:
      type: apiKey
      in: header
      name: x-connector-secret
      description: Shared connector bootstrap secret or, when a registered connector has metadata.runtime_secret_hash, that connector's runtime secret.
  parameters:
    OperateTenantHeader:
      name: X-Operate-Tenant
      in: header
      required: false
      description: |
        Operator "operate within tenant" selector . Optional on every
        admin endpoint. Honored ONLY when the authenticated identity holds the `admin.tenant.admin` permission
        (operator roles super_admin / owner); for any other identity the header is silently ignored and the
        request stays scoped to the caller's own tenant (no cross-tenant access). When honored, it re-scopes the
        request to the named tenant. An effective override on a mutating request is audited
        (`admin_operate_within_tenant`, operator principal + target tenant). Tenant resolution is fail-closed.
      schema:
        type: string
  schemas:
    AccessDecisionDetail:
      type: object
      required:
        - access_decision_id
        - access_decision
        - related_logs
        - summary
      properties:
        access_decision_id:
          type: string
        access_decision:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        related_logs:
          type: object
          description: Related Hot Store rows keyed by canonical stream name, not JSONL filename.
          properties:
            access:
              type: array
              items:
                type: object
                additionalProperties: true
            audit:
              type: array
              items:
                type: object
                additionalProperties: true
            decision_trace:
              type: array
              items:
                type: object
                additionalProperties: true
            connector:
              type: array
              items:
                type: object
                additionalProperties: true
            human_approval_events:
              type: array
              items:
                type: object
                additionalProperties: true
            delegated_access_grants:
              type: array
              items:
                type: object
                additionalProperties: true
            tool_call_events:
              type: array
              items:
                type: object
                additionalProperties: true
            inspection_events:
              type: array
              items:
                type: object
                additionalProperties: true
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true
        summary:
          type: object
          required:
            - has_runtime_decision
            - related_log_rows
          properties:
            has_runtime_decision:
              type: boolean
            related_log_rows:
              type: integer
              minimum: 0
    LogSearchResponse:
      type: object
      required:
        - stream
        - limit
        - filters
        - query
        - total_scanned
        - total_matches
        - returned
        - rows
      properties:
        stream:
          type: string
        limit:
          type: integer
        filters:
          type: object
          additionalProperties:
            type: string
        query:
          type: string
        total_scanned:
          type: integer
        total_matches:
          type: integer
        returned:
          type: integer
        next_cursor:
          type:
            - string
            - "null"
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    ExportFormat:
      type: string
      enum: [ndjson]
      default: ndjson
    ExportJob:
      type: object
      required:
        - id
        - tenant_id
        - created_by_admin_principal_id
        - stream
        - format
        - filters
        - from
        - to
        - status
        - row_count
        - created_at
        - expires_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
        created_by_admin_principal_id:
          type: string
        stream:
          type: string
          enum:
            - access
            - audit
            - decision_trace
            - connector
            - human_approval_events
            - delegated_access_grants
            - tool_call_events
            - inspection_events
        format:
          $ref: "#/components/schemas/ExportFormat"
        filters:
          type: object
          additionalProperties:
            type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - failed
            - expired
            - cancelled
        row_count:
          type: integer
          minimum: 0
        object_ref:
          type:
            - string
            - "null"
        payload_checksum:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        expires_at:
          type: string
          format: date-time
        error_code:
          type:
            - string
            - "null"
        metadata:
          type: object
          description: Export job metadata. Progress fields are part of the Phase 1 Admin UI contract and should remain stable for Alpha polling.
          properties:
            export_mode:
              type: string
            total_matches:
              type: integer
              minimum: 0
            truncated:
              type: boolean
            progress_phase:
              type: string
              enum:
                - queued
                - running
                - exporting
                - completed
                - failed
                - cancelled
            rows_exported:
              type: integer
              minimum: 0
            last_progress_at:
              type: string
              format: date-time
            cancelled_at:
              type: string
              format: date-time
            cancelled_by_admin_principal_id:
              type: string
            cancellation_reason:
              type: string
          additionalProperties: true
    AdminDownloadURL:
      type: object
      required:
        - download_url
        - expires_at
        - payload_checksum
        - row_count
      properties:
        download_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        payload_checksum:
          type: string
        row_count:
          type: integer
          minimum: 0
    AdminAuditOutboxDeadRow:
      type: object
      required:
        - tenant_id
        - outbox_id
        - event_type
        - publish_attempt
        - last_error
        - occurred_at
        - dead_at
        - audit
      properties:
        tenant_id:
          type: string
        outbox_id:
          type: string
        event_type:
          type: string
        publish_attempt:
          type: integer
          minimum: 0
        last_error:
          type: string
        occurred_at:
          type: string
          format: date-time
        dead_at:
          type: string
          format: date-time
        audit:
          type: object
          additionalProperties: true
          description: Original AuditLog payload that failed delivery and was moved to the outbox dead set.
    AdminAuditOutboxReplayResult:
      type: object
      required:
        - tenant_id
        - outbox_id
        - status
        - publish_attempt
        - updated_at
        - previous_publish_attempt
        - previous_last_error
      properties:
        tenant_id:
          type: string
        outbox_id:
          type: string
        status:
          type: string
          enum:
            - pending
        publish_attempt:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
        previous_publish_attempt:
          type: integer
          minimum: 0
          description: Publish attempt count before the dead row was reset to pending.
        previous_last_error:
          type: string
          description: Last delivery error before replay reset the row.
        previous_dead_at:
          type: string
          format: date-time
          description: Dead timestamp before replay reset the row, when present.
    AdminAuditOutboxStats:
      type: object
      required:
        - tenant_id
        - pending
        - publishing
        - published
        - dead
        - total
      properties:
        tenant_id:
          type: string
        pending:
          type: integer
          minimum: 0
        publishing:
          type: integer
          minimum: 0
        published:
          type: integer
          minimum: 0
        dead:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        oldest_pending_at:
          type: string
          format: date-time
        oldest_publishing_at:
          type: string
          format: date-time
        oldest_dead_at:
          type: string
          format: date-time
    AdminAuditOutboxHealth:
      type: object
      required:
        - tenant_id
        - status
        - reasons
        - checked_at
        - thresholds
        - stats
      properties:
        tenant_id:
          type: string
        status:
          type: string
          enum:
            - ok
            - degraded
        reasons:
          type: array
          items:
            type: string
            enum:
              - dead_rows_present
              - pending_backlog_stale
              - publishing_lock_stale
        checked_at:
          type: string
          format: date-time
        thresholds:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Health threshold values in seconds.
        stats:
          $ref: "#/components/schemas/AdminAuditOutboxStats"
    DomainEventOutboxDeadRow:
      type: object
      required:
        - tenant_id
        - outbox_id
        - event_plane
        - stream
        - event_type
        - publish_attempt
        - last_error
        - occurred_at
        - dead_at
        - payload_checksum
        - payload
        - metadata
      properties:
        tenant_id:
          type: string
        outbox_id:
          type: string
        event_plane:
          type: string
          enum:
            - domain
            - access
            - evidence
        stream:
          type: string
        event_type:
          type: string
        publish_attempt:
          type: integer
          minimum: 0
        last_error:
          type: string
        occurred_at:
          type: string
          format: date-time
        dead_at:
          type: string
          format: date-time
        payload_checksum:
          type: string
          description: Corruption-detection checksum recalculated when dead rows are scanned; not an anti-tamper signature.
        payload:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
    DomainEventOutboxStats:
      type: object
      required:
        - tenant_id
        - event_plane
        - pending
        - publishing
        - published
        - dead
        - total
      properties:
        tenant_id:
          type: string
        event_plane:
          type: string
          enum:
            - domain
            - access
            - evidence
        pending:
          type: integer
          minimum: 0
        publishing:
          type: integer
          minimum: 0
        published:
          type: integer
          minimum: 0
        dead:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        oldest_pending_at:
          type: string
          format: date-time
        oldest_publishing_at:
          type: string
          format: date-time
        oldest_dead_at:
          type: string
          format: date-time
    DomainEventOutboxReplayResult:
      type: object
      required:
        - tenant_id
        - outbox_id
        - event_plane
        - status
        - publish_attempt
        - updated_at
        - previous_publish_attempt
        - previous_last_error
      properties:
        tenant_id:
          type: string
        outbox_id:
          type: string
        event_plane:
          type: string
          enum:
            - domain
            - access
            - evidence
        status:
          type: string
          enum:
            - pending
        publish_attempt:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
        previous_publish_attempt:
          type: integer
          minimum: 0
          description: Publish attempt count before the dead row was reset to pending.
        previous_last_error:
          type: string
          description: Last delivery error before replay reset the row.
        previous_dead_at:
          type: string
          format: date-time
          description: Dead timestamp before replay reset the row, when present.
    DomainEventOutboxHealth:
      type: object
      required:
        - tenant_id
        - event_plane
        - status
        - reasons
        - checked_at
        - thresholds
        - stats
      properties:
        tenant_id:
          type: string
        event_plane:
          type: string
          enum:
            - domain
            - access
            - evidence
        status:
          type: string
          enum:
            - ok
            - degraded
        reasons:
          type: array
          items:
            type: string
            enum:
              - dead_rows_present
              - pending_backlog_stale
              - publishing_lock_stale
        checked_at:
          type: string
          format: date-time
        thresholds:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Health threshold values in seconds.
        stats:
          $ref: "#/components/schemas/DomainEventOutboxStats"
    DomainEventOutboxMirrorHealth:
      type: object
      required:
        - status
        - reasons
        - checked_at
        - stats
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unconfigured
        reasons:
          type: array
          items:
            type: string
            enum:
              - domain_event_outbox_mirror_unconfigured
              - latest_mirror_attempt_failed
        checked_at:
          type: string
          format: date-time
        stats:
          type: object
          required:
            - mirrored
            - insert_failures
          properties:
            mirrored:
              type: integer
              minimum: 0
            insert_failures:
              type: integer
              minimum: 0
        last_success_at:
          type: string
          format: date-time
        last_failure_at:
          type: string
          format: date-time
        last_error:
          type: string
        last_event_plane:
          type: string
          enum:
            - domain
            - access
            - evidence
        last_stream:
          type: string
        last_outbox_id:
          type: string
    DomainEventObjectVerification:
      type: object
      required:
        - manifest_ref
        - object_ref
        - object_checksum
        - payload_checksum
        - row_count
      properties:
        manifest_ref:
          type: string
          description: Object Store path to the manifest sidecar that was verified.
        object_ref:
          type: string
          description: Object Store path to the gzip NDJSON event object referenced by the manifest.
        object_checksum:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        payload_checksum:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        row_count:
          type: integer
          minimum: 1
    DomainEventObjectManifestList:
      type: object
      required:
        - prefix
        - limit
        - returned
        - rows
      properties:
        event_plane:
          type: string
          enum:
            - domain
            - access
            - evidence
          description: Event plane used to derive the default prefix, when provided.
        prefix:
          type: string
          description: Clean relative Object Store prefix used for the listing.
        limit:
          type: integer
          minimum: 1
          maximum: 200
        returned:
          type: integer
          minimum: 0
        rows:
          type: array
          items:
            type: object
            required:
              - manifest_ref
            properties:
              manifest_ref:
                type: string
                pattern: "^domain-events/.+\\.manifest\\.ndjson\\.gz$"
    AdminAuthHealth:
      type: object
      required:
        - tenant_id
        - status
        - mode
        - reasons
        - checked_at
        - has_records
        - stats
      properties:
        tenant_id:
          type: string
        status:
          type: string
          enum:
            - ok
            - degraded
            - unconfigured
        mode:
          type: string
          enum:
            - memory
            - postgres
            - custom
            - none
        reasons:
          type: array
          items:
            type: string
            enum:
              - auth_store_error
              - auth_store_unconfigured
        checked_at:
          type: string
          format: date-time
        has_records:
          type: boolean
          description: Whether the authenticated tenant has Admin Auth records in the runtime store.
        stats:
          type: object
          required:
            - principals
            - sessions
            - api_tokens
            - total
          properties:
            principals:
              type: integer
              minimum: 0
            sessions:
              type: integer
              minimum: 0
            api_tokens:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
          description: Tenant-scoped Admin Auth record counts.
        last_error:
          type: string
          description: Sanitized operator-facing error; internal DB errors are logged server-side.
    UsageMeterSummary:
      type: object
      required:
        - tenant_id
        - period_start
        - period_end
        - records
        - meters
      properties:
        tenant_id:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        records:
          type: integer
          minimum: 0
        meters:
          type: object
          additionalProperties:
            type: object
            required:
              - meter_type
              - unit
              - aggregation
              - quantity
              - subjects
            properties:
              meter_type:
                type: string
              unit:
                type: string
              aggregation:
                type: string
                enum:
                  - sum
                  - peak_max
                description: Usage aggregation mode. Automation concurrency and decision burst meters use peak_max; seat, decision, traffic, log, and event-stream meters use sum.
              quantity:
                type: number
                minimum: 0
              subjects:
                type: integer
                minimum: 0
              quota:
                type: object
                required:
                  - quota_ids
                  - included_quantity
                  - overage_quantity
                  - soft_cap_exceeded
                  - hard_cap_exceeded
                properties:
                  quota_ids:
                    type: array
                    items:
                      type: string
                  included_quantity:
                    type: number
                    minimum: 0
                  overage_quantity:
                    type: number
                    minimum: 0
                  soft_cap_exceeded:
                    type: boolean
                  hard_cap_exceeded:
                    type: boolean
                additionalProperties: false
    UsageMeterHealth:
      type: object
      required:
        - tenant_id
        - status
        - mode
        - reasons
        - checked_at
        - pending_records
        - spooled_records
      properties:
        tenant_id:
          type: string
        status:
          type: string
          enum:
            - ok
            - degraded
            - unconfigured
        mode:
          type: string
          enum:
            - none
            - memory
            - postgres
            - custom
        reasons:
          type: array
          items:
            type: string
        checked_at:
          type: string
          format: date-time
        pending_records:
          type: integer
          minimum: 0
          description: Records held in the process-local pending buffer.
        spooled_records:
          type: integer
          minimum: 0
          description: Records durably spooled in the local Usage Meter pending JSONL file.
        last_error:
          type: string
          description: Sanitized operator-facing error; internal spool/DB errors are logged server-side.
    AgentQualitySummary:
      type: object
      required:
        - tenant_id
        - generated_at
        - stale_after_seconds
        - target_agent_version
        - quality_status
        - quality_reasons
        - devices
        - agent_update_events
        - agent_status_events
        - access_decisions
      properties:
        tenant_id:
          type: string
        generated_at:
          type: string
          format: date-time
        stale_after_seconds:
          type: integer
          minimum: 0
          description: Heartbeat age threshold used to classify a device as stale.
        target_agent_version:
          type: string
          description: Agent target version configured for the Edge rollout endpoint. Empty means no target is configured.
        quality_status:
          type: string
          enum:
            - ok
            - warn
            - unknown
          description: Operator-facing quality status derived from stale devices, crash events, steering failures, and terminal update failures.
        quality_reasons:
          type: array
          items:
            type: string
          description: Machine-readable reasons such as no_devices, stale_devices, agent_crash_events, steering_failures, or agent_update_failures.
        devices:
          type: object
          required:
            - total
            - status_counts
            - version_counts
            - stale
            - on_target_version
          properties:
            total:
              type: integer
              minimum: 0
            status_counts:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
            version_counts:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
            stale:
              type: integer
              minimum: 0
            on_target_version:
              type: integer
              minimum: 0
        agent_update_events:
          type: object
          required:
            - total
            - status_counts
            - terminal_events
            - installed_events
            - update_success_rate
          properties:
            total:
              type: integer
              minimum: 0
            status_counts:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
            terminal_events:
              type: integer
              minimum: 0
            installed_events:
              type: integer
              minimum: 0
            update_success_rate:
              type:
                - number
                - "null"
              minimum: 0
              maximum: 1
              description: installed / terminal update events. Null when no terminal update event has been observed.
        agent_status_events:
          type: object
          required:
            - total
            - status_counts
            - crash_events
            - crash_free_rate
            - steering_attempted
            - steering_succeeded
            - steering_failed
            - steering_success_rate
          properties:
            total:
              type: integer
              minimum: 0
            status_counts:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
            crash_events:
              type: integer
              minimum: 0
            crash_free_rate:
              type:
                - number
                - "null"
              minimum: 0
              maximum: 1
              description: Agent status reports without crashes / total status reports. Null when no status report has been observed.
            steering_attempted:
              type: integer
              minimum: 0
            steering_succeeded:
              type: integer
              minimum: 0
            steering_failed:
              type: integer
              minimum: 0
            steering_success_rate:
              type:
                - number
                - "null"
              minimum: 0
              maximum: 1
              description: steering_succeeded / steering_attempted. Null when no steering attempt has been reported.
        access_decisions:
          type: object
          required:
            - total
            - decision_counts
            - application_counts
            - service_family_counts
            - allowed_events
            - with_connector
            - allow_rate
          properties:
            total:
              type: integer
              minimum: 0
            decision_counts:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
            application_counts:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
            service_family_counts:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
            allowed_events:
              type: integer
              minimum: 0
            with_connector:
              type: integer
              minimum: 0
              description: Access decisions that carried a connector_id, used as the Phase 1 route/steering coverage signal.
            allow_rate:
              type:
                - number
                - "null"
              minimum: 0
              maximum: 1
              description: allow decisions / total access decisions. Null when no access decision has been observed.
    HumanIdentity:
      type: object
      required:
        - id
        - tenant_id
        - subject
        - source
        - status
        - metadata
      properties:
        id:
          type: string
        tenant_id:
          type: string
          description: Server-scoped tenant identifier. Admin write requests must match the authenticated tenant or omit this value.
        subject:
          type: string
          description: Stable IdP/SCIM/HRIS subject for the human user.
        email:
          type:
            - string
            - "null"
        display_name:
          type:
            - string
            - "null"
        source:
          type: string
          description: Directory source such as idp, scim, hris, or lab_import.
        department:
          type:
            - string
            - "null"
        last_seen_at:
          type:
