    NonHumanIdentityRiskReport:
      type: object
      required:
        - schema_version
        - tenant_id
        - generated_at
        - total
        - by_severity
        - identities
        - no_secret_attestation
      properties:
        schema_version:
          type: string
          enum:
            - admin_nhi_risk.v1
        tenant_id:
          type: string
        generated_at:
          type: string
          format: date-time
        total:
          type: integer
          minimum: 0
