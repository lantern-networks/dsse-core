  /admin/audit-writer/health:
    get:
      summary: Report observed primary audit-file write failures.
      description: >-
        Requires admin.logs.read and deployment-wide administration. Tenant-scoped
        sessions and requests operating on a tenant receive 403. Counters describe
        completed audit appends in this node's current Writer instance, reset on
        recreation, and do not prove durable storage or fleet-wide completeness.
        Primary failures remain degraded after successful writes. Hook failures
        are counted separately and do not change primary status. Reading does not
        append an audit event or clear failures.
      tags:
        - AdminLog
      responses:
        "200":
          description: In-memory writer observations, including unknown or unavailable states.
          content:
            application/json:
              schema:
                type: object
                required: [status, scope, attempts, primary_successes, primary_failures, hook_failures]
                properties:
                  status:
                    type: string
                    enum: [unknown, unavailable, healthy, degraded]
                  scope:
                    type: string
                    enum: [writer_process_lifetime]
                  attempts:
                    type: integer
                    minimum: 0
                  primary_successes:
                    type: integer
                    minimum: 0
                  primary_failures:
                    type: integer
                    minimum: 0
                  hook_failures:
                    type: integer
                    minimum: 0
                  last_success_at:
                    type: string
                    format: date-time
                  last_primary_failure_at:
                    type: string
                    format: date-time
                  last_hook_failure_at:
                    type: string
                    format: date-time
                  last_primary_failure_phase:
                    type: string
                    enum: [encode, open, write, rotation]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/hot-store/health:
    get:
      summary: Return Edge Hot Store mirror health.
      description: Requires admin.logs.read. For PostgreSQL hot-store mirror mode, this endpoint reports best-effort mirror successes and latest failure state. In JSONL mode the status is unconfigured.
      tags:
        - AdminLog
      responses:
        "200":
          description: Hot Store mirror health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotStoreMirrorHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/recovery-readiness:
    get:
      summary: Report which enrolled devices have a way back if their certificate breaks.
      description: >-
        Requires admin.logs.read. This node measures which enrolled identities have adopted the recovery name
        it announces. A device that has NOT adopted it cannot return by itself if its certificate expires or
        if what this deployment presents changes, so this is the number to read BEFORE stopping or replacing
        anything. Silence counts as not adopted: a machine that is switched off is exactly the one this path
        exists for. When the node announces no recovery name at all, measured is false — and with devices
        enrolled that is the alarming answer, not the reassuring one.
      tags:
        - AdminLog
      responses:
        "200":
          description: The readiness this node has measured, or that it announces no recovery name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  measured:
                    type: boolean
                  reason:
                    type: string
                  readiness:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/audit-outbox/dead:
    get:
      summary: List tenant-scoped dead Audit Outbox delivery rows.
      description: Requires admin.audit.delivery.read. This endpoint exposes Audit Outbox entries that exhausted publisher delivery attempts and moved to the dead set for operator triage.
      tags:
        - AdminAudit
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 25
          description: Maximum number of dead rows to return. The server clamps values above 1000.
      responses:
        "200":
          description: Dead Audit Outbox rows for the authenticated tenant.
          content:
            application/json:
              schema:
                type: object
                required:
                  - limit
                  - returned
                  - rows
                properties:
                  limit:
                    type: integer
                  returned:
                    type: integer
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminAuditOutboxDeadRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: Audit Outbox dead row reader is not configured for this Edge process.
  /admin/audit-outbox/stats:
    get:
      summary: Return tenant-scoped Audit Outbox status counts.
      description: Requires admin.audit.delivery.read. Counts pending, publishing, published, and dead Audit Outbox rows for the authenticated tenant.
      tags:
        - AdminAudit
      responses:
        "200":
          description: Audit Outbox status counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditOutboxStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: Audit Outbox stats reader is not configured for this Edge process.
  /admin/audit-outbox/health:
    get:
      summary: Return tenant-scoped Audit Outbox delivery health.
      description: Requires admin.audit.delivery.read. Converts Audit Outbox counts and oldest pending/publishing timestamps into an operator-facing health status for alerting and UI triage.
      tags:
        - AdminAudit
      responses:
        "200":
          description: Audit Outbox delivery health for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditOutboxHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: Audit Outbox health reader is not configured for this Edge process.
  /admin/audit-outbox/dead/{outbox_id}:
    get:
      summary: Return one tenant-scoped dead Audit Outbox delivery row.
      description: Requires admin.audit.delivery.read. The tenant is derived from the authenticated Admin identity and cannot be overridden by query parameters.
      tags:
        - AdminAudit
      parameters:
        - name: outbox_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dead Audit Outbox row detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditOutboxDeadRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          description: Audit Outbox dead row getter is not configured for this Edge process.
  /admin/audit-outbox/dead/{outbox_id}/replay:
    post:
      summary: Replay a dead Audit Outbox delivery row.
      description: Requires admin.audit.delivery.replay. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. This operation resets a dead outbox row to pending with publish_attempt=0 so a publisher can retry delivery.
      tags:
        - AdminAudit
      parameters:
        - name: outbox_id
          in: path
