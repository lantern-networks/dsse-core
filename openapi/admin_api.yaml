  /admin/domain-event-outbox/mirror-health:
    get:
      summary: Return Domain Event Outbox mirror health for this Edge process.
      description: Requires admin.domain_events.delivery.read. Reports best-effort mirror insert successes and failures from runtime JSONL/domain state paths into the Domain Event Outbox. This endpoint is process-local observability and does not replace the durable outbox delivery health endpoint.
      tags:
        - AdminAudit
      responses:
        "200":
          description: Domain Event Outbox runtime mirror health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainEventOutboxMirrorHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/domain-event-outbox/object-manifests:
    get:
      summary: List Domain Event object manifests in the configured Object Store.
      description: Requires admin.domain_events.delivery.read. Lists manifest sidecars under a clean relative domain-events/{tenant_id}/ prefix for the authenticated tenant so operators can copy a manifest_ref into the verify endpoint. When event_plane is omitted, the server scans the authenticated tenant prefix across all planes.
      tags:
        - AdminAudit
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
            pattern: "^domain-events/.*$"
            example: domain-events/tenant_lab_001/
          description: Clean relative Object Store prefix to scan. The server forces it under the authenticated tenant prefix.
        - name: event_plane
          in: query
          schema:
            type: string
            enum:
              - domain
              - access
              - evidence
          description: Optional event plane used to derive the default prefix under the authenticated tenant. When omitted, the response omits event_plane and uses the tenant-level prefix across all planes.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Domain Event object manifest references.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainEventObjectManifestList"
        "400":
          description: Unsafe prefix.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: Domain Event object store is not configured for this Edge process.
  /admin/domain-event-outbox/object-manifests/verify:
    get:
      summary: Verify a Domain Event object manifest and its referenced object.
      description: Requires admin.domain_events.delivery.read. Reads a manifest sidecar from the configured Object Store, verifies it is under the authenticated tenant prefix, and checks the referenced gzip NDJSON object checksum, row count, and payload checksum.
      tags:
        - AdminAudit
      parameters:
        - name: manifest_ref
          in: query
          required: true
          schema:
            type: string
            pattern: "^domain-events/.+\\.manifest\\.ndjson\\.gz$"
          description: Clean relative Object Store path to a Domain Event object manifest under the authenticated tenant prefix.
      responses:
        "200":
          description: Manifest and referenced object verified successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainEventObjectVerification"
        "400":
          description: Missing or unsafe manifest_ref.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Manifest object was not found. The response body uses a generic error message; storage paths and OS errors are logged server-side only.
        "422":
          description: Manifest was readable, but checksum, row count, object reference, or payload verification failed. The response body uses a generic error message.
        "500":
          description: Manifest verification could not be completed because of an internal storage or decode boundary error. The response body uses a generic error message; detailed storage errors are logged server-side.
  /admin/domain-event-outbox/dead/{outbox_id}/replay:
    post:
      summary: Replay a dead Domain Event Outbox delivery row.
      description: Requires admin.domain_events.delivery.replay. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. This operation resets a dead outbox row to pending with publish_attempt=0 so a publisher can retry delivery.
      tags:
        - AdminAudit
      parameters:
        - name: outbox_id
          in: path
          required: true
          schema:
            type: string
        - name: event_plane
          in: query
          required: false
          schema:
            type: string
            enum:
              - domain
              - access
              - evidence
            default: domain
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Operator supplied replay reason for audit metadata. Defaults to admin_replay.
      responses:
        "200":
          description: Dead row was reset to pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainEventOutboxReplayResult"
        "400":
          description: Invalid event_plane or malformed request body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          description: Domain Event Outbox replay is not configured for this Edge process.
  /admin/export-jobs:
    get:
      summary: List tenant-scoped export jobs.
      tags:
        - AdminExport
      responses:
        "200":
          description: Export job list.
          content:
            application/json:
              schema:
                type: object
                required:
                  - jobs
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create asynchronous log export job.
      description: Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. Bearer automation requests do not use CSRF. Both bounds are required; to must not precede from. Only ndjson is supported. Validation occurs before worker submission.
      tags:
        - AdminExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stream
                - from
                - to
              properties:
                stream:
                  type: string
                  enum:
                    - access
                    - audit
                    - decision_trace
                    - connector
                    - human_approval_events
                    - delegated_access_grants
                    - tool_call_events
                    - inspection_events
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                filters:
                  type: object
                  additionalProperties:
                    type: string
                format:
                  $ref: "#/components/schemas/ExportFormat"
                limit:
                  type: integer
                  minimum: 0
                  maximum: 1000000
                  description: Omit or set 0 to use the default of 1000000 rows.
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "202":
          description: Export job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/export-jobs/{job_id}:
    get:
      summary: Get export job status.
      tags:
        - AdminExport
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export job status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/export-jobs/{job_id}/cancel:
    post:
      summary: Cancel a queued or running export job.
      description: Requires admin.export.cancel. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. Bearer automation requests do not use CSRF. Phase 1 synchronous jobs usually complete before cancellation; Alpha workers use this endpoint to request cancellation before object finalization. Principals with admin.export.cancel.all may cancel any job in the tenant; principals with only admin.export.cancel may cancel jobs they created.
      tags:
        - AdminExport
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Operator supplied cancellation reason for audit metadata.
      responses:
        "200":
          description: Export job cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "400":
          description: Export job is already terminal and cannot be cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/export-jobs/{job_id}/download-url:
    post:
      summary: Issue a short-lived download URL for a completed export job.
      description: Requires admin.export.read. Phase 1 returns an Admin API download URL backed by a short-lived one-time token; Alpha may replace this with an object-storage pre-signed URL.
      tags:
        - AdminExport
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Download URL issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDownloadURL"
        "400":
          description: Export job is not completed or has no object.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/export-downloads/{download_token}:
    get:
      summary: Download an export object with a short-lived token.
      description: Phase 1 local download endpoint. The download token is the only authentication factor for this endpoint; admin_session and Bearer token are not required. The token is single-use and carries tenant/object scope.
      security: []
      tags:
        - AdminExport
      parameters:
        - name: download_token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Gzip-compressed NDJSON export.
          headers:
            x-payload-checksum:
              schema:
                type: string
            cache-control:
              description: Always `no-store` for token-bearing download URLs.
              schema:
                type: string
            referrer-policy:
              description: Always `no-referrer` to reduce download token leakage through referrer headers.
              schema:
                type: string
            x-content-type-options:
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/api-tokens:
    get:
      summary: List admin API tokens within the authenticated tenant scope.
      description: Returns token metadata only. token_hash and raw token are never returned.
      tags:
        - AdminAuth
      responses:
        "200":
          description: Admin API token list.
          content:
            application/json:
              schema:
                type: object
                required:
                  - tokens
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminAPIToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create an admin API token and return the raw token once.
      description: Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. Creation emits admin_api_token_created audit event. Admin API token authentication cannot create another API token, even when the token has admin.api_tokens.write, to prevent horizontal token propagation. Legacy emergency admin tokens and Lab bootstrap remain allowed.
      tags:
        - AdminAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                roles:
                  type: array
                  items:
