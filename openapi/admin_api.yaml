      summary: Create or update a unified rule.
      description: Requires admin.policy.write. With persistence configured, saves a candidate before publishing it and recompiling enforcement. A save error keeps the previous live rules. After an unconfirmed response, reload and reconcile the rule before retrying with the same ID. Config-sourced nodes reject direct writes. `service_id` is optional; omitted or empty means Any — no service scope (east-west matches every service family, egress matches every destination port). Inbound rules are validated against their receivers' platforms (inbound enforces on Windows WFP only); a non-fatal warning may be returned.
