          minimum: 1
    HumanApprovalMutationError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        status:
          type: string
          enum: [partial]
        applied:
          type: boolean
          description: Revocation is effective on this server; persistence is unconfirmed.
        approval_id:
          type: string
        tenant_id:
          type: string
        persistence:
          type: string
          enum: [unconfirmed]
    HumanApprovalEventRevokeRequest:
      type: object
      properties:
        reason_code:
          type: string
          description: Non-secret revoke reason code. Raw comments or ticket contents are intentionally omitted.
      additionalProperties: false
    EndpointInventoryEntry:
      type: object
      required:
        - endpoint_id
        - tenant_id
        - status
      properties:
        endpoint_id:
          type: string
          description: Tenant-scoped endpoint/device identifier. Slash characters are rejected by the Admin API.
        tenant_id:
          type: string
          description: Authenticated tenant scope. Requests with a mismatched tenant_id are rejected.
        user_id:
          type: string
          description: User identifier associated with the endpoint when known.
        hostname:
          type: string
          description: Endpoint hostname when known. Raw IP addresses and network endpoints are not represented by this Admin API.
        os:
          type: string
        os_version:
          type: string
        agent_version:
          type: string
        device_trust_level:
          type: string
        policy_bundle_id:
          type: string
        policy_bundle_version:
          type: string
        status:
          type: string
        registered_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        metadata_key_count:
          type: integer
          minimum: 0
          description: Count of endpoint metadata keys. Raw metadata values are not exposed by this Admin API.
        source:
          type: string
          enum:
            - device_inventory
            - admin
        updated_at:
          type:
            - string
            - "null"
          format: date-time
      additionalProperties: false
    EndpointInventoryList:
      type: object
      required:
        - endpoints
        - count
        - limit
      properties:
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/EndpointInventoryEntry"
        count:
          type: integer
          minimum: 0
          description: Total matching endpoint count before limit truncation.
        limit:
          type: integer
          minimum: 1
    TenantModel:
      type: object
      required:
        - tenant_id
        - status
      properties:
        tenant_id:
          type: string
          description: Authenticated tenant scope. Requests with a mismatched tenant_id are rejected.
        display_name:
          type: string
          description: Non-secret tenant display label.
        region:
          type: string
          description: Non-secret tenant home region identifier.
        data_residency:
          type: string
          description: Non-secret data-residency identifier.
        plan:
          type: string
          description: Non-secret tenant plan identifier.
        status:
          type: string
          enum:
            - active
            - suspended
            - archived
        policy_bundle_id:
          type: string
        policy_bundle_version:
          type: string
        metadata_key_count:
          type: integer
          minimum: 0
          description: Count of tenant metadata keys. Raw metadata values are not exposed by this Admin API.
        is_operator:
          type: boolean
          readOnly: true
          description: Read-only flag set when this tenant is the SSE operator's own tenant (matches -operator-tenant-id). The Console hides operator tenants from the customer list and the API refuses to delete one. Absent/false when the operator-tenant feature is disabled.
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
      additionalProperties: false
    TenantModelList:
      type: object
      required:
        - tenants
      properties:
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantModel"
      additionalProperties: false
    AdminConnector:
      type: object
      required:
        - id
        - tenant_id
        - application_ids
        - private_base_url_configured
        - runtime_secret_configured
        - metadata_key_count
      properties:
        id:
          type: string
          description: Tenant-scoped connector identifier. Slash characters are rejected by the Admin API.
        tenant_id:
          type: string
          description: Authenticated tenant scope. Connectors outside the authenticated tenant are returned as 404.
        connector_group_id:
          type: string
        name:
          type: string
        edge_region_id:
          type: string
        edge_cluster_id:
          type: string
        application_ids:
          type: array
          items:
            type: string
        private_base_url_configured:
          type: boolean
          description: Presence flag only. The raw private base URL is intentionally omitted by this Admin API.
        status:
          type: string
        registered_at:
          type: string
          format: date-time
        last_heartbeat_at:
          type: string
          format: date-time
        runtime_secret_configured:
          type: boolean
          description: True when the connector has a server-stored runtime secret hash. The hash is never returned.
        runtime_secret_rotated_at:
          type: string
          format: date-time
        metadata_key_count:
          type: integer
          minimum: 0
          description: Count of non-server-managed connector metadata keys. Raw metadata values are not exposed by this Admin API.
        tunnel_connected:
          type: boolean
          description: Live tunnel-connection state derived from the Edge tunnel manager (presence of a session). Omitted when liveness cannot be determined (unknown).
        version:
          type: string
          description: Connector-reported runtime version (non-secret). Omitted when the connector has not reported one.
        uptime_seconds:
          type: integer
          minimum: 0
          description: Connector-reported uptime in seconds (non-secret). Omitted when unknown.
        reachable_routes:
          $ref: "#/components/schemas/AdminConnectorReachableRoutes"
      additionalProperties: false
    AdminConnectorReachableRoutes:
      type: object
      description: Admin-safe projection of the connector route layer (non-secret destinations). Private base URLs and secrets are never included.
      required:
        - fqdn_domain_count
        - cidr_count
      properties:
        fqdn_domains:
          type: array
          items:
            type: string
          description: DNS domains the connector fronts, including "*.suffix" wildcards.
        fqdn_domain_count:
          type: integer
          minimum: 0
        cidrs:
          type: array
          items:
            type: string
        cidr_count:
          type: integer
          minimum: 0
        namespace:
          type: string
          description: Site / virtual-network id used to scope overlapping private ranges.
      additionalProperties: false
    AdminConnectorList:
      type: object
      required:
        - connectors
        - count
      properties:
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/AdminConnector"
        count:
          type: integer
          minimum: 0
    AdminSiteRouteSummary:
      type: object
      description: Aggregated, secret-safe route-layer summary across every connector in a Site. Counts and the distinct namespace set only; raw destinations stay at the connector drill-down level.
      required:
        - fqdn_domain_count
        - cidr_count
        - namespaces
      properties:
        fqdn_domain_count:
          type: integer
          minimum: 0
          description: Distinct FQDN domains fronted by connectors in this Site.
        cidr_count:
          type: integer
          minimum: 0
          description: Distinct CIDRs fronted by connectors in this Site.
        namespaces:
          type: array
          items:
            type: string
          description: Distinct routing namespaces declared by connectors in this Site (used to scope overlapping private ranges).
      additionalProperties: false
    AdminSite:
      type: object
      description: Aggregated, secret-safe view of a Site / Connector Group (Connector UX Slice 1). Read-only projection of connectors grouped by connector_group_id. Private base URLs, runtime secrets, and hashes are never included.
      required:
        - site_id
        - connector_count
        - online_count
        - regions
        - route_summary
        - health
      properties:
        site_id:
          type: string
          description: The connector_group_id of the Site, or "(ungrouped)" for connectors that declare no group.
        connector_count:
          type: integer
          minimum: 0
          description: Total connectors aggregated into this Site.
        online_count:
          type: integer
          minimum: 0
          description: Connectors counted as online (live tunnel state when known, else fresh heartbeat).
        regions:
          type: array
          items:
            type: string
          description: Distinct edge_region_id values across the Site's connectors.
        route_summary:
          $ref: "#/components/schemas/AdminSiteRouteSummary"
        health:
          type: string
          enum:
            - healthy
            - degraded
            - down
            - unknown
          description: healthy = all online; degraded = some online; down = none online; unknown = no connectors.
        last_heartbeat_at:
          type: string
          format: date-time
          description: Most recent heartbeat across the Site's connectors. Omitted when none have reported.
        managed:
          type: boolean
          description: True when a persistent Site record exists (an admin-created Site), as opposed to a projection-only Site that exists solely because a connector references its group id (Connector UX Slice 1b).
        name:
          type: string
          description: Human-readable Site name from the persistent Site record. Omitted for a projection-only Site.
        region:
          type: string
          description: Site region from the persistent Site record. Omitted for a projection-only Site.
        expected_connector_count:
          type: integer
          minimum: 0
          description: Expected connector count from the persistent Site record. When > 0 it drives HA-aware health (an online count below it is degraded). Omitted/zero for a projection-only Site.
        routing_namespace:
          type: string
          description: Routing namespace from the persistent Site record (scopes overlapping private ranges). Omitted for a projection-only Site.
        deployment_type:
          type: string
          description: Deployment type from the persistent Site record. Omitted for a projection-only Site.
        ha_policy:
          type: string
          description: Optional HA policy from the persistent Site record. Omitted for a projection-only Site.
      additionalProperties: false
    AdminSiteUpsertRequest:
      type: object
      description: Create or upsert a persistent Site / Connector Group (Connector UX Slice 1b). tenant_id is bound from the authenticated identity; any bootstrap-secret fields are ignored (server-managed, issued only by the enrollment-command endpoint).
      required:
        - site_id
      properties:
        site_id:
          type: string
          description: Stable Site id; doubles as the connector_group_id so enrolled connectors land in this Site.
        name:
          type: string
        region:
          type: string
        expected_connector_count:
          type: integer
          minimum: 0
        routing_namespace:
          type: string
        deployment_type:
          type: string
        ha_policy:
          type: string
      additionalProperties: false
    AdminSiteEnrollmentCommandRequest:
      type: object
      description: Request a connector enrollment command for a Site (Connector UX Slice 1b ).
      properties:
        edge_url:
          type: string
          description: Optional Edge base URL to render into --edge-url. When absent a placeholder is rendered for the operator to complete.
      additionalProperties: false
    AdminSiteEnrollmentCommand:
      type: object
      description: A connector enrollment command plus a freshly minted bootstrap secret returned EXACTLY ONCE (only its hash is persisted). The secret cannot be retrieved again.
      required:
        - site_id
        - tenant_id
        - command
        - bootstrap_secret
        - issued_at
        - warning
      properties:
        site_id:
          type: string
        tenant_id:
          type: string
        command:
          type: string
          description: The rendered dsse-connector enrollment command.
        bootstrap_secret:
          type: string
          description: Plaintext bootstrap secret, shown only once. Only its hash is stored server-side.
        issued_at:
          type: string
          format: date-time
        warning:
          type: string
          description: Reminder that the bootstrap secret is shown only once.
      additionalProperties: false
    AdminSiteList:
      type: object
      required:
        - sites
        - count
      properties:
        sites:
          type: array
          items:
            $ref: "#/components/schemas/AdminSite"
        count:
          type: integer
          minimum: 0
    AdminSiteDetail:
      allOf:
        - $ref: "#/components/schemas/AdminSite"
        - type: object
          required:
            - connectors
          properties:
            connectors:
              type: array
              items:
                $ref: "#/components/schemas/AdminConnector"
              description: Member connectors of the Site, using the secret-safe AdminConnector DTO.
            failover:
              $ref: "#/components/schemas/AdminSiteFailoverReadiness"
            region:
              $ref: "#/components/schemas/AdminSiteRegionInfo"
    AdminSiteFailoverReadiness:
      type: object
      description: Connector UX Slice 6. HA failover-readiness roll-up for a Site, surfaced only on the Site detail (additive). It reuses the expected→degraded rule — an online count below the expected count means failover capacity is below target — and reports the impacted apps/routes if the Site degrades or is lost. Multiple connectors fronting the same route are selected health-aware; there is no fixed active/standby role.
      required:
        - expected_connector_count
        - online_count
        - failover_ready
        - capacity_warning
        - affected_app_count
        - affected_route_count
        - connector_selection
      properties:
        expected_connector_count:
          type: integer
          minimum: 0
          description: Expected connector count from the persistent Site record (0 = unmanaged/projection-only).
        online_count:
          type: integer
          minimum: 0
          description: Connectors counted as online (live tunnel state when known, else fresh heartbeat).
        failover_ready:
          type: boolean
          description: True only when there is at least one spare online connector beyond a single point of failure AND no capacity shortfall.
        capacity_warning:
          type: boolean
          description: True when expected_connector_count > 0 and online_count is below it (failover capacity below target).
        degraded_reason:
          type: string
          description: Human-readable reason the Site is not failover-ready. Omitted when ready.
        affected_app_count:
          type: integer
          minimum: 0
          description: Published private apps fronted by this Site (impacted if the Site degrades/is lost). Tenant-scoped count only.
        affected_route_count:
          type: integer
          minimum: 0
          description: Distinct FQDN + CIDR routes fronted by this Site (the routes that go dark if every connector is lost).
        connector_selection:
          type: string
          description: How connectors fronting the same route are chosen. Always "health_aware" — there is no fixed active/standby role.
        last_heartbeat_at:
          type: string
          format: date-time
          description: Most recent heartbeat across the Site's connectors. Omitted when none have reported.
      additionalProperties: false
    AdminSiteRegionInfo:
      type: object
      description: Connector UX Slice 6. Multi-region roll-up for a Site, surfaced only on the Site detail (additive). It separates the connectors' home region from the serving edge region and the residency boundary. A connector home region outside a non-empty boundary makes its route unusable for a RESIDENCY reason (residency_error) — distinct from a policy denial.
      required:
        - home_regions
        - residency_restricted
        - residency_error
      properties:
        home_regions:
          type: array
          items:
            type: string
          description: Distinct edge_region_id values across the Site's connectors (where the private resources live).
        serving_edge_region:
          type: string
          description: This edge's region (where the flow is served from). Omitted when unset.
        advertised_regions:
          type: array
          items:
            type: string
          description: Residency-filtered region-map regions a tenant agent may land on. Omitted when no region map is configured (single-region).
        residency_boundary:
          type: array
          items:
            type: string
          description: The tenant's allowed regions (residency boundary). Omitted when unrestricted (unpinned tenant).
        residency_restricted:
          type: boolean
          description: True when the tenant has a non-empty residency boundary.
        out_of_boundary_regions:
          type: array
          items:
            type: string
          description: Connector home regions outside the residency boundary. Each makes its route unavailable for a residency reason. Omitted when none.
        residency_error:
          type: boolean
          description: True when at least one connector home region is outside the residency boundary (a route-level residency error, separate from any policy denial).
      additionalProperties: false
    AdminConnectorRuntimeSecretRotateRequest:
      type: object
      properties:
        runtime_secret:
          type: string
          minLength: 24
          description: Optional caller-supplied replacement runtime secret. If omitted, the server generates a high-entropy secret and returns it once.
      additionalProperties: false
    AdminConnectorRuntimeSecretRotateResponse:
      type: object
      required:
        - connector
        - runtime_secret
        - rotated_at
      properties:
        connector:
          $ref: "#/components/schemas/AdminConnector"
        runtime_secret:
          type: string
          description: Replacement runtime secret returned once. It is not retrievable later and is not recorded in Admin audit metadata.
        rotated_at:
          type: string
          format: date-time
    HotStoreMirrorHealth:
      type: object
      required:
        - status
        - reasons
        - checked_at
        - stats
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unconfigured
        reasons:
          type: array
          items:
            type: string
        checked_at:
          type: string
          format: date-time
        stats:
          type: object
          required:
            - mirrored
            - decode_failures
            - ingest_failures
          properties:
            mirrored:
              type: integer
              minimum: 0
            decode_failures:
              type: integer
              minimum: 0
            ingest_failures:
              type: integer
              minimum: 0
        last_success_at:
          type: string
          format: date-time
        last_failure_at:
          type: string
          format: date-time
        last_error:
          type: string
        last_stream:
          type: string
        last_filename:
          type: string
    AdminRBACCatalog:
      type: object
      required:
        - api_token_default_role
        - api_token_roles
      properties:
        api_token_default_role:
          type: string
          enum:
            - auditor
          description: Default role used when an API token create request omits roles.
        api_token_roles:
          type: array
          description: Role and permission catalog exposed to the Admin UI token scope picker. Owner / wildcard scope is intentionally excluded from the Phase 1 UI catalog.
          items:
            type: object
            required:
              - role
              - permissions
            properties:
              role:
                type: string
                enum:
                  - admin
                  - analyst
                  - approver
                  - auditor
              permissions:
                type: array
                items:
                  type: string
    AdminAPIToken:
      type: object
      required:
        - id
        - tenant_id
        - name
        - roles
        - scopes
        - created_by_admin_principal_id
        - created_at
        - expires_at
        - status
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
              - owner
              - admin
              - analyst
              - approver
              - auditor
        scopes:
          type: array
          items:
            type: string
          description: API token scope allowlist. For admin_api_token authentication, both role permission and token scope must allow the requested permission. Creation rejects scopes outside the requested roles' permission set.
        created_by_admin_principal_id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
        metadata:
          type: object
          additionalProperties: true
    AdminAPITokenCreateResponse:
      type: object
      required:
        - token
        - raw_token
      properties:
        token:
          $ref: "#/components/schemas/AdminAPIToken"
        raw_token:
          type: string
          description: Returned once at creation time.
  responses:
    BadRequest:
      description: Request body, path, or query parameters are invalid.
    Unauthorized:
      description: Missing or invalid admin authentication.
    Forbidden:
      description: Authenticated principal lacks the required role.
    NotFound:
      description: Resource was not found within the authenticated tenant scope.
    Conflict:
      description: Resource state transition conflicts with the existing tenant-scoped object.
paths:
  /admin/admins/invite:
    post:
      summary: Invite a first-party admin by email (issues a single-use activation link).
      description: >
        First-party admin onboarding. Creates a pending admin account and emails a single-use, short-lived
        activation link. Requires admin.accounts.write.
      tags:
        - AdminAuth
      responses:
        "201":
          description: Invitation created; activation link issued.
        "400":
          description: Invalid email.
        "403":
          description: Caller lacks admin.accounts.write.
        "503":
          description: First-party admin accounts are not enabled.
  /admin/admins:
    get:
      summary: List the administrators of the authenticated tenant.
      description: >
        Requires admin.accounts.read. Returns the non-secret summaries (principal_id, email, roles, status,
        created_at, last_login_at) of every first-party admin account in the caller's own tenant. Tenant-scoped:
        accounts of other tenants are never returned, and a request with no resolved tenant is denied (403).
      tags:
        - AdminAuth
      responses:
        "200":
          description: Tenant administrator list.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks admin.accounts.read or no tenant is resolved.
        "503":
          description: First-party admin accounts are not enabled.
  /admin/admins/{principal_id}/suspend:
    post:
      summary: Suspend a tenant administrator.
      description: >
        Requires admin.accounts.write. Sets the account status to suspended (blocking login) within the caller's
        own tenant. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token. Refuses
        (409) when it would suspend the last administrator able to manage admins in the tenant.
      tags:
        - AdminAuth
      parameters:
        - name: principal_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated administrator summary.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks admin.accounts.write or no tenant is resolved.
        "404":
          description: The administrator is absent in this tenant.
        "409":
          description: Would lock the tenant out of admin management.
        "503":
          description: First-party admin accounts are not enabled.
  /admin/admins/{principal_id}/reactivate:
    post:
      summary: Reactivate a suspended tenant administrator.
      description: >
        Requires admin.accounts.write. Restores an account to active within the caller's own tenant. Only a
        fully-activated account (password set and TOTP enrolled) can be set active; a never-activated invite
        cannot be flipped into a usable login. Mutating Admin UI requests via AdminSession cookie require
        x-csrf-token.
      tags:
        - AdminAuth
      parameters:
        - name: principal_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated administrator summary.
        "400":
          description: The account has not completed activation.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks admin.accounts.write or no tenant is resolved.
        "404":
          description: The administrator is absent in this tenant.
        "503":
          description: First-party admin accounts are not enabled.
  /admin/admins/{principal_id}:
    delete:
      summary: Delete a tenant administrator.
      description: >
        Requires admin.accounts.write. Removes the administrator from the caller's own tenant (in-memory and
        durably). Refuses (409) to delete the caller's own account or the last administrator able to manage
        admins in the tenant. Mutating Admin UI requests via AdminSession cookie require x-csrf-token.
      tags:
        - AdminAuth
      parameters:
        - name: principal_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Administrator deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks admin.accounts.write or no tenant is resolved.
        "404":
          description: The administrator is absent in this tenant.
        "409":
          description: Self-deletion or last-admin lockout was refused.
        "503":
          description: First-party admin accounts are not enabled.
  /admin/admins/{principal_id}/roles:
    post:
      summary: Change a tenant administrator's roles.
      description: >
        Requires admin.accounts.write. Replaces the roles of an administrator in the caller's own tenant.
        Privilege-escalation guard: only a caller holding admin.tenant.admin may assign a role that itself grants
        admin.tenant.admin (owner/super_admin); otherwise the request is denied (403). Refuses (409) a change
        that would leave the tenant without an administrator able to manage admins. Mutating Admin UI requests
        via AdminSession cookie require x-csrf-token.
      tags:
        - AdminAuth
      parameters:
        - name: principal_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Updated administrator summary.
        "400":
          description: Unknown or empty roles.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks admin.accounts.write, no tenant is resolved, or privilege escalation was refused.
        "404":
          description: The administrator is absent in this tenant.
        "409":
          description: Would lock the tenant out of admin management.
        "503":
          description: First-party admin accounts are not enabled.
  /admin/activate:
    get:
      summary: Validate an activation token and return the account email.
      tags:
        - AdminAuth
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The activation token is valid.
        "404":
          description: The activation link is invalid or expired.
  /admin/activate/password:
    post:
      summary: Set the password during account activation.
      tags:
        - AdminAuth
      security: []
      responses:
        "200":
          description: Password set.
        "400":
          description: Invalid token or password policy violation.
  /admin/activate/totp/begin:
    post:
      summary: Begin TOTP 2FA enrollment (returns the otpauth URI/secret).
      tags:
        - AdminAuth
      security: []
      responses:
        "200":
          description: TOTP secret generated.
        "400":
          description: Invalid token or password not yet set.
  /admin/activate/totp/complete:
    post:
      summary: Verify the first TOTP code, activate the account, and return recovery codes.
      tags:
        - AdminAuth
      security: []
      responses:
        "200":
          description: Account activated; recovery codes returned.
        "400":
          description: Invalid token or incorrect code.
  /admin/login/password:
    post:
      summary: First login factor (email + password); returns a 2FA challenge.
      tags:
        - AdminAuth
      security: []
      responses:
        "200":
          description: Password accepted; a TOTP challenge is required.
        "401":
          description: Invalid credentials (generic).
  /admin/login/totp:
    post:
      summary: Second login factor (TOTP/recovery code); issues admin_session.
      tags:
        - AdminAuth
      security: []
      responses:
        "201":
          description: Authenticated; admin_session issued.
        "401":
          description: Invalid or expired challenge / incorrect code.
  /admin/session:
    get:
      summary: Return current Admin Principal identity.
      tags:
        - AdminAuth
      responses:
        "200":
          description: Current admin session identity.
          content:
            application/json:
              schema:
                type: object
                required:
                  - tenant_id
                  - principal_id
                  - roles
                  - permissions
                  - scopes
                  - auth_method
                properties:
                  tenant_id:
                    type: string
                  principal_id:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    description: Effective Admin permissions derived from the authenticated principal roles. The UI treats this list as the display-control contract; server-side RBAC remains authoritative.
                    items:
                      type: string
                      description: Permission name. The "*" sentinel means all Admin permissions and is currently returned only for the owner role.
                  scopes:
                    type: array
                    description: Effective scopes on the authenticated API token. Empty for Admin Session, legacy token, and lab bypass callers.
                    items:
                      type: string
                  auth_method:
                    type: string
                  api_token_id:
                    type: string
                    description: Present for Admin API Token callers. The Admin UI uses this value to expose self-rotation while hiding rotation for other tenant tokens under bearer authentication.
                  csrf_token:
                    type: string
                    description: Present for admin_session cookie callers; mutating Admin UI requests must echo it in x-csrf-token.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/auth/health:
    get:
      summary: Return Admin Auth Store health.
      description: Requires admin.state.read. Reports tenant-scoped Admin Auth Store reachability and whether Admin Auth records exist for the authenticated tenant. Internal DB error strings are not returned.
      tags:
        - AdminAuth
      responses:
        "200":
          description: Admin Auth Store health for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/transport-admission:
    get:
      summary: List current (T) transport admission revocations for the tenant.
      description: >-
        Requires admin.endpoints.read. Returns the device/connector identities currently revoked from the (T)
        mTLS transport (denied at the handshake even while still enrolled) — populated by the W-2 agent-dark
        sweep and the W-7 manual kill-switch. See docs/compromised_endpoint_agent_tamper_resistance.md and
        docs/w2_agent_dark_auto_revocation_design.md.

        Scoped to the caller's tenant, with the owner read from the enrolled ledger. The summary above already
        said "for the tenant" while the handler applied no filter at all; a kill-switch entry names a device
        and says it was cut off, which is another customer's incident when it is not the caller's. An identity
        the ledger cannot place — including one revoked and then deleted, an ordinary end state — is withheld
        from everyone and counted in withheld_unattributable, so the list never quietly reads as "nothing is
        blocked". GET /admin/revocations is deliberately NOT scoped this way: it is the feed pulling Edges
        apply, its caller is the deployment rather than a customer, and filtering it by a human's tenant would
        stop propagating other tenants' kill-switches — a disclosure fix that would become an enforcement
        failure.
      tags:
        - AdminTransportAdmission
      responses:
        "200":
          description: Current revoked transport identities.
  /admin/revocations:
    get:
      summary: Shared revocation feed (Phase 3) — the CP's admission revocation set for fleet distribution.
      description: >-
        Requires admin.endpoints.read. Serves this Edge's node-local admission revocation set (admin
        kill-switches + W-2 auto-revocations) plus a monotonic generation and a per-process epoch, so every
        Edge can FAST-poll it (-revocation-source-poll, default 2s) and apply it to its admission overlay —
        a device revoked on the control plane is refused on every node within seconds (reconnect-to-evade
        blocked). The CP set is persisted (-admission-revocation-store) so a restart cannot silently
        un-revoke. See docs/edge_horizontal_scale_and_failover_design.md Phase 3.
      tags:
        - AdminTransportAdmission
      responses:
        "200":
          description: "{generation, epoch, revoked: {identity: reason}}."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/revocations/report:
    post:
      summary: Node→CP report of something observed about a device. RECORDED, never enforced.
      description: >-
        Requires admin.endpoints.write. A node that observes something worth a second look about a device —
        it has gone quiet, it failed attestation — says so here. The report is recorded and surfaced at
        GET /admin/device-concerns, and NOTHING is blocked.

        This route used to revoke. An Edge shipped its own automatic agent-dark revocation and the control
        plane redistributed it fleet-wide, so a device one node decided was dark was denied everywhere with
        no administrator involved. That also deadlocked: a device revoked for being silent cannot come back
        to stop being silent. Cutting a device off decides whether someone can work, and an inference does
        not get to make that call. Automatic signals may refuse NEW admission on the node that sees them;
        only POST /admin/transport-admission/revoke blocks a device, and only that tears down live sessions.
      tags:
        - AdminTransportAdmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity]
              properties:
                identity:
                  type: string
                reason:
                  type: string
      responses:
        "202":
          description: Recorded for an administrator to review. No enforcement was applied.
        "400":
          description: identity is required.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/device-concerns:
    get:
      summary: Observations reported by nodes. None of these is enforced.
      description: >-
        Requires admin.endpoints.read. What nodes have reported, newest first, collapsed per identity with a
        repeat count. Deliberately NOT part of GET /admin/revocations: that endpoint is the feed pulling
        Edges apply, so anything in it is enforcement by definition, and a machine's observation must never
        be mistaken for an administrator's decision. In-memory — a report is a notification, and losing one
        on restart costs a notification.

        Scoped to the caller's tenant, with the owner read from the enrolled ledger; reports about devices it
        cannot place are withheld from everyone and counted in withheld_unattributable. A concern names a
        device AND says what is wrong with it, so an unscoped list was a sentence about another customer's
        security posture. The DELETE beside it refuses an identity that is not the caller's with a 404 —
        without that, the read supplied the names and the write let an unrelated account dismiss the
        notification a customer was meant to act on, changing no enforcement and leaving no device broken.
      tags:
        - AdminTransportAdmission
      responses:
        "200":
          description: The reported concerns.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/device-concerns/{identity}:
    delete:
      summary: Dismiss a reported concern. Never changes enforcement.
      description: >-
        Requires admin.endpoints.write. Marks a report as seen. Deciding an observation was not worth acting
        on is a real decision and should not require pretending to act on it, so dismissing is separate from
        blocking and touches enforcement in neither direction.

        The identity must be the caller's tenant's, per the enrolled ledger. An identity belonging to another
        tenant — or one the ledger cannot place — is a 404 rather than a 403: whether it exists on this node is
        itself part of what is being withheld.
      tags:
        - AdminTransportAdmission
      parameters:
        - name: identity
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dismissed (or not present).
        "400":
          description: identity is required.
        "404":
          description: No reported concern for this identity in the caller's tenant.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/device-certificates/renew-all:
    post:
      summary: Declare that certificates issued before a moment are stale, so devices renew on their next check.
      description: >-
        Requires admin.endpoints.write. Renewal normally opens at two thirds of a certificate's life, which
        leaves the final third as retry budget and is the right rule almost always. It is the wrong rule after
        the issuing CA changes: a certificate signed by a superseded CA is stale that day, however much validity
        it has left, and a long certificate can otherwise wait years. This lab has the extreme case — a ten-year
        certificate whose two-thirds point is in 2033, keeping a retired CA alive for seven years because one
        live device still depends on it.

        A DECLARATION, not a command, and that is the whole design. Nothing is pushed: the cutoff goes into the
        signed agent policy each device already fetches, so a device that is switched off renews when it returns
        rather than being missed. It is idempotent for free — a device that has renewed holds a certificate
        issued after the cutoff and stops matching — so there is no per-device state, nothing to acknowledge,
        and no way to renew twice from one request.

        issued_before defaults to now. known_affected lists only the devices whose certificates this node has
        already observed; others follow when they check in, which is the point.

        The cutoff is durable. A restart that forgot it would stop a fleet-wide renewal half-way through,
        silently, for exactly the devices that had not checked in yet.
      tags:
        - AdminEndpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                issued_before:
                  type: string
                  description: RFC3339. Defaults to now.
      responses:
        "200":
          description: Recorded. Devices act on it when they next fetch their policy.
        "400":
          description: issued_before was not RFC3339.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      summary: Stop asking for renewal.
      description: >-
        Requires admin.endpoints.write. Removes the cutoff from the signed policy. Renewals already performed
        are not undone — there is nothing to undo, since a renewed certificate is simply a newer certificate.
      tags:
        - AdminEndpoints
      responses:
        "200":
          description: Cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/device-certificates:
    get:
      summary: When each device's certificate expires and who issued it, observed at the transport handshake.
      description: >-
        Requires admin.endpoints.read. Automatic renewal works; what did not exist was any way to notice it had
        stopped. That failure arrives with no warning at all — certificates do not degrade before they expire,
        so every device issued one on the same day fails authentication on the same day, together.

        Observed at the (T) handshake rather than recorded at issuance, for two reasons: it is the certificate
        the device is really presenting, so it cannot drift from reality the way an issuance record can; and
        issuance facts written into the enrolled ledger would be destroyed on the next config pull, since that
        ledger is control-plane-authoritative configuration and a pull replaces it.

        In-memory: every entry reappears within seconds of a device reconnecting. Devices that have not
        connected since this node started are listed under not_seen rather than being reported as healthy —
        not observed is not the same as fine. Nothing here is enforcement; no decision reads it.

        Scoped to the caller's tenant — the rows, the enrolled count and not_seen alike. Measured on the
        reference lab the day a second tenant first had a device: an ordinary admin of one tenant read the
        other tenant's device identities out of not_seen. The owner comes from the enrolled ledger, the same
        authority admission uses; a device it cannot place is withheld from everyone and counted in
        withheld_unattributable rather than dropped silently.
      tags:
        - AdminEndpoints
      responses:
        "200":
          description: Observed device certificates, soonest expiry first, plus the enrolled devices not yet seen.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/device-client-cas:
    post:
      summary: Add a CA to what verifies device certificates (a device-CA rotation's first step).
      description: >-
        Requires admin.steering.write and -device-client-ca-store (409 when the set is startup-fixed). One
        certificate per call. New handshakes verify against the widened set immediately — no restart.
      tags:
        - AdminSteering
      responses:
        "200":
          description: The added CA's subject and fingerprint.
        "409":
          description: The device-trust CA set on this node is fixed at startup.
  /admin/device-client-cas/{sha256}:
    delete:
      summary: Retire a CA from device trust — refused while any observed device still chains from it.
      description: >-
        Requires admin.steering.write and -device-client-ca-store. The gate is observed use, not
        configuration: retirement is refused naming the devices whose presented certificates chain from this
        CA, and the last CA can never be retired. New handshakes verify against the reduced set immediately;
        established connections are untouched. Adding it back is a single POST.
      tags:
        - AdminSteering
      responses:
        "200":
          description: The retired CA and the reduced set in force.
        "409":
          description: Still presented by named devices, or the set is startup-fixed.
  /admin/transport-trust-anchors/{sha256}:
    delete:
      summary: Withdraw a certificate from what devices trust — refused unless the fleet is covered without it.
      description: >-
        Requires admin.steering.write and -transport-trust-store. The gate is enforced HERE regardless of any
        screen — withdrawal proceeds only when some remaining certificate is trusted by every enrolled device
        (reported, or operator-confirmed for identities that cannot report) AND still verifies the identity
        the Edge presents; the last certificate can never be withdrawn. On success the serial advances and
        the bundle is re-signed; devices drop the certificate when they next take the distribution, and ones
        holding it meanwhile merely trust one certificate more than needed. Adding it back is a single POST
        if the withdrawal turns out to be premature.
      tags:
        - AdminSteering
      responses:
        "200":
          description: The withdrawn certificate and the new serial.
        "409":
          description: The gate refused (reason states which devices are uncovered), or the set is startup-fixed.
  /admin/transport-trust-anchors/{sha256}/acknowledge:
    post:
      summary: Record that an identity holds this anchor by means the Edge cannot observe.
      description: >-
        Requires admin.steering.write. Adoption is measured from what devices REPORT, which is right for
        anything running the steering agent and impossible for anything that is not. A connector is enrolled
        because it needs an identity, verifies the Edge by other means, and reports nothing — so it can never
        appear ready, the figure can never reach every device, and the gate guarding a fleet-wide withdrawal can
        never open. A gate that cannot open is not a safeguard; it is an instruction to work around the
        safeguard.

        Dropping such identities from the denominator would be a fix that silences a correct warning: being
        unable to report is not the same as being safe, and a device that genuinely should have reported would
        vanish into the same silence. So the operator answers instead, per identity and per anchor, and the
        answer is recorded with who made it and why — it is a claim about a deployment rather than an
        observation of one, and a claim that is wrong strands that device.

        Counted towards the withdrawal decision and reported SEPARATELY from device reports. Ready means the
        device said so; acknowledged means somebody said so about it. Merging them would answer "is this safe"
        while destroying "how do we know".
      tags:
        - AdminTransportAdmission
      parameters:
        - name: sha256
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity]
              properties:
                identity:
                  type: string
                reason:
                  type: string
                  description: How the operator knows. Recorded, and worth writing honestly — see the note above.
      responses:
        "200":
          description: Recorded as an operator's assertion.
        "400":
          description: An anchor fingerprint, an identity and an identifiable administrator are all required.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/transport-trust-anchors/{sha256}/acknowledge/{identity}:
    delete:
      summary: Withdraw an acknowledgement.
      description: >-
        Requires admin.steering.write. The identity returns to being counted on what it reports, which for
        something that cannot report means the withdrawal gate closes again.
      tags:
        - AdminTransportAdmission
      parameters:
        - name: sha256
          in: path
          required: true
          schema:
            type: string
        - name: identity
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Withdrawn.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/transport-trust-anchors:
    post:
      summary: Add a certificate to what devices trust (the always-safe direction of a rotation).
      description: >-
        Requires admin.steering.write and -transport-trust-store (409 when the set is startup-fixed). Exactly
        one certificate per call — one auditable act. The distribution serial advances and the signed bundle
        is re-signed and swapped atomically; devices gain a certificate they can match and nobody loses one.
        A duplicate of a distributed certificate is refused.
      tags:
        - AdminSteering
      responses:
        "200":
          description: The added certificate's subject and fingerprint, and the new serial.
        "409":
          description: The trust set on this node is fixed at startup.
    get:
      summary: The transport trust anchors this node serves, with each one's adoption across the fleet.
      description: >-
        Requires admin.steering.read. Devices verify an Edge against these anchors before they will talk to it,
        so withdrawing one before every device holds the replacement is the operation that strands a fleet —
        the replacement would have arrived over the connection the device can no longer make.

        Anchors and adoption are returned together on purpose. Asked separately, an operator has to carry a
        fingerprint from one answer to the next by hand, and which anchor they are talking about is the one
        thing they must not get wrong. Adoption is measured against the ENROLLED inventory rather than against
        whoever has been reporting: deriving the denominator from telemetry would report a fleet fully ready
        precisely because the devices missing the anchor are the ones not talking.

        readiness is absent when device telemetry is not enabled — different from "no device has it", and a
        screen that renders a missing measurement as zero would have an operator waiting for a number that is
        never going to arrive. safe_to_cut is all-or-nothing rather than a threshold: the stragglers are exactly
        the devices that cannot recover on their own.
      tags:
        - AdminTransportAdmission
      responses:
        "200":
          description: >-
            The served anchors, each with validity, fingerprint and adoption, plus change_procedure — how an
            anchor is added or withdrawn on THIS deployment, with its real file path and current serial. There
            is no runtime route for that change; showing adoption without saying where the action lives leaves
            an operator watching a number they cannot act on.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: No transport trust bundle is configured on this node.
  /admin/transport-admission/revoke:
    post:
      summary: Manually revoke a device identity from the (T) transport (W-7 kill-switch).
      description: Requires admin.endpoints.write. Immediately denies the identity at the next mTLS handshake (even while still in the Enrolled Inventory). Restore (re-enrol/re-attest) clears it. Hot-applied, no restart.
      tags:
        - AdminTransportAdmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identity
              properties:
                identity:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Identity revoked.
  /admin/transport-admission/restore:
    post:
      summary: Restore a device identity to the (T) transport (re-admission gate).
      description: Requires admin.endpoints.write. Clears a revocation (after the device re-enrols / re-attests) so it is admitted again at the next mTLS handshake. Hot-applied, no restart.
      tags:
        - AdminTransportAdmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identity
              properties:
                identity:
                  type: string
      responses:
        "200":
          description: Identity restored.
  /admin/pki/readiness/check-signing:
    post:
      summary: Run the interception key's sign-then-verify now, and return the refreshed readiness.
      description: >-
        Requires admin.state.read. The check already runs on a timer, so this adds no capability — it closes the
        gap between an operator reconnecting a token and knowing whether it worked. That gap is where somebody
        gives up waiting and starts changing other things. Safe to expose: it signs a throwaway payload with the
        key already in use and verifies the result, changing nothing. Returns the whole readiness report rather
        than one field, so the caller does not have to merge it themselves.
      tags:
        - AdminPKIReadiness
      responses:
        "200":
          description: The readiness report, with the signing check just re-run.
        "503":
          description: No interception key store is configured on this Edge.
  /admin/license:
    get:
      summary: The licence in force, the seat pool, and which tenants cannot enrol.
      description: >-
        Requires admin.state.read. Returns what the vendor licensed, how much of it is allocated and how much is
        left, and a row per tenant with its allocation, current use, and — the part a status view usually
        omits — whether it can enrol another device right now and why not. That reason is produced by the SAME
        code the enrolment endpoint uses, so the answer an operator reads matches the one a device was given.
        Tenants that have devices but no allocation appear too: that combination is exactly what generates a
        support call and would be invisible in a view built from the allocation table alone. Also reports when
        the pool next CHANGES size, because a seat block lapsing otherwise shows up first as an enrolment
        failing. Distinguishes a deployment that was never licensed from a licence that no longer verifies —
        they look identical in a table and need opposite responses.
      tags:
        - AdminLicense
      responses:
        "200":
          description: Licence state, pool, allocations and per-tenant enrolment status.
        "503":
          description: Licensing is not configured on this Edge.
    post:
      summary: Apply a vendor licence, or preview what applying it would do.
      description: >-
        Requires admin.enrollment.write. The body is the licence file the vendor sent. It is verified before
        anything changes — signature against every accepted vendor key, addressee against this MSSP, and serial
        strictly above the highest ever accepted, which is what refuses an older file carrying more seats.
        With dry_run=true nothing is applied and the response states the consequence instead, including how far
        existing allocations would exceed the new pool; shrinking a pool is legitimate but means redistribution
        work, and discovering that afterwards is how a customer's enrolment breaks with nobody realising why.
      tags:
        - AdminLicense
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
          description: Verify and report the consequence without applying anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The signed licence envelope as issued by the vendor.
      responses:
        "200":
          description: Applied (or, with dry_run, the change it would make).
        "400":
          description: Not a licence file, not signed by an accepted key, addressed elsewhere, or not newer than the licence in force.
        "503":
          description: Licensing is not configured on this Edge.
  /admin/seat-allocations:
    post:
      summary: Set a tenant's share of the licensed seat pool.
      description: >-
        Requires admin.enrollment.write. Allocations may not exceed the pool by default, because allowing that
        moves the failure to whichever tenant happens to enrol last — whose own administrator is inside their
        allocation and can neither see the cause nor fix it. Reducing an allocation BELOW a tenant's current use
        is allowed and reported rather than refused: reclaiming seats is legitimate, nothing already running is
        affected, and only growth stops.
      tags:
        - AdminLicense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - seats
              properties:
                tenant_id:
                  type: string
                seats:
                  type: integer
                note:
                  type: string
      responses:
        "200":
          description: Allocation set, with the tenant's current use and what is left unallocated.
        "400":
          description: Missing tenant or a negative figure.
        "409":
          description: The allocations would exceed the licensed pool.
        "503":
          description: Licensing is not configured on this Edge.
  /admin/seat-allocations/{tenant}:
    delete:
      summary: Remove a tenant's allocation, returning its seats to the pool.
      description: >-
        Requires admin.enrollment.write. The tenant's existing devices are unaffected; it simply cannot enrol
        more until it is allocated seats again.
      tags:
        - AdminLicense
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Allocation removed.
        "404":
          description: No allocation for that tenant.
        "503":
          description: Licensing is not configured on this Edge.
  /admin/enrolment-tokens:
    get:
      summary: List the admin-issued enrolment tokens, with the outstanding backlog.
      description: >-
        Requires admin.enrollment.read. Returns the NON-SECRET records only — the Edge keeps just a hash, so a
        token cannot be retrieved after issuance. Also returns the count of tokens that could still be spent
        against the tenant cap, and those lapsing within 48 hours: a caller-chosen lifetime builds a backlog of
        unused credentials that is invisible unless it is counted, and a kitting run should be warned before it
        stalls on a dead installer rather than after.
      tags:
        - AdminEnrolmentTokens
      responses:
        "200":
          description: Token records, outstanding count and cap, and those expiring soon.
        "503":
          description: Enrolment tokens are not configured on this Edge.
    post:
      summary: Issue a one-time, per-device enrolment token.
      description: >-
        Requires admin.enrollment.write. Mints one token that lets ONE machine obtain a device certificate, once.
        It authorises a MACHINE, not a person — an IT admin images a batch of laptops before knowing who will use
        them — so no end-user login is involved; the IdP authenticates the person later, at access. The secret is
        returned by THIS RESPONSE ONLY and cannot be retrieved afterwards; re-issue if it is lost. The lifetime is
        the issuer's choice because only they know whether the installer is going to the next desk or to a
        courier, bounded by the tenant maximum so a slip cannot mint one that never dies. The record carries which
        admin authorised the machine, which is the question an operator actually has months later.
      tags:
        - AdminEnrolmentTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expires_in_hours
              properties:
                expires_in_hours:
                  type: integer
                  description: Required — there is no sensible default lifetime. Bounded by the tenant maximum.
                count:
                  type: integer
                  description: >-
                    How many devices this approval covers, default 1, at most 500. Kitting is the ordinary case,
                    not the exception, and issuing fifty tokens one dialog at a time is the friction that ends
                    with somebody going back to one shared secret for the whole batch. Each token still
                    authorises ONE machine, once. A batch that would exceed the outstanding cap is refused
                    WHOLE, saying how many would fit — minting part of it leaves live credentials to reconcile
                    against a kitting list.
                label:
                  type: string
                  description: The admin's own note - which machine, which batch, which site.
                group:
                  type: string
                  description: Optional CP-assigned device group; the enrolled device cannot assert its own.
      responses:
        "200":
          description: >-
            Tokens issued, in `tokens`. A single issuance also returns `token`/`secret` at the top level so
            existing callers are unaffected. The secrets appear here and nowhere else, ever.
        "400":
          description: Missing or out-of-bounds lifetime, or no issuing admin identity.
        "409":
          description: The tenant is already holding its cap of unspent tokens.
        "503":
          description: Enrolment tokens are not configured on this Edge.
  /admin/enrolment-tokens/{id}/revoke:
    post:
      summary: Revoke an enrolment token.
      description: >-
        Requires admin.enrollment.write. Kills an unspent token — the answer to a config file going astray before
        it was used. Revoking one that was already SPENT does not remove the enrolled device's access: that device
        holds a certificate, and taking it away is the Enrolled Devices disable plus the admission overlay. The
        response says so when that is the case. Scoped to the caller's tenant.
      tags:
        - AdminEnrolmentTokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token revoked.
        "404":
          description: No such token in this tenant.
        "409":
          description: Already revoked.
        "503":
          description: Enrolment tokens are not configured on this Edge.
  /admin/enrolled-devices:
    get:
      summary: List the Enrolled Inventory (management ledger).
      description: Requires admin.enrollment.read. Returns the admin-managed device list the (T) mTLS admission gate consults (enrolled AND enabled = admitted). Replaces the static signed-file inventory; seeded from it at startup. Cert-profile enforcement is intentionally not part of admission.
      tags:
        - AdminEnrolledInventory
      responses:
        "200":
          description: Current enrolled device ledger.
    post:
      summary: Enroll (or re-enable) a device identity ().
      description: Requires admin.enrollment.write. Adds a device identity to the Enrolled Inventory (enabled). Hot-applied at the next (T) handshake, no restart. Audited.
      tags:
        - AdminEnrolledInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identity
              properties:
                identity:
                  type: string
                note:
                  type: string
      responses:
        "200":
          description: Device enrolled.
        "400":
          description: Missing identity.
  /admin/enrolled-devices/{identity}/enable:
    post:
      summary: Re-enable an enrolled device ().
      description: Requires admin.enrollment.write. Re-admits a previously disabled device at the next (T) handshake. Audited.
      tags:
        - AdminEnrolledInventory
      parameters:
        - name: identity
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device enabled.
        "404":
          description: Identity not in the inventory.
  /admin/enrolled-devices/{identity}/disable:
    post:
      summary: Disable an enrolled device — manual revocation ().
      description: Requires admin.enrollment.write. The device stays on the list but is denied at the (T) handshake (the manual revocation path). Re-enableable. Audited.
      tags:
        - AdminEnrolledInventory
      parameters:
        - name: identity
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device disabled.
        "404":
          description: Identity not in the inventory.
  /admin/enrolled-devices/{identity}/allow-reenrolment:
    post:
      summary: Permit a device to enrol again — a re-image or a lost key ().
      description: >-
        Requires admin.enrollment.write. An identity a device has already enrolled cannot enrol again: reissue
        for a device that HOLDS a certificate is /enroll/renew, which proves possession of the one being
        replaced. A re-imaged machine has lost that certificate, and nothing in the protocol distinguishes a
        re-image from an impersonation — only a person can. This is that decision, recorded under its own
        audit action with the enrolment it supersedes and the grant number, so it can be reviewed later. It is
        deliberately NOT a side effect of re-adding the device.
      tags:
        - AdminEnrolledInventory
      parameters:
        - name: identity
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The device may enrol once more.
        "404":
          description: Identity not in the inventory, or not in the caller's tenant.
  /admin/enrolled-devices/{identity}/group:
    post:
      summary: Assign an enrolled device to a group (M7 union-model group assignment).
      description: Requires admin.enrollment.write. Sets the device's group used by the union-model fleet view; hot-applied at runtime and audited.
      tags:
        - AdminEnrolledInventory
      parameters:
        - name: identity
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - group
              properties:
                group:
                  type: string
      responses:
        "200":
          description: Group assigned; returns the updated device entry.
        "400":
          description: Malformed request body.
        "404":
          description: Identity not in the inventory.
  /admin/enrolled-devices/{identity}/kind:
    post:
      summary: Declare what an enrolled identity IS (endpoint or service).
      description: >-
        Requires admin.enrollment.write. An enrolled identity is not necessarily a managed device: a
        connector holds a transport certificate and is admitted from the same inventory, but runs no agent
        and reports no device-runtime state. Coverage checks treat an endpoint's silence as a finding and a
        service's silence as normal, so the difference has to be DECLARED. An entry that declares nothing is
        an endpoint, which keeps the strict reading as the default. An unknown kind is refused rather than
        stored. Hot-applied at runtime and audited.
      tags:
        - AdminEnrolledInventory
      parameters:
        - name: identity
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
              properties:
                kind:
                  type: string
                  enum: [endpoint, service]
      responses:
        "200":
          description: Kind declared; returns the updated device entry.
        "400":
          description: Malformed request body, or a kind the inventory does not understand.
        "404":
          description: Identity not in the inventory.
  /admin/enrolled-devices/{identity}:
    delete:
      summary: Remove a device from the Enrolled Inventory ().
      description: Requires admin.enrollment.write. Deletes the identity entirely (denied at the next handshake). Audited.
      tags:
        - AdminEnrolledInventory
      parameters:
        - name: identity
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device removed.
        "404":
          description: Identity not in the inventory.
  /admin/device-groups:
    get:
      summary: List the device-group registry (first-class groups).
      description: Requires admin.enrollment.read. Returns the authoritative catalog of device groups that exist (with a per-group device_count) so the Console offers created groups for tab-select assignment instead of free-form typing. Reuses the enrolled ledger's durable store.
      tags:
        - AdminEnrolledInventory
      responses:
        "200":
          description: Current device-group registry for the tenant.
    post:
      summary: Create a device group (first-class registry entry).
      description: Requires admin.enrollment.write. Registers a named device group with an optional description and risk floor. Rejected when the Edge config is CP-sourced (read-only). Audited.
      tags:
        - AdminEnrolledInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                risk:
                  type: string
      responses:
        "200":
          description: Group created; returns the created group.
        "400":
          description: Malformed request body.
        "409":
          description: Group name conflict, or the Edge config is CP-sourced (read-only).
  /admin/device-groups/{id}:
    patch:
      summary: Update a device group (rename / description / risk).
      description: Requires admin.enrollment.write. Partial update — each of name/description/risk is optional and left unchanged when omitted; the id is immutable. A rename cascades to member device assignments (assignment is by name today) so the group risk floor stays attached; the response reports reassigned_devices. Rejected when the Edge config is CP-sourced (read-only). Audited.
      tags:
        - AdminEnrolledInventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                risk:
                  type: string
      responses:
        "200":
          description: Group updated; returns the group and the count of reassigned devices.
        "400":
          description: Malformed request body.
        "404":
          description: Group id not found.
        "409":
          description: Empty name, name conflict, or the Edge config is CP-sourced (read-only).
    delete:
      summary: Delete a device group from the registry.
      description: Requires admin.enrollment.write. Removes a group by id. Refused with 409 when devices are still assigned (reassign first) unless ?force=true. Rejected when the Edge config is CP-sourced (read-only). Audited.
      tags:
        - AdminEnrolledInventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: force
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Group deleted.
        "404":
          description: Group id not found.
        "409":
          description: Group still has assigned devices, or the Edge config is CP-sourced (read-only).
  /admin/dlp-rules:
    get:
      summary: Read the tenant DLP rules (the egress-rule option).
      description: Requires admin.dlp.read. Returns the runtime-authored per-tenant DLP rules — each a selector (saas_application_id / provider, or none = tenant-wide) plus identifiers, min_count, and on_match (observe/block/authenticate). These are overlaid onto the policy bundle so the evaluator surfaces a dlp_inspect directive per destination. See docs/dlp_minimal_design.md a.
      tags:
        - AdminDLPPolicy
      responses:
        "200":
          description: Current DLP rules for the tenant.
    post:
      summary: Hot-apply the tenant DLP rules (the egress-rule option).
      description: Requires admin.dlp.write. Atomically replaces the tenant's DLP rules (no restart). Each rule ties DLP to an egress destination (its selector); DLP applies only when the flow is intercepted (a no-decrypt/bypass flow has no plaintext). The tenant is taken from the admin identity, not the body.
      tags:
        - AdminDLPPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      saas_application_id:
                        type: string
                      provider:
                        type: string
                      identifiers:
                        type: array
                        items:
                          type: string
                          enum: [my_number, corporate_number, credit_card, api_key]
                      min_count:
                        type: integer
                      on_match:
                        type: string
                        enum: [observe, warn, block, authenticate]
                      instance_scope:
                        type: string
                        enum: [any, corporate, personal]
                        description: >-
                          Instance-aware action (the sovereign "here not there"): apply the rule only to the
                          corporate (verified-domain) instance, only to a personal/outside-org account, or any
                          (default). Corporate/personal are decided from the signed-in account domain; when it
                          cannot be determined a scoped rule does not fire.
      responses:
        "200":
          description: Rules applied; returns the new live rules.
        "400":
          description: Invalid rules (unknown on_match, identifier, or instance_scope, or no identifiers).
  /admin/dlp-findings:
    get:
      summary: List tenant-scoped DLP detection events.
      description: >-
        Requires admin.dlp.read. Returns schema_version admin_dlp_findings.v1, tenant_id,
        no_secret_attestation, findings and summary. Only dlp_match inspection events are
        included; include_skipped is accepted for compatibility but has no effect.
        Rows contain identifier types and counts, action, destination, instance class,
        user/device context, access-decision ID and timestamp, without matched values.
        summary.total counts events before the response limit; returned counts rows in
        this response. Each by_identifier count is events containing that type, so adding
        these counts can count a multi-type event more than once. blocked counts block events.
        Optional filters are identifier, action, severity, since (RFC3339) and limit
        (default 200, accepted range 1-2000). The configured aggregate store is searched
        over the last 30 days, up to its latest 20000 inspection rows before these filters;
        these are bounded results, not complete retained-history totals. A configured-store
        failure returns 503 rather than silently using a local cache. With no aggregate
        store configured, the local inspection store is used. Findings are not a scan or
        delivery ledger. See docs/dlp.md.
      tags:
        - AdminDLPPolicy
      responses:
        "200":
          description: DLP findings and event-level summary for the authenticated tenant.
        "503":
          description: Configured findings store could not be read. Retry; no empty or partial local success is returned.
  /admin/dlp-classifiers:
    get:
      summary: Read the tenant's operator-defined custom DLP classifiers (slice C).
      description: Returns tenant_id alongside the list. Requires admin.dlp.read. Returns the tenant's custom identifiers — each a name plus either a regex pattern or a keyword dictionary — that the DLP scan detects alongside the built-in identifiers. NON-SECRET (a classifier only ever reports its name + a count, never matched bytes). See docs/dlp_vision_and_roadmap.md slice C.
      tags:
        - AdminDLPPolicy
      responses:
        "200":
          description: Current custom classifiers for the tenant.
    post:
      summary: Hot-apply the tenant's operator-defined custom DLP classifiers (slice C).
      description: Successful responses include tenant_id. Requires admin.dlp.write. Replaces the tenant's whole custom-classifier set ([] = clear) after validation and acceptance by configured storage, then recompiles it into the live scan set (no restart). Missing or null classifiers is rejected. Without configured storage, changes remain in memory only. Concurrent writes have no revision conflict detection. A save error may follow an on-disk write and does not prove disk rollback. Rejects a reserved/malformed name, an over-cap or un-compilable regex (RE2, no backreferences), a regex that matches the empty string, and an empty/over-cap keyword dictionary. Caps — 64 classifiers, 512-char pattern, 256 keywords. The tenant is taken from the admin identity, not the body.
      tags:
        - AdminDLPPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classifiers]
              properties:
                expected_tenant_id:
                  type: string
                  description: Optional precondition. If nonempty, it must equal the authenticated tenant; it never selects a different tenant.
                classifiers:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Lowercase snake_case, 2–40 chars; the label shown in findings (not a secret).
                      description:
                        type: string
                      kind:
                        type: string
                        enum: [regex, keyword]
                      pattern:
                        type: string
                        description: RE2 pattern (regex kind).
                      keywords:
                        type: array
                        items:
                          type: string
                        description: Literal dictionary (keyword kind).
                      case_insensitive:
                        type: boolean
                        description: Regex kind only — match case-insensitively.
      responses:
        "409":
          description: Expected tenant differs from the authenticated context, or this node requires the control plane. No mutation applied here.
        "200":
          description: Classifiers saved to configured storage and applied locally (in-memory only when no store is configured); returns the current live set.
        "400":
          description: Invalid classifiers (bad name, un-compilable/too-broad regex, empty/over-cap dictionary, or over the 64-classifier cap).
        "500":
          description: Saving could not be confirmed. Live definitions are unchanged; the on-disk result may be uncertain. Check storage before retrying.
  /admin/dlp-allowlist:
    get:
      summary: Read the tenant's DLP allowlist (known-safe values, slice F).
      description: Returns tenant_id alongside the list. Requires admin.dlp.read. Returns the operator-declared known-safe values whose DLP matches are suppressed (test cards, sample My Numbers, benign emails). These are values the operator asserts are non-sensitive. The compiled scanner holds hashes; administration stores and signed configuration bundles retain authored values.
      tags:
        - AdminDLPPolicy
      responses:
        "200":
          description: Current allowlist values for the tenant.
    post:
      summary: Hot-apply the tenant's DLP allowlist (false-positive tuning, slice F).
      description: Successful responses include tenant_id. Requires admin.dlp.write. Replaces the tenant's whole list after configured storage confirms the save; without a store it is memory-only. An explicit empty array clears the list. Numeric identifiers normalize digits with spaces, hyphens, parentheses or periods; email ignores case; other detector types use exact trimmed literals. Digits embedded in arbitrary text do not authorize a numeric match. Exact duplicates are removed. There is no revision-based conflict detection. Known-safe authored values are distributed in signed configuration bundles; update publisher and receivers together. Do NOT enter real secrets. Max 1000 values. The tenant is taken from the admin identity.
      tags:
        - AdminDLPPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                expected_tenant_id:
                  type: string
                  description: Optional precondition. If nonempty, it must equal the authenticated tenant; it never selects a different tenant.
                values:
                  type: array
                  maxItems: 1000
                  items:
                    type: string
                  description: Known-safe values to suppress (e.g. a test card, a sample My Number).
      responses:
        "409":
          description: Expected tenant differs from the authenticated context, or this node requires the control plane. No mutation applied here.
        "200":
          description: Allowlist applied; returns the new live values.
        "400":
          description: Invalid request (missing/null values, blank entry or over the 1000-value cap).
        "500":
          description: Saving could not be confirmed. Live exceptions are unchanged; disk may already have changed. Check storage before retrying.
  /admin/dlp-fingerprints:
    get:
      summary: List the tenant's Exact-Data-Match datasets (slice E).
      description: Returns tenant_id alongside the list. Requires admin.dlp.read. Returns each fingerprinted dataset as name + value count — NON-SECRET (the values themselves are never persisted or returned; only salted hashes are stored).
      tags:
        - AdminDLPPolicy
      responses:
        "200":
          description: Datasets (name + count) for the tenant.
    post:
      summary: Fingerprint a sensitive dataset for Exact-Data-Match (slice E).
      description: Successful responses include tenant_id. Requires admin.dlp.write. Creates or replaces a named dataset by fingerprinting the supplied exact values into salted hashes; the scan then raises a finding under that name whenever one of the values appears in egress. Only hashes are stored; protect hashes and salts against guessing of source values. Values must be single ASCII tokens (letters, digits, - _ . @ +) up to 128 bytes. Matching lowercases letters and removes - and _. Normalized duplicates count once and values shorter than five normalized characters are ignored. Unsupported or zero-usable-value replacements are rejected without deleting the old dataset. Configured storage must accept the update before the local scanner changes; without storage this is in-memory only. A storage error may follow a disk write and does not prove rollback. Name must be lowercase snake_case (2–40 chars), not a reserved identifier. Max 100000 values. Tenant from the admin identity.
      tags:
        - AdminDLPPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, values]
              properties:
                expected_tenant_id:
                  type: string
                  description: Optional precondition. If nonempty, it must equal the authenticated tenant; it never selects a different tenant.
                name:
                  type: string
                  description: The identifier name the dataset detections are reported under.
                values:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100000
                  description: Single-token values to fingerprint; at least one must remain after normalization and short-value filtering. Hashed, never stored raw.
      responses:
        "409":
          description: Expected tenant differs from the authenticated context, or this node requires the control plane. No mutation applied here.
        "200":
          description: Dataset accepted by configured storage and applied locally; returns the dataset (name + count) and the tenant's datasets.
        "400":
          description: Invalid name, missing/empty values, unsupported tokens, no usable values, or over the value cap. No replacement is applied.
        "500":
          description: Saving could not be confirmed. Previous live dataset retained; the disk result may be uncertain.
    delete:
      summary: Remove an Exact-Data-Match dataset (slice E).
      description: Successful responses include tenant_id. Requires admin.dlp.write. Deletes the named dataset (?name=) after acceptance by configured storage. An absent dataset is a no-op, with any pending staged changes saved first. Without storage this is in-memory only. Tenant from the admin identity.
      tags:
        - AdminDLPPolicy
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
          description: Dataset identifier to remove.
        - name: expected_tenant_id
          in: query
          required: false
          schema: { type: string }
          description: Optional nonempty tenant precondition, compared with the authenticated context before deletion.
      responses:
        "409":
          description: Expected tenant differs from the authenticated context, or this node requires the control plane. No deletion applied here.
        "200":
          description: Removed (or not present); returns the tenant's remaining datasets.
        "400":
          description: Missing name.
        "500":
          description: Deletion save could not be confirmed. Previous live dataset retained; the disk result may be uncertain.
  /admin/dlp-policies:
    get:
      summary: List the reusable named DLP Policy objects (S5).
      description: Requires admin.dlp.read. Returns the tenant's named DLP Policies — each a reusable bundle of detectors (identifiers) + action + instance scope + device-risk conditions that egress rules select by id.
      tags:
        - AdminDLPPolicy
      responses:
        "200":
          description: The tenant's DLP Policies.
    post:
      summary: Create or update a named DLP Policy (S5).
      description: Requires admin.dlp.write (and DLP licensed). Upserts a named DLP Policy {name, identifiers, on_match, instance_scope, device_risk[]}. id optional (generated when absent). Identifiers must resolve to a built-in, custom identifier, or EDM dataset. Tenant from the admin identity.
      tags:
        - AdminDLPPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                identifiers:
                  type: array
                  items:
                    type: string
                on_match:
                  type: string
                  enum: [observe, warn, block, authenticate]
                instance_scope:
                  type: string
                  enum: [any, corporate, personal]
                device_risk:
                  type: array
                  items:
                    type: object
                    properties:
                      min_count:
                        type: integer
                      min_distinct_types:
                        type: integer
                      same_destination:
                        type: boolean
                      window_seconds:
                        type: integer
                      destination_class:
                        type: string
                        enum: [any, personal]
                      severity:
                        type: string
      responses:
        "200":
          description: Applied; returns the policy and the tenant's policies.
        "400":
          description: Invalid policy (unknown identifier/action/scope, missing name).
        "403":
          description: DLP is not licensed for this tenant.
    delete:
      summary: Delete a named DLP Policy (S5).
      description: Requires admin.dlp.write. Removes the policy by ?id=. Tenant from the admin identity.
      tags:
        - AdminDLPPolicy
      responses:
        "200":
          description: Removed (or not present); returns the remaining policies.
        "400":
          description: Missing id.
  /admin/operator-delegation:
    put:
      summary: Grant or withdraw this organization's standing delegation to the operator.
      description: >-
        The operator holds none of a customer's write permissions in its own right. An organization that has
        asked the operator to run it sets this, and from then on an operator acting inside it (X-Operate-Tenant)
        does that organization's ordinary work with that organization's ordinary permissions — the shape
        delegated administration takes everywhere else in this industry, granted once at onboarding rather than
        justified per session.


        Either side may write it: the operator sets it at onboarding, and the organization can withdraw it. A
        delegation only the holder can end is not a delegation. Body: {managed, elevation_requires_approval}.


        It deliberately does NOT reach the acts that are irreversible or take effect across the whole
        organization at once; those need a time-boxed elevation on top (POST /admin/operator-elevations), so
        the standing delegation can never be the credential that revokes an authority or strands a fleet. Nor
        does it reach the operator's own platform powers — a customer's signature must not widen what the
        operator can do to the installation.
      tags:
        - AdminOperatorAccess
      responses:
        "200":
          description: The delegation as it now stands.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such organization.
        "409":
          description: Authored on the control plane, or the operator's own organization.
  /admin/operator-elevations:
    post:
      summary: Take a time-boxed elevation over one organization. No reason field, by decision.
      description: >-
        Required for the acts an operator may not perform under the standing delegation alone: revoking or
        replacing an organization's interception authority, withdrawing a device CA, retiring its identity
        basis, and the kill-switch. Body: {minutes}, bounded — an elevation without a short end is the standing
        permission this design exists to avoid.


        There is deliberately no reason field. The industry pattern for support access is a customer-granted,
        time-boxed window rather than an operator-typed justification, and free text rots into "support" /
        "investigating" while the field stays full — a record that looks like accountability and carries
        nothing. What the organization is shown instead is who, when, for how long, and what was done.


        Ends by the clock; nothing renews it silently. Requires the organization to have delegated its
        management first — elevation adds to a delegation, it does not replace one.
      tags:
        - AdminOperatorAccess
      responses:
        "201":
          description: Granted. Active immediately, unless the organization requires its own approval.
        "400":
          description: No organization named, or the duration is outside the permitted range.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: That organization has not delegated its management, or this is a config-pulling Edge.
  /admin/operator-elevations/{id}:
    delete:
      summary: End an elevation early — either side may.
      description: >-
        The operator when the work is finished, or the organization at any time. An elevation the customer
        cannot stop is not one they granted.
      tags:
        - AdminOperatorAccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No open elevation with that id over that organization.
  /admin/operator-elevations/{id}/approve:
    post:
      summary: Approve an elevation over your own organization.
      description: >-
        For organizations that set elevation_requires_approval. A tenant act by construction — it reads the
        caller's OWN tenant rather than the operate-within header, because an operator approving its own
        elevation would make the setting decorative. A pending elevation is not active.
      tags:
        - AdminOperatorAccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved; the elevation is now active until it expires.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No elevation over your organization is waiting for approval with that id.
  /admin/break-glass-token:
    get:
      summary: Whether the shared break-glass token is armed on this node, and whether anybody has used it.
      description: >-
        -admin-token authorises as OWNER of this node's organization and attributes every act to a synthetic
        principal rather than a person, so an act performed with it cannot answer "who". It is for the case
        where the admin auth store is genuinely unreachable; named principals and API tokens are the ordinary
        path.


        It is OFF unless -admin-token-break-glass-armed is set. Before that flag existed the token was accepted
        on every request by virtue of being configured, which is how a deployment ends up with a day of PKI
        work recorded against admin_legacy_token.


        This route exists because the armed state was otherwise discoverable only by reading a process log line
        printed at boot — which is to say, not discoverable. Every act performed with the token is additionally
        recorded in the audit trail as admin_break_glass_used, separately from the ordinary config-change row,
        because "what changed" and "was anybody holding the master key today" are different questions.
      tags:
        - AdminOperatorAccess
      responses:
        "200":
          description: configured, armed, uses since boot, and when it was last accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/organization-setup:
    get:
      summary: What still has to be done before this organization actually works.
      description: >-
        A registry row is the entrance, not the finish. An organization can exist in every list, be selectable
        in every menu, and enforce nothing — and until this route existed the only way to find out was to call
        twelve others and know what each answer meant. Twelve routes is also twelve chances to answer the
        tenant-boundary question differently, which is a defect family this codebase has paid for repeatedly.


        Each entry says what the feature LETS YOU DO, not only whether it is set: a checklist that reports
        done/not-done tells an operator something is missing and not what they lose by leaving it, so it gets
        ignored in exactly the order that matters least. Each entry also names the route that SETS it, so a
        screen can offer the setting instead of describing it.


        Three states, and the third is the point: done, missing, and not_here — THIS node is not the plane that
        holds the fact. A node answers only for what it is authoritative about and says where to ask for the
        rest (`owner`), so the two planes' answers are complementary halves rather than two partial pictures a
        reader has to know not to trust. Measured on both, the same organization read "device identity: done,
        expires in 1812 days" on the Edge and "not held here" on the control plane; before this correction it
        read "unavailable, and therefore broken".


        Holding a store is not owning the fact, and that had to be made explicit: the Edge has a local
        admin-credential store, so it reported "no administrator" for an organization with twenty-three of
        them on the control plane.


        `operational` is the answer the registry row cannot give: whether anything actually happens for this
        organization. THREE-VALUED — yes / no / unknown — because as a boolean the control plane answered true
        at 5 of 13: every blocking item it could see was fine, and the two it could not see were the ones that
        decide whether traffic is inspected at all. "Nothing I can see is wrong" is not "this works". A screen
        wanting a definite answer asks both planes and takes, for each item, the one that is not not_here.


        `measured_on` names the node that produced the answer, because an answer that does not say where it
        came from invites the reader to treat one half as the whole.


        Scoped like every other per-organization read: an operator names the organization with
        X-Operate-Tenant, and a tenant administrator gets their own and only their own.
      tags:
        - AdminTenants
      responses:
        "200":
          description: The items, the count, and whether the organization is operational.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/operator-access:
    get:
      summary: What the operator's access to this organization has been.
      description: >-
        The organization's own view: whether it has delegated its management, whether it requires approval,
        and every elevation over it — active, pending, ended and expired — with who took it, when, and for how
        long. Scoped like every other per-organization read: a tenant sees only its own.


        Ordinary changes made under the delegation are not listed here; they appear in this organization's
        audit trail as operate-within entries. This list is the elevations, which are the acts that could not
        be undone or reached the whole organization at once.
      tags:
        - AdminOperatorAccess
      responses:
        "200":
          description: The delegation state and the elevation history.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such organization.
  /admin/organization-domains:
    get:
      summary: Read the organization ("our company") domains (S6).
      description: Requires admin.config.read. Returns the tenant's organization domains — the explicit, multi-value set that DLP instance-aware action (corporate vs personal) references to decide "is this account one of ours?". The corporate-domain resolver is these ∪ the IdP verified_domains.
      tags:
        - AdminEntitlements
      responses:
        "200":
          description: The tenant's organization domains.
    put:
      summary: Set the organization domains (S6).
      description: Requires admin.config.write. Replaces the tenant's organization domains (normalized lowercase, de-duplicated; a leading @ or *. is stripped). Multiple domains supported (brands / ccTLDs). Tenant from the admin identity.
      tags:
        - AdminEntitlements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domains:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Applied; returns the normalized domains.
  /admin/entitlements:
    get:
      summary: Read the tenant's feature entitlements (the license gate).
      description: >-
        Requires admin.read. Returns the tenant's resolved paid-feature flags (e.g. {"dlp": true}) — explicit
        license grant if present, else the deployment default. Drives the Console's show/hide of paid-feature
        surfaces.
      tags:
        - AdminEntitlements
      responses:
        "200":
          description: The tenant's resolved feature flags.
    put:
      summary: Set the tenant's feature entitlements (license apply / admin override).
      description: >-
        Requires admin.write. Grants or revokes paid features for the tenant (e.g. {"features": {"dlp":
        false}}). A license file/server drives this in production; the admin API allows an override. Tenant
        from the admin identity.
      tags:
        - AdminEntitlements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                features:
                  type: object
                  additionalProperties:
                    type: boolean
      responses:
        "200":
          description: Entitlements applied; returns the tenant's resolved flags.
  /admin/dns-policy:
    get:
      summary: Read the current Edge DNS ruleset ().
      description: >-
        Requires admin.dns.read. Returns the live DNS-layer policy — deny (NXDOMAIN), sinkhole (resolve to a
        controlled IP), stub_ipv4 (deterministic protected-app steering), and ech_strip. deny/sinkhole match
        the named domain AND its subdomains (domain-tree). See docs/FR_STATUS.md
      tags:
        - AdminDNSPolicy
      responses:
        "200":
          description: Current DNS ruleset.
    put:
      summary: Hot-apply a new Edge DNS ruleset ().
      description: Requires admin.dns.write. Atomically replaces the live DNS ruleset (no restart). Rejects non-IPv4 sinkhole/stub targets (a bad IP would fail open) and a name that is both denied and sinkholed.
      tags:
        - AdminDNSPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deny:
                  type: array
                  items:
                    type: string
                sinkhole:
                  type: object
                  additionalProperties:
                    type: string
                stub_ipv4:
                  type: object
                  additionalProperties:
                    type: string
                ech_strip:
                  type: boolean
                  description: >-
                    Strip the ECH (Encrypted ClientHello) SvcParam from HTTPS/SVCB DNS answers so clients fall
                    back to plaintext SNI, keeping ECH-advertising CDNs reachable through the decrypt-all Edge.
                    Defaults ON; OMIT this field to keep the secure default — a PUT that omits it does NOT
                    disable strip. Send false only to explicitly opt out (e.g. a resolver-only, non-intercepting
                    deployment).
      responses:
        "200":
          description: Ruleset applied; returns the new live ruleset.
        "400":
          description: Invalid ruleset (bad IP, empty name, or deny/sinkhole collision).
  /admin/east-west:
    get:
      summary: Return east-west per-hop authorization status for the tenant.
      description: Requires admin.eastwest.read. Reports whether east-west (internal/lateral) per-hop authorization is enabled and the configured rules ((source x destination x protocol) -> allow/authenticate/deny). See docs/east_west_per_hop_authorization_design.md.
      tags:
        - AdminEastWest
      responses:
        '200':
          description: East-west per-hop authorization status.
    post:
      summary: Enable/disable east-west authorization and/or replace the rule set for the tenant.
      description: Requires admin.eastwest.write. When enabled, east-west-protocol requests are governed solely by the rules with default-deny, hot-applied to the live decision path with no restart. Rules, when present, replace the whole rule set.
      tags:
        - AdminEastWest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: When present, toggles east-west enforcement for the tenant.
                max_grant_ttl_seconds:
                  type: integer
                  description: When present, sets the per-tenant ceiling on east-west grant lifetime (0 = no cap). The maximum is admin-configurable and not hard-capped.
                rules:
                  type: array
                  description: When present, replaces the whole east-west rule set.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      priority:
                        type: integer
                      source_users:
                        type: array
                        items:
                          type: string
                      source_groups:
                        type: array
                        items:
                          type: string
                      destinations:
                        type: array
                        items:
                          type: string
                      protocols:
                        type: array
                        items:
                          type: string
                      mode:
                        type: string
                        enum: [allow, authenticate, deny]
                      max_ttl_seconds:
                        type: integer
                        description: Caps grants issued for this rule (sensitivity tiering). 0 = no per-rule cap.
      responses:
        '200':
          description: Resulting east-west per-hop authorization status.
  /admin/east-west/challenges:
    get:
      summary: List pending east-west authentication challenges (held flows) for the tenant.
      description: Requires admin.eastwest.read. Returns the flows currently HELD at the Edge pending the out-of-band authentication ceremony (east-west authenticate mode). Each challenge is bound to (identity x device x destination x protocol). No IP/host/secret material is returned.
      tags:
        - AdminEastWest
      responses:
        '200':
          description: Pending east-west authentication challenges.
  /admin/east-west/observations:
    get:
      summary: List the observed east-west lateral flows (Observe inventory) + convergence readiness.
      description: Requires admin.eastwest.read. Returns the recorded lateral flows (source device or Any, destination, service, port) with per-flow coverage computed against the CURRENT east-west rules, plus convergence stats (coverage %, uncovered-flow count, newest-uncovered first-seen) — the readiness signal before disabling Allow-all (Full Enforce). Recording only; no enforcement. See docs/east_west_policy_learning_lifecycle_gap.md.
      tags:
        - AdminEastWest
      responses:
        '200':
          description: East-west flow-observation inventory + convergence stats.
  /admin/east-west/observations/adopt:
    post:
      summary: Adopt selected observed east-west flows into authored allow rules (S2 Candidate).
      description: Requires admin.policy.write. Takes observation_ids and materializes each UNCOVERED flow into a plane=east_west rule with who=Any (source=["*"]) and access=allow — the safe first state, not deny. Idempotent — flows already covered by an effective rule are skipped (no duplicate). The service is resolved from the observed port. Returns created rule ids plus skipped_covered / skipped_missing. Adopted rules are ordinary authored rules (editable/deletable in the Rules UI). See docs/east_west_policy_learning_lifecycle_gap.md.
      tags:
        - AdminEastWest
      responses:
        '200':
          description: Adoption result (created rule ids, skipped_covered, skipped_missing).
  /admin/east-west/grants:
    get:
      summary: List active ephemeral east-west grants for the tenant.
      description: Requires admin.eastwest.read. Returns the active grants that currently RELEASE authenticate-mode holds, each bound to (identity x device x destination x protocol) with an expiry. No IP/host/secret material is returned.
      tags:
        - AdminEastWest
      responses:
        '200':
          description: Active east-west grants.
    post:
      summary: Issue an east-west grant directly (admin pre-authorization).
      description: Requires admin.eastwest.write. Issues an ephemeral grant from explicit binding (identity x device x destination x protocol) without an out-of-band ceremony (e.g. break-glass / pre-provisioned access). ttl_seconds defaults to 1 day. Hot-applied to the live decision path.
      tags:
        - AdminEastWest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, protocol]
              properties:
                subject_user_id:
                  type: string
                device_id:
                  type: string
                destination:
                  type: string
                protocol:
                  type: string
                ttl_seconds:
                  type: integer
                  description: Grant lifetime in seconds. Defaults to 1 day when omitted. Capped by the per-rule sensitivity tier and the per-tenant maximum.
                idle_ttl_seconds:
                  type: integer
                  description: Idle expiry in seconds (the grant stops releasing if unused for this long, before its absolute TTL). 0 = no idle limit.
      responses:
        '200':
          description: The issued east-west grant.
  /admin/east-west/grants/revoke:
    post:
      summary: Revoke east-west grants for the tenant or a device/user scope.
      description: Requires admin.eastwest.write. Deletes active grants (E5 continuous revocation). scope_type ""/"tenant" revokes all tenant grants; "device"/"user" with scope_id revokes that actor's grants. This is also invoked automatically when Ransomware Protection activates for a scope/tenant (link), so a careful lateral attacker's pre-compromise grant is cut, not merely suspended.
      tags:
        - AdminEastWest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope_type:
                  type: string
                  enum: [tenant, device, user]
                scope_id:
                  type: string
      responses:
        '200':
          description: Number of grants revoked.
  /admin/swg/tenant-restriction:
    get:
      summary: Return SWG tenant-restriction runtime status.
      description: Requires admin.swg.read. Surfaces the live SWG tenant-restriction resolver state and the policy-bundle tenant-restriction rules (status/active/header_name/ref/kind/enforcement_mode). Header value material (allowed-domains, allowed-tenant-ids) is never returned.
      tags:
        - AdminSWG
      responses:
        '200':
          description: SWG tenant-restriction status.
    post:
      summary: Save tenant-owned SaaS restriction configuration.
      description: Requires admin.swg.write and a selected tenant. Built-in providers are available without startup files. Save provider, allowed_value, enabled, and (for Microsoft 365) context_tenant_id on the control plane; the durable configuration is distributed to Edges. Omitted values are retained and explicit empty values clear them. Enabling requires valid allowed values. Responses never disclose the values. Legacy startup-file rows also accept header_value_updates and saas_enablement; these cannot be mixed with the provider form.
      tags:
        - AdminSWG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum: [google_workspace, microsoft_365, openai_chatgpt, anthropic_claude]
                allowed_value:
                  type: string
                  maxLength: 8192
                  description: Provider allowlist. Omit to keep; empty clears while disabled.
                context_tenant_id:
                  type: string
                  description: Microsoft Entra directory GUID that owns the restriction policy.
                enabled:
                  type: boolean
                  description: Explicit enforcement toggle. New providers default to disabled.
                header_value_updates:
                  type: object
                  description: operator_config_ref:* -> new non-secret header value. Updates already-configured active refs.
                  additionalProperties:
                    type: string
                saas_enablement:
                  type: object
                  description: saas_application_id -> desired enabled state (true=active, false=inactive). Toggles tenant-restriction enforcement for the SaaS on the live decision path. Enabling requires the rule's header value to be resolvable.
                  additionalProperties:
                    type: boolean
      responses:
        '200':
          description: Updated SWG tenant-restriction status with applied refs and applied saas toggles.
  /admin/usage/summary:
    get:
      summary: Return tenant-scoped Usage Meter summary.
      description: Requires admin.usage.read. Aggregates observed UsageMeter records for the authenticated tenant. Human/NHI seats and decisions are summed; automation concurrency and decision burst meters report the peak value for the requested window.
      tags:
        - AdminUsage
      parameters:
        - name: period_start
          in: query
          required: false
          description: RFC3339 inclusive lower bound. Defaults to the first day of the current UTC month.
          schema:
            type: string
            format: date-time
        - name: period_end
          in: query
          required: false
          description: RFC3339 exclusive upper bound. Defaults to the first day of the next UTC month.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Usage summary for the authenticated tenant and period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageMeterSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/usage/health:
    get:
      summary: Return Usage Meter store health.
      description: Requires admin.usage.read. Reports the configured Usage Meter store mode and any tenant-scoped process-local or local-spool records awaiting PostgreSQL replay. Error details are sanitized for operators.
      tags:
        - AdminUsage
      responses:
        "200":
          description: Usage Meter health for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageMeterHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/events/trends:
    get:
      summary: Tenant event-activity time series from the ingest-time rollup.
      description: >-
        Requires admin.usage.read. Returns per-(time bucket, stream, finding_type, action) event counts and distinct
        users/destinations/devices for the authenticated tenant, served from the ClickHouse ingest-time rollup
        (event_log_design.md ) so the query cost is independent of raw flow count. Returns 501 when the configured
        hot store keeps no rollup (JSONL/Postgres backends).
      tags:
        - AdminUsage
      parameters:
        - name: from
          in: query
          required: false
          description: RFC3339 inclusive lower bound. Defaults to 24h before "to".
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: RFC3339 exclusive upper bound. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: granularity
          in: query
          required: false
          description: Bucket size. One of 5m (rollup native), 1h, or 1d. Defaults to 5m.
          schema:
            type: string
            enum: ["5m", "1h", "1d"]
        - name: stream
          in: query
          required: false
          description: Optional equality filter on the event stream (e.g. inspection_events, access, audit).
          schema:
            type: string
        - name: finding_type
          in: query
          required: false
          description: Optional equality filter on the finding type (e.g. dlp_match).
          schema:
            type: string
      responses:
        "200":
          description: Event-activity time series for the authenticated tenant and window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  granularity:
                    type: string
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        bucket:
                          type: string
                          format: date-time
                        stream:
                          type: string
                        finding_type:
                          type: string
                        action:
                          type: string
                        events:
                          type: integer
                          format: int64
                        users:
                          type: integer
                          format: int64
                        destinations:
                          type: integer
                          format: int64
                        devices:
                          type: integer
                          format: int64
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: The configured hot store keeps no ingest-time rollup (trends require the ClickHouse backend).
  /admin/connector-program:
    get:
      summary: The connector program an administrator carries to the machine inside the customer's network.
      description: >-
        Requires admin.connectors.read. "Add connector" hands over a profile and the line that installs a
        connector with it; this is where the program in that line comes from. A connector cannot use the
        endpoint agent's signed artifact route — that one is served inside the tunnel under mandatory mTLS,
        and a connector has no identity until the program it does not have has enrolled it — so it is carried
        by the same person, in the same visit to the same screen. The organization's own published program is
        served if it has one, otherwise the program this deployment itself runs. The response carries
        X-Artifact-Sha256 so whoever carries the bytes can check what arrived.
      tags:
        - AdminConnectors
      parameters:
        - in: query
          name: platform
          required: true
          schema: { type: string }
        - in: query
          name: arch
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The program bytes.
        "404":
          description: This deployment holds no connector program for that platform and architecture.
    put:
      summary: Publish a connector program for one platform and architecture.
      description: >-
        Requires admin.platform.write. The bytes live with the authority, so an Edge that pulls its
        configuration refuses this and says where to publish instead. X-Artifact-Sha256 is REQUIRED and the
        upload is refused when the bytes do not match it: without something to check against, a truncated
        upload lands and is then downloaded by a customer and run on a machine inside their network. The
        digest is an integrity check on the carry, not an authorisation of the bytes — what authorises them is
        that an operator of this deployment put them here.
      tags:
        - AdminConnectors
      parameters:
        - in: query
          name: platform
          required: true
          schema: { type: string }
        - in: query
          name: arch
          required: true
          schema: { type: string }
        - in: header
          name: X-Artifact-Sha256
          required: true
          schema: { type: string }
        - in: header
          name: X-Artifact-Filename
          required: false
          schema: { type: string }
      responses:
        "200":
          description: What was stored.
        "400":
          description: No digest, a digest the bytes do not match, or a platform/architecture that is not one.
        "409":
          description: This node pulls its configuration and holds no programs; publish to the control plane.
  /admin/connector-programs:
    get:
      summary: Which connector programs this deployment can hand a customer.
      description: >-
        Requires admin.connectors.read. Returns the deployment's own program together with anything published
        for this organization, and a note saying what an empty list means for somebody about to walk to a
        machine — a screen showing "0" cannot be acted on by the person reading it.
      tags:
        - AdminConnectors
      responses:
        "200":
          description: The programs, with their digests and sizes.
  /admin/agent-update-artifact:
    get:
      summary: The bytes of the currently published release, for an Edge that does not hold them.
      description: >-
        Requires admin.agents.read. Admin-only, unlike the device-facing artifact route: this is how an
        enforcing Edge asks the control plane for a release it publishes but has not got, and there is no reason
        to widen it. The response carries X-Dsse-Agent-Update-Version.
      tags:
        - AdminAgentRollout
      parameters:
        - in: query
          name: platform
          required: true
          schema: { type: string }
        - in: query
          name: arch
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The artifact bytes.
        "404":
          description: Nothing published for that target, or the control plane does not hold its artifact.
    put:
      summary: Upload the bytes a published manifest authorises.
      description: >-
        Requires admin.agents.write. The manifest must be published FIRST — bytes with nothing to check them
        against would make this a place to stage anything — and the body is verified against that manifest's
        size and digest before it is stored. Refused on an enforcing edge, which pulls artifacts rather than
        holding authority for them.
      tags:
        - AdminAgentRollout
      parameters:
        - in: query
          name: platform
          required: true
          schema: { type: string }
        - in: query
          name: arch
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored; edges fetch it when they find they do not hold it.
        "400":
          description: These bytes are not the ones the published manifest authorises.
        "409":
          description: This process is an enforcing edge; upload on the control plane.
        "412":
          description: Nothing published for that target yet, or no artifact directory here.
  /admin/agent/device-updates:
    get:
      summary: What each device did with the release it was offered.
      description: >-
        Requires admin.agents.read. The per-device view behind the fleet summary: which release each device is
        being offered, what it last reported, and — when it refused — the device's own sentence and the digest
        of the document it refused. Carries a `coverage` block naming the population every number was computed
        over, because a fleet where nine machines are silent and one failed is not "one problem".
      tags:
        - AdminAgentRollout
      responses:
        "200":
          description: Per-device update state, with the coverage it was computed over.
  /admin/agent-updates:
    get:
      summary: The signed release manifests this control plane publishes to the fleet.
      description: >-
        Requires admin.agents.read. Returns the CALLER'S TENANT's signed manifest envelopes, keyed platform/arch,
        alongside the tenant_id they are for. `envelopes` holds only releases whose ARTIFACT is present — it is
        what an edge adopts. `pending` holds releases that are published and verified but still waiting for their
        bytes; nothing offers them to a device until the artifact upload activates them. Enforcing edges PULL this and verify each envelope against their own
        pinned update key — and check the tenant — before relaying it: an edge that trusted the channel would let a
        compromised control plane choose what its fleet runs, and one that ignored the tenant could hand another
        tenant's build to its own devices.
      tags:
        - AdminAgentRollout
      responses:
        "200":
          description: The published set.
    put:
      summary: Publish a signed release manifest to the fleet.
      description: >-
        Requires admin.agents.write. The body is a manifest envelope signed ELSEWHERE — this control plane never
        signs, it verifies against -agent-update-pin and stores. Refused on an enforcing edge, which pulls its
        published set and would overwrite a local write on the next poll. Persisted before it is acknowledged;
        a wrongly-signed or expired manifest fails here, on the machine where the release was made, rather than
        on every endpoint that stages it and then refuses. Publishing needs no edge restart.
      tags:
        - AdminAgentRollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A dsse_agent_update_manifest.v1 signed envelope.
      responses:
        "200":
          description: Published; edges adopt it on their next poll.
        "400":
          description: The manifest will not verify, or is expired.
        "409":
          description: This process is an enforcing edge; publish on the control plane.
        "412":
          description: No update-signing key is pinned here, so nothing can be checked.
    post:
      summary: Sign and publish a release — the key stays in the token.
      description: >-
        Requires admin.agents.write. The body is the manifest FIELDS, not an envelope: this control plane signs
        them with the update-signing key held in a PKCS#11 token (-agent-update-hsm-agent-socket) and then takes
        the identical path as PUT — verify against the pinned key, record the audit attempt before the store is
        touched, activate or hold for the artifact. It exists so that publishing does not require the most
        dangerous key in the product to sit in a file on somebody's laptop. Unknown fields are REFUSED rather
        than ignored: a field this build does not understand, silently dropped, is a constraint the operator
        asked for and did not get, signed into a manifest that says otherwise. The key is enforced to be
        DIFFERENT from the agent-policy key — one key signing both a release and the rollout plan means a
        compromised release key can also lift the freeze that would stop it. A version older than one already
        signed for the same target is refused (409): device-side publisher verification cannot refuse an old
        build this publisher genuinely made, so the downgrade is stopped at the point of signature. Re-signing
        the SAME version is allowed, because manifests expire and rolling a device back needs no manifest at all.
      tags:
        - AdminAgentRollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The agentupdate.Manifest fields (version, platform, arch, delivery, artifact digest/size, validity).
      responses:
        "200":
          description: Signed and published; edges adopt it on their next poll.
        "400":
          description: The fields are not a valid manifest, or carry an unknown field.
        "409":
          description: An enforcing edge, or a version older than the signing floor for that target.
        "412":
          description: This control plane holds no update-signing key, or pins none.
  /admin/agent-update-sign-floor:
    get:
      summary: The versions this control plane will not sign below, per target.
      description: >-
        Requires admin.agents.read. Returns the highest version signed for each tenant/platform/arch and the
        public key this control plane signs with, so a refusal is something an operator can anticipate rather
        than work around by inventing a version number. The floor is raised by every successful publication
        through either door and is never lowered — withdrawing a release is exactly what an attacker who wanted
        to re-sign an old version would do first.
      tags:
        - AdminAgentRollout
      responses:
        "200":
          description: The per-target signing floor.
  /admin/agent-rollout:
    get:
      summary: Read the tenant's agent rollout/rollback plan + fleet adoption ().
      description: Requires admin.agents.read. Returns the admin-managed rollout plan (desired version, release channel, intent, freeze) the runtime per-device rollout endpoint consults, plus the fleet update-adoption summary (which versions devices have moved to).
      tags:
        - AdminAgentRollout
      responses:
        "200":
          description: Current rollout plan + fleet adoption summary.
    put:
      summary: Drive an agent rollout, rollback, or incident freeze ().
      description: Requires admin.agents.write. Hot-applies a desired rollout state (no restart). intent=rollout|rollback requires desired_version (the version the fleet should converge to — a rollback simply targets a known-good version); intent=freeze halts all movement so a bad rollout can be stopped instantly. Audited.
      tags:
        - AdminAgentRollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - intent
              properties:
                intent:
                  type: string
                  enum: [rollout, rollback, freeze]
                desired_version:
                  type: string
                release_channel:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Rollout plan applied.
        "400":
          description: Invalid plan (bad intent, or missing desired_version for rollout/rollback).
  /admin/agent-rollouts:
    get:
      summary: Read every organization's agent rollout plan.
      description: Requires admin.agents.read. An Edge serves every organization on the deployment, and being told about one of them means holding all the others for ever — never told anything, so never moving. A caller answering for the whole deployment is given every organization's plan; a caller inside an organization is given its own and nobody else's.
      tags:
        - AdminAgentRollout
      responses:
        "200":
          description: One plan per organization, keyed by organization id.
  /admin/agent/quality:
    get:
      summary: Return tenant-scoped Agent quality summary.
      description: Requires admin.usage.read. Aggregates registered device status, stale heartbeats, target-version coverage, observed agent status reports, agent update outcomes, and access-decision route coverage for the authenticated tenant. This is the Phase 1 API boundary for the Alpha Agent quality gate.
      tags:
        - AdminUsage
      responses:
        "200":
          description: Agent quality summary for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentQualitySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/human-identities:
    get:
      summary: List tenant-scoped Human Identities.
      description: Requires admin.identity.read. The Human Identity Directory is the preferred human_seat Usage Meter source when populated; otherwise Usage Meter falls back to Admin Auth principal counts for Phase 1 compatibility.
      tags:
        - AdminIdentity
      parameters:
        - in: query
          name: source
          schema:
            type: string
          description: Optional exact source filter, for example scim, idp, hris, or lab_import.
        - in: query
          name: status
          schema:
            type: string
            enum: [active, suspended, deleted]
          description: Optional exact status filter.
        - in: query
          name: subject
          schema:
            type: string
          description: Optional exact subject filter.
        - in: query
          name: email
          schema:
            type: string
          description: Optional exact email filter.
        - in: query
          name: import_run_id
          schema:
            type: string
          description: Optional exact import run trace filter for identities written or deactivated by a directory import.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Maximum rows returned. Values outside 1..1000 are clamped.
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque cursor returned by the previous Human Identity list response.
      responses:
        "200":
          description: Human identities for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Upsert a tenant-scoped Human Identity.
      description: Requires admin.identity.write. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. Bearer automation requests do not use CSRF. Upserted active identities are used by Usage Meter as the observe-only human_seat governance source. Admin audit metadata for this write records presence/counts only with human_identity_metadata_recorded_scope=none.
      tags:
        - AdminIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanIdentityWrite"
      responses:
        "200":
          description: Upserted Human Identity Directory entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: The configured directory persister rejected the save. The candidate identity and configuration generation were not published. Storage details are omitted.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /admin/human-identities/import-runs:
    get:
      summary: List Human Identity import run summaries.
      description: Requires admin.identity.read. Summaries are derived from Human Identity metadata import_run_id and deactivated_by_import_run_id traces.
      tags:
        - AdminIdentity
      parameters:
        - in: query
          name: source
          schema:
            type: string
          description: Optional exact source filter. Matches both import_source and deactivated_by_import_source.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 25
          description: Maximum import runs returned. Values outside 1..1000 are clamped.
      responses:
        "200":
          description: Human Identity import run summaries for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentityImportRunList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/human-identities/sources:
    get:
      summary: List Human Identity source summaries.
      description: Requires admin.identity.read. Returns tenant-scoped counts by directory source so operators can see active, suspended, deleted, and expired identity distribution without scanning the full directory.
      tags:
        - AdminIdentity
      responses:
        "200":
          description: Human Identity source summaries for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentitySourceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/human-identities/sources/policies:
    get:
      summary: List Human Identity source policies.
      description: Requires admin.identity.read. Returns tenant-scoped source policy/catalog rows used to prepare SCIM, OIDC, HRIS, CSV, or manual connector rollout and source health expectations.
      tags:
        - AdminIdentity
      responses:
        "200":
          description: Human Identity source policies for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentitySourcePolicyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Upsert a Human Identity source policy.
      description: Requires admin.identity.write. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. Source policies are an operator catalog for import cadence, stale health thresholds, and future SCIM/IdP connector reconciliation behavior. Admin audit metadata for this write records presence/counts only with human_identity_source_policy_metadata_recorded_scope=none.
      tags:
        - AdminIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanIdentitySourcePolicyWrite"
      responses:
        "200":
          description: Upserted source policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentitySourcePolicy"
        "400":
          description: Invalid source policy.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/human-identities/sources/due:
    get:
      summary: List Human Identity sources due for import.
      description: Requires admin.identity.read. Returns enabled source policies with an expected import interval that are either unobserved or past their next_expected_at. This is an operator/scheduler contract for future SCIM, OIDC, HRIS, CSV, or manual connector runners.
      tags:
        - AdminIdentity
      responses:
        "200":
          description: Human Identity source policies currently due for connector import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentitySourceDueList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/human-identities/sources/state:
    get:
      summary: List Human Identity source sync state.
      description: Requires admin.identity.read. Returns the latest successful import checkpoint recorded per directory source. Dry-run imports do not update source state.
      tags:
        - AdminIdentity
      responses:
        "200":
          description: Human Identity source sync states for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentitySourceStateList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/human-identities/sources/health:
    get:
      summary: Get Human Identity source health.
      description: Requires admin.identity.read. Derives per-source health from the latest observed import/deactivation timestamp. Sources without import metadata are reported as unknown rather than degraded.
      tags:
        - AdminIdentity
      parameters:
        - in: query
          name: stale_after_seconds
          schema:
            type: integer
            minimum: 60
            maximum: 2592000
            default: 86400
          description: Observation age threshold used to mark a source as stale. Values outside 60 seconds to 30 days are clamped.
      responses:
        "200":
          description: Human Identity source health for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentitySourceHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/human-identities/import-runs/{import_run_id}:
    get:
      summary: Get a Human Identity import run detail.
      description: Requires admin.identity.read. Returns the summary plus current identity rows written or deactivated by the requested import run trace.
      tags:
        - AdminIdentity
      parameters:
        - in: path
          name: import_run_id
          required: true
          schema:
            type: string
          description: Import run trace ID. Slash characters are rejected by the server-side import run ID validator.
      responses:
        "200":
          description: Human Identity import run detail for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentityImportRunDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/human-identities/import:
    post:
      summary: Bulk import tenant-scoped Human Identities.
      description: Requires admin.identity.write. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. This endpoint is the Phase 1 SCIM/IdP/HRIS import boundary for observe-only human_seat governance snapshots; it upserts at most 500 identities per request. Admin audit metadata for this write records counts/presence only with human_identity_import_metadata_recorded_scope=none.
      tags:
        - AdminIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanIdentityImportRequest"
      responses:
        "200":
          description: Human Identity import result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentityImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: An identity save failed. Imports may have committed earlier items; inspect the directory before retrying. Storage details are omitted.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /identity-sources/due:
    get:
      summary: List Human Identity sources due for connector import.
      description: Runtime endpoint for connector runners. Requires x-connector-secret outside lab mode. If x-connector-id identifies a registered connector with metadata.runtime_secret_hash, the header must contain that connector-specific runtime secret; connectors without a runtime hash retain the shared-secret fallback during the Phase 1 migration. Returns the same tenant-scoped due-source contract as the Admin API without requiring an Admin session. When x-connector-id is provided, source policies whose metadata.connector_id targets another connector are filtered out.
      tags:
        - EdgeRuntime
      security:
        - ConnectorSecret: []
      parameters:
        - name: x-connector-id
          in: header
          required: false
          description: Optional connector identifier used to scope due source policies by metadata.connector_id and select a registered connector-specific runtime secret when metadata.runtime_secret_hash is present.
          schema:
            type: string
      responses:
        "200":
          description: Human Identity source policies currently due for connector import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentitySourceDueList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /identity-sources/import:
    post:
      summary: Import Human Identity records from a connector runner.
      description: Runtime endpoint for connector runners. Requires x-connector-secret outside lab mode. If x-connector-id identifies a registered connector with metadata.runtime_secret_hash, the header must contain that connector-specific runtime secret; connectors without a runtime hash retain the shared-secret fallback during the Phase 1 migration. The server applies source policy defaults such as reconcile_missing when the request omits them, records source state/checkpoint on successful non-dry-run imports, and emits a human_identities_imported audit event. When x-connector-id is provided, imports are rejected if the matching source policy metadata.connector_id targets a different connector.
      tags:
        - EdgeRuntime
      security:
        - ConnectorSecret: []
      parameters:
        - name: x-connector-id
          in: header
          required: false
          description: Optional connector identifier used to enforce source policy metadata.connector_id for runtime imports and select a registered connector-specific runtime secret when metadata.runtime_secret_hash is present.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanIdentityImportRequest"
      responses:
        "200":
          description: Import result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentityImportResult"
        "400":
          description: Invalid import request.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: An identity save failed. Imports may have committed earlier items; inspect the directory before retrying. Storage details are omitted.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /admin/non-human-identities:
    get:
      summary: List tenant-scoped Non-Human Identities.
      description: Requires admin.nhi.read. NHI registry counts are governance observations and are not billable seats in the MVP; Usage Meter uses the active count as an observe-only nhi_seat snapshot.
      tags:
        - AdminNHI
      responses:
        "200":
          description: Registered NHI identities for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NonHumanIdentityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Upsert a tenant-scoped Non-Human Identity.
      description: Requires admin.nhi.write. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. Bearer automation requests do not use CSRF. NHI entries are governance and policy subjects, not billable seats in the MVP. Admin audit metadata for this write records presence/counts only with nhi_metadata_recorded_scope=none.
      tags:
        - AdminNHI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NonHumanIdentity"
      responses:
        "200":
          description: Upserted NHI registry entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NonHumanIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: A rejected store save leaves live configuration and generation unchanged. If the store accepted the change but Network Extension snapshot publication failed, the response has status partial and applied true. Publication may have written some files; fleet delivery is not established.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
  /admin/non-human-identities/risk:
    get:
      summary: Report Non-Human Identity risk signals (/).
      description: Requires admin.nhi.read. Derives MVP NHI risk signals (owner_unset / no_expiry_long_lived / scope_overbroad / unused) and a severity (none|medium|high) for every tenant-scoped NHI. Non-secret enums only; no credentials, scopes-as-data, or secrets are returned (no_secret_attestation=true). The same severity feeds the decision path via the nhi_risk_severity policy condition so a high-risk NHI's access can be reduced (G-09 NHI zero-trust).
      tags:
        - AdminNHI
      responses:
        "200":
          description: Per-NHI risk report for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NonHumanIdentityRiskReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/ai-usage-report:
    get:
      summary: Report known generative-AI service usage ().
      description: >-
        Requires admin.ai.read. Identifies known generative-AI service usage from access logs and classifies each
        (approved|tolerated|prohibited) via the SaaS catalog / built-in defaults. Non-secret enums and counts only.
        The response carries "window" (the range asked for) and "coverage" (the range actually covered): the read is
        row-capped and newest-first, so a tenant busy enough to hit the cap is reported over a shorter span than
        requested, with coverage.truncated true and coverage.from the real start of the data. coverage.retained_from
        is the separate second reason a window can exceed its answer — no records are held that far back — and is
        present only when the earliest retained record is later than the window start. It is stated as a fact, not
        as loss: a quiet period and rotated-away records are indistinguishable from the report's position.
        coverage.source names the path that answered: "rows" loaded the window and grouped in Go; "aggregate" had
        the hot store GROUP BY (Postgres only). Both run the same aggregation and produce identical reports; on the
        aggregate path coverage.row_cap is the group cap, since nothing is row-loaded.
      tags:
        - AdminAIVisibility
      parameters:
        - name: window
          in: query
          required: false
          description: Relative window ending now. One of 24h, 7d, or 30d. Defaults to 7d. An unrecognised value is a 400, never a silent fallback. Mutually exclusive with from/to.
          schema:
            type: string
            enum: ["24h", "7d", "30d"]
        - name: from
          in: query
          required: false
          description: RFC3339 inclusive lower bound, for an absolute range. Defaults to 7d before "to". Mutually exclusive with window.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: RFC3339 inclusive upper bound. Defaults to now. Mutually exclusive with window.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: AI usage report for the authenticated tenant.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Unknown window preset, unparseable from/to, from at or after to, window and from/to both given, or a span beyond the 30d maximum.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/device-runtime:
    get:
      summary: Per-device runtime facts reported by the endpoint agent.
      description: >-
        Requires admin.enrollment.read. Returns, per device (keyed by the verified (T) transport device identity),
        the OS, logged-in user(s), steer state, and posture (disk encryption + firewall) the endpoint agent reports
        over the steer transport (CONNECT headers + OPEN-frame per-flow user). Agent-claimed, non-secret enums only.
        Scoped to the caller's tenant, with the owner taken from the enrolled ledger — the same authority admission
        uses — because a presence record carries no tenant of its own. This sentence already said "for the
        authenticated tenant" while the route applied no tenant filter at all and returned the whole node's
        presence map; that was found the day a second tenant first had a device on the reference lab, since with
        one tenant the two answers are identical.
        A device the ledger cannot place is withheld from everyone and counted in withheld_unattributable rather
        than dropped silently. A caller this deployment cannot scope at all (no tenant model) still sees the whole
        node, which is what deviceGroupVisibleToTenant already decided for the enrolled-device screens.
      tags:
        - AdminEnrolledInventory
      responses:
        "200":
          description: Device runtime facts for the authenticated tenant.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/ai-ops/access-trends:
    get:
      summary: Summarize access-decision trends (AI Operations Assistant).
      description: >-
        Requires admin.ai.read. Deterministic aggregate of the tenant's retained access decisions — counts by
        decision/actor/service, deny rate, top deny reason codes + denied policies. No LLM and no external call
        (generation_method=deterministic_no_llm); counts + non-secret enums only. The decisions live in a bounded
        in-memory store, so the response carries "window" (asked for) and "coverage" (answerable): coverage.truncated
        is true only when the store is full AND its oldest survivor is newer than the window start, i.e. older
        activity existed and was evicted — not merely when a quiet tenant has nothing older.
      tags:
        - AdminAIOps
      parameters:
        - name: window
          in: query
          required: false
          description: Relative window ending now. One of 24h, 7d, or 30d. Defaults to 7d. An unrecognised value is a 400, never a silent fallback. Mutually exclusive with from/to.
          schema:
            type: string
            enum: ["24h", "7d", "30d"]
        - name: from
          in: query
          required: false
          description: RFC3339 inclusive lower bound, for an absolute range. Defaults to 7d before "to". Mutually exclusive with window.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: RFC3339 inclusive upper bound. Defaults to now. Mutually exclusive with window.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Access-trend summary for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTrendsReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/certs:
    get:
      summary: List rotatable server certificates.
      description: Requires admin.certs.read. Returns each rotatable server cert with subject, SANs, validity and SHA-256 fingerprint (no private keys).
      tags:
        - AdminCertificates
      responses:
        "200":
          description: Rotatable certificate inventory.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/certs/{name}:
    put:
      summary: Rotate a server certificate (hot-reload, no restart).
      description: Requires admin.certs.write. Uploads a new cert+key PEM for the named cert; validated (key⇄cert match, currently valid) then hot-reloaded with no restart. A bad cert/key is rejected and the previous cert keeps serving.
      tags:
        - AdminCertificates
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The rotated certificate metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/interception-roots:
    get:
      summary: List interception-root PKI (default anchor + per-tenant roots).
      description: >-
        Requires admin.policy.read. Returns the default interception root certificate (the trust anchor) and
        the per-tenant interception roots this node holds, so each tenant's root can be distributed to that
        tenant's devices.

        The per-tenant list is scoped: a tenant admin sees only its own root, an OPERATOR
        (admin.tenant.admin) sees them all — distributing roots fleet-wide is an operator act and cannot be
        done from a list that shows one tenant at a time. Before that scoping the list named every
        organization on the deployment by tenant id to any admin who asked; the certificates themselves are
        public material, so what leaked was the membership list.

        `indistinguishable_by_name` names the authorities this node holds that share a common name, keyed by
        that name. A trust store shows an operator the NAME, so two certificates carrying the same subject are
        one string twice on the machine they have to clean up — this deployment has had an outage from exactly
        that. Newly generated per-tenant roots name their organization; this reports the ones already in the
        field and the ones a customer supplies, which the Edge cannot rename. Empty is the healthy state.


        `retiring_root_adoption` says, per organization and per root being moved off, WHO HAS MOVED: which of
        that organization's devices are still pinned to it, which have not reported a pin at all, and whether
        the withdrawal would be allowed right now. Computed by the same function that decides the withdrawal,
        so the screen and the act cannot disagree — without it, the only way to learn the state of a
        replacement is to attempt the withdrawal and read the refusal, which teaches operators to treat a
        safeguard as an obstacle.


        `signing_scope` says whether those roots actually SIGN anything, which is a different fact from
        whether they exist. Under the shared scope — and under the offline intermediate — every leaf is minted
        by one CA no matter how many per-tenant roots are provisioned, so a caller that reads only the list
        would conclude interception is separated per tenant when it is not. `per_tenant_signing` is the field
        to act on.
      tags:
        - AdminInterceptionRoots
      responses:
        "200":
          description: Default root + per-tenant roots.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/interception-roots/{tenant}/announce:
    post:
      summary: Announce an interception root before anything signs under it.
      description: >-
        Requires admin.policy.write. Tells this organization's devices to LOOK FOR a root in their own trust
        store and report whether they hold it. Nothing signs under it, so no traffic changes — this exists so
        adoption can be MEASURED before the switch that depends on it. Switching first breaks every site at
        once on any device that missed the distribution. The certificate itself is distributed out of band
        (MDM); the bundle carries fingerprints only, because a device that accepted a root because a bundle
        carried it would be trusting the wrong thing. "self" resolves to the caller's own organization.
      tags:
        - AdminInterceptionRoots
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                root_pem:
                  type: string
                  description: The root certificate to announce, PEM.
      responses:
        "200":
          description: The announced root, its fingerprint, and what to do next.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/interception-roots/{tenant}:
    post:
      summary: Provision a tenant's interception root.
      description: Requires admin.policy.write. Creates (and persists, when -interception-per-tenant-root-dir is set) a per-tenant interception root and returns its certificate PEM, so it can be distributed to the tenant's devices before enabling per-tenant scope. The primary/empty tenant returns the default root.
      tags:
        - AdminInterceptionRoots
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The provisioned tenant root (cert PEM).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      summary: Retire a PROVISIONED per-tenant interception root that is not signing anything.
      description: >-
        Requires admin.policy.write for your OWN organization, or admin.tenant.admin for another's.


        POST on this path creates a per-tenant root so it can be DISTRIBUTED before per-tenant signing is
        enabled. Nothing removed them, so a deployment that later went a different way keeps certificates that
        sign nothing — and two of them on the reference lab carried the same common name, which is exactly what
        an operator cannot resolve from a trust store. Leaving them is not neutral: they may have been handed
        to a customer.


        Refused with 409 while per-tenant roots are IN FORCE: that root either signs the organization's leaves
        now or would be regenerated for the next flow, so removing it would change what its devices must trust
        without telling them — replace it through the announced overlap instead. Also refused for the node's
        primary tenant, whose root is the deployment anchor rather than a provisioned per-tenant one. 404 when
        the organization has no provisioned root here.


        No traffic changes: it was signing nothing. A device that was given the certificate keeps trusting an
        authority no leaf chains to.
      tags:
        - AdminInterceptionRoots
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retired from this node, in memory and on disk.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No provisioned interception root for this organization.
        "409":
          description: That root is, or would become, the signer for this organization.
        "503":
          description: Interception is not enabled on this edge.
  /admin/interception-intermediate:
    get:
      summary: Interception intermediate status.
      description: Requires admin.policy.read. Returns the leaf-issuance mode (offline / runtime / direct) and, when an intermediate is in use, its CN, expiry, name constraints, and the root CN.
      tags:
        - AdminInterceptionRoots
      responses:
        "200":
          description: Intermediate status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Hot-load a new offline-issued interception intermediate (rotation).
      description: Requires admin.policy.write. Offline mode only. Body carries the new {root_cert_pem, intermediate_cert_pem, intermediate_key_pem}; the root must equal the current anchor (device trust unchanged). The edge swaps to the new intermediate live (rotating out the old one).
      tags:
        - AdminInterceptionRoots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: New intermediate status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/interception-intermediate/csr:
    post:
      summary: Request a certificate for the interception signing key, without exporting it.
      description: >-
        Requires admin.policy.write. Emits a PKCS#10 request for the key this Edge already signs intercepted
        traffic with — a token-held key never leaves its token, because building the request only asks it to
        sign. Have the root that endpoints will trust sign the request offline, then adopt the result via
        /admin/interception-intermediate/adopt. Body: {common_name, organization}.
      tags:
        - AdminInterceptionRoots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The certificate request, PEM-encoded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/interception-intermediate/{tenant}/revoke:
    post:
      summary: Revoke an organization's interception authority — the emergency path, not a withdrawal.
      description: >-
        Requires admin.policy.write for your OWN organization, or admin.tenant.admin for another's. Body:
        {reason}, which is required — a revoked authority is read months later by somebody deciding whether it
        may come back, and "revoked" alone does not answer that.


        Withdrawal ends a PLANNED replacement and refuses to touch the root currently signing, because telling
        an organization's devices to stop looking for the certificate their traffic uses is an outage. A leaked
        key inverts that: the outage is the correct outcome, and continuing to sign with a key somebody else
        may hold is not.


        Afterwards the organization is FAIL-CLOSED — no issuer, so its traffic is not intercepted until a
        replacement is loaded, and deliberately NOT signed under the deployment's own authority instead.
        (Removing the issuer alone would have done exactly that: it empties the per-tenant set, which this node
        reads as "per-tenant signing is not in force".) The revoked fingerprints are refused permanently,
        including against a restore of a bundle still on disk, and that refusal survives a restart — a
        revocation a reboot forgets is the worst of both, since the operator believes the key is dead.


        Loading a REPLACEMENT authority ends the fail-closed state. The key stays dead; the organization
        recovers. A one-way door in the emergency path would punish reporting a leak.
      tags:
        - AdminInterceptionRoots
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Revoked; the organization is not being intercepted until a replacement is loaded.
        "400":
          description: No reason given, or the organization has no authority here to revoke.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Interception is not enabled on this edge.
  /admin/interception-intermediate/{tenant}/retiring/{sha256}:
    delete:
      summary: Stop announcing an interception root this organization has moved off.
      description: >-
        Requires admin.policy.write for your OWN organization, or admin.tenant.admin for another's.


        Replacing an organization's interception authority keeps the PREVIOUS root announced, so devices
        pinned to it keep working while they are moved across — an overlap, which is what makes a replacement
        something devices can be walked through rather than an event they are all subjected to at once. This
        ends that overlap.


        Refused with 409 for the root that is currently SIGNING: telling an organization's devices to stop
        looking for the certificate their own traffic uses is an outage wearing the word "withdraw". 404 when
        the fingerprint is not announced as retiring for that organization.


        Also 409 while any of that organization's devices is still PINNED to this root, or has not reported a
        pin at all — decided on what devices report, never on what was distributed, like every other trust
        change here. Withdrawing early re-creates by hand the flag day the overlap exists to remove: those
        devices mismatch at once and, with the pin armed, stand aside together. Silence blocks because the
        machines in trouble are disproportionately the quiet ones; an organization with no enrolled devices is
        allowed, since there is nobody to strand and a gate that cannot be satisfied on an empty fleet would
        block every new customer's first rotation; and a device that cannot report — an agent that predates the
        field — is accounted for BY NAME through the anchor acknowledgement store, because a safeguard that
        cannot be satisfied is an instruction to work around it. After a withdrawal, any device
        still pinned to that root mismatches — re-installing it with the organization's current configuration
        is what moves it, and /admin/tenant-install-bundle/{tenant} carries that.
      tags:
        - AdminInterceptionRoots
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
        - name: sha256
          in: path
          required: true
          description: SHA-256 of the retiring root certificate, lowercase hex.
          schema:
            type: string
      responses:
        "200":
          description: Withdrawn; that organization's devices are told a smaller set from now on.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not announced as a retiring root for this organization.
        "409":
          description: That root is the one currently signing for this organization.
        "503":
          description: Interception is not enabled on this edge.
  /admin/interception-intermediate/{tenant}:
    post:
      summary: Load ONE organization's own interception issuing CA, so its traffic is signed under its own root.
      description: >-
        Requires admin.policy.write for your OWN organization, or admin.tenant.admin for another's. Body:
        {root_cert_pem, intermediate_cert_pem, intermediate_key_pem} — an intermediate issued OUT OF BAND by
        that organization's own offline root. The Edge holds no root key, which is the point: a leaked
        signing key can impersonate sites for one customer rather than for the deployment.


        This is what makes per-tenant interception real rather than provisioned. A per-tenant interception
        ROOT could already be created, listed, persisted and distributed while every leaf on the node was
        still minted by one shared intermediate — measured on the reference lab, where two organizations each
        held a durable root that signed nothing.


        Loading the first bundle puts the node into PER-TENANT SIGNING, which is FAIL-CLOSED: an organization
        with no issuer of its own is no longer intercepted, rather than being intercepted under somebody
        else's CA. That direction is deliberate — signing under the wrong CA succeeds, so nothing looks wrong
        until a certificate is read. The response reports how many organizations are covered; everything else
        is not being intercepted. The organization the node-wide intermediate belongs to keeps using it, so
        enabling this does not fail closed on the tenant that was already working.


        durable=false means live now and gone at the next restart (no
        -interception-offline-tenant-intermediate-dir), which would return this organization to refused.
        Unlike POST /admin/interception-intermediate, the adoption gate does not apply: this ADDS a separate
        anchor for one organization instead of replacing the one every device already trusts.
      tags:
        - AdminInterceptionRoots
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Loaded; this organization now signs under its own root.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant:
                    type: string
                  root_pem:
                    type: string
                    description: The anchor this organization's devices must trust.
                  root_common_name:
                    type: string
                  durable:
                    type: boolean
                  organizations_covered:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Interception is not enabled on this edge.
  /admin/interception-intermediate/adopt:
    post:
      summary: Adopt a re-parented interception intermediate (same key, new root).
      description: >-
        Requires admin.policy.write. Installs a certificate a central root issued for the key this Edge
        already signs with, and makes that root the anchor endpoints verify against — the signing key does
        not move, so hardware custody is preserved. Refused with 409 unless every enrolled device has
        REPORTED holding the new root: an interception root a device does not trust breaks every HTTPS site
        on it at once. Refused with 400 when the certificate is not for this Edge's key, is not signed by the
        supplied root, is not a CA, or is not currently valid. Body: {root_cert_pem, intermediate_cert_pem}.
      tags:
        - AdminInterceptionRoots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Status after the re-parenting.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A device has not reported holding the new root; the switch is refused and names it.
  /admin/interception-intermediate/rotate:
    post:
      summary: Rotate the runtime interception intermediate.
      description: >-
        Requires admin.policy.write. Runtime mode: issues a fresh intermediate from the Edge-held root (no
        flag day — devices keep trusting the same root). No-op when no intermediate is active.
      tags:
        - AdminInterceptionRoots
      responses:
        "200":
          description: New intermediate status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/agent-profile/options:
    get:
      summary: What a device profile can be issued for, so nothing on the screen is typed.
      description: >-
        Requires admin.steering.read. Returns the organization the caller acts in, this deployment's own region
        addresses in "region=URL" order (with a note saying whether there is anywhere to fail over to at first
        contact), the device groups in the caller's organization, and the bypass catalogue this deployment
        publishes. Every one of these is matched by string on the device, so they are offered rather than typed.
      tags:
        - AdminAgentProfile
      responses:
        "200":
          description: The choices a profile can be issued from.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/agent-profile:
    post:
      summary: Issue the signed install profile a device needs to reach this deployment.
      description: >-
        Requires admin.steering.write. The deployment signs with its own agent-policy key, which therefore never
        leaves it. The organization is taken from the CALLER and never from the body, so an administrator cannot
        mint configuration that enrols devices into another organization. A fail-open posture requires
        ack_fail_open: devices carrying traffic while no Edge answers are neither recorded nor filtered, and a
        blocked device reaches the internet again for as long as it lasts. Bypass entries are chosen by
        catalogue id and expanded here; an unknown id is refused rather than dropped. The profile deliberately
        carries no device certificate - identity comes from a one-time enrolment token per machine.
      tags:
        - AdminAgentProfile
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                group:
                  type: string
                  description: Device group this profile is for. Empty means every device in the organization.
                transport_endpoints:
                  type: array
                  items:
                    type: string
                  description: >-
                    "region=URL" entries, in the order a device tries them. Defaults to this deployment's own
                    regions.
                posture:
                  type: string
                  enum: [fail-closed, fail-open]
                ack_fail_open:
                  type: boolean
                  description: Required for fail-open. Enforced here, not only on the screen.
                bypass_catalog_ids:
                  type: array
                  items:
                    type: string
                bypass_apps:
                  type: array
                  items:
                    type: string
                bypass_dests:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: The signed envelope, sent as an attachment for the operator to install.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: This deployment holds no agent-policy signing key, so it cannot issue a profile a device would accept.
  /admin/predefined-catalog:
    get:
      summary: View the predefined pinned-bypass catalog and this tenant's overrides.
      description: Requires admin.policy.read. Returns the versioned curated catalog of well-known un-interceptable services (vendor/category/risk per entry), the tenant's per-entry overrides (force_inspect/disabled), and the resulting effective bypass host set.
      tags:
        - AdminPredefinedCatalog
      responses:
        "200":
          description: The versioned catalog, the tenant's overrides, and the effective bypass hosts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/predefined-catalog/feed:
    get:
      summary: View the signed predefined-catalog feed status.
      description: Requires admin.policy.read. Returns the applied feed source (feed/builtin), catalog version, staleness, the current applied feed, and the version history available for rollback.
      tags:
        - AdminPredefinedCatalog
      responses:
        "200":
          description: Feed status + version history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Apply a vendor-signed predefined-catalog feed.
      description: Requires admin.policy.write. Validates a signed catalog feed envelope (ed25519 signature + checksum + expiry + trusted keyring) and, if it is newer than the applied version, makes it the effective catalog. An invalid/expired/older feed is rejected and the current catalog is kept (last-known-good).
      tags:
        - AdminPredefinedCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The applied feed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/predefined-catalog/feed/rollback:
    post:
      summary: Roll back the predefined-catalog feed to a prior version.
      description: Requires admin.policy.write. Restores a previously-applied catalog version from the feed history (the only way to move to an older version).
      tags:
        - AdminPredefinedCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The restored feed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/predefined-catalog/overrides:
    post:
      summary: Override a predefined catalog entry for this tenant.
      description: Requires admin.policy.write. Sets a per-tenant override on a catalog entry — force_inspect (decrypt despite the pin; may break the app) or disabled (stop applying this curated bypass). When persistence is configured, the resulting snapshot is saved before rebuilding the live bypass set. A save error returns 500 and keeps the current live selection; storage may have an uncertain commit, so reload and retry before restarting. Without persistence, the change is in memory only.
      tags:
        - AdminPredefinedCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The stored override.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Saving the requested override state could not be confirmed. The current live selection is retained; reload and retry.
        "503":
          description: The catalog override store is not configured.
  /admin/predefined-catalog/overrides/{id}/clear:
    post:
      summary: Clear a tenant's override on a predefined catalog entry.
      description: Requires admin.policy.write. Removes the override and restores the catalog default (the entry is bypassed again). When persistence is configured, the resulting snapshot is saved before rebuilding the live bypass set. A save error returns 500 and keeps the current live selection; storage may have an uncertain commit, so reload and retry before restarting. Without persistence, the change is in memory only.
      tags:
        - AdminPredefinedCatalog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Whether an override was cleared.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Saving the requested override state could not be confirmed. The current live selection is retained; reload and retry.
        "503":
          description: The catalog override store is not configured.
  /admin/internal-cas:
    get:
      summary: List the certificate authorities this organization vouches for over its own private assets.
      description: Requires admin.policy.read. Interception makes the Edge the TLS client to a private asset, and an intranet server's certificate is issued by the organization's own authority — never by a public root. These are the authorities that make such an asset verifiable, scoped to the authenticated organization.
      tags:
        - AdminInternalCAs
      responses:
        "200":
          description: The authorities for the authenticated organization, each with what was read out of the material.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Internal authority storage is unavailable; an unavailable list is not an empty list.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Add or replace one internal certificate authority.
      description: Requires admin.policy.write. Supply exactly one public CA certificate that has not expired. Private keys, additional certificates, other PEM material and trailing JSON are refused. Requests are limited to 1 MiB. Live trust changes only after persistence reports success. A stable id permits retry of the same submission; omitting id generates a new one. An operator may name another organization in tenant_id; a customer naming one is refused rather than redirected.
      tags:
        - AdminInternalCAs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The stored authority.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: The material is not an authority this deployment can use, with the reason.
        "409":
          description: This node receives configuration from a source and refuses local writes.
        "500":
          description: Persistence is unconfirmed. This request did not adopt a live change; restore storage, reload and retry.
        "503":
          description: Internal authority storage is unavailable; an unavailable list is not an empty list.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/internal-cas/all:
    get:
      summary: Every organization's internal certificate authorities.
      description: "Requires admin.policy.read AND a configured operator organization matching the caller. An unconfigured operator is denied. This is the list an Edge pulls: an Edge carries flows for many organizations, so pulling only its own node's organization would refuse every other organization's private assets while reporting itself healthy."
      tags:
        - AdminInternalCAs
      responses:
        "200":
          description: Every organization's authorities.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Internal authority storage is unavailable; an unavailable list is not an empty list.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/internal-cas/{id}:
    delete:
      summary: Remove one internal certificate authority.
      description: Requires admin.policy.write. Scoped to the authenticated organization. The durable delete must report success before live trust changes. Other servers must receive the configuration update. This operation does not forcibly close established connections.
      tags:
        - AdminInternalCAs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed; the response includes deleted=true, id, and tenant_id.
        "503":
          description: Internal authority storage is unavailable; an unavailable list is not an empty list.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such authority in this organization.
        "409":
          description: This node receives configuration from a source and refuses local writes.
        "500":
          description: Persistence is unconfirmed. This request did not remove live trust; restore storage, reload and retry.
  /admin/steer-exclusions:
    get:
      summary: List admin-managed steer exclusions.
      description: Requires admin.steering.read. Returns the tenant's steer-exclusion policies (which app code-signing identifiers are excluded from steering, per tenant/device-group/device).
      tags:
        - AdminSteerExclusions
      responses:
        "200":
          description: Steer-exclusion policies for the authenticated tenant.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Upsert a steer-exclusion policy.
      description: Requires admin.steering.write. Assigns excluded app code-signing identifiers to a scope (tenant, device_group, or device). The resolved set is later signed and delivered to the agent; the endpoint user cannot change it.
      tags:
        - AdminSteerExclusions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The stored steer-exclusion policy.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/pki/certificates:
    get:
      summary: The certificate map — every certificate this node is configured with, as objects with relations.
      description: >-
        Requires admin.certs.read. One list covering the whole trust surface: the component server
        certificates, the (T) transport chain, the anchors devices pin (with the trust-bundle serial that
        distributes them), the device client/issuing CAs, the interception root and signer, the agent-policy
        signing key, and the device fleet as an aggregate. Each item states where it is presented (real
        listener addresses), what verifies it or what it verifies (semantic relation ids the Console
        translates), its contents, its public PEM when downloading it is how an operator installs trust in a
        peer, and the operations that exist for it (`capabilities`) — an operation not listed must not be
        offered, because a button that cannot work is worse than none. The server asserts only relations its
        own configuration establishes, which is why the Console fetches this per node and shows nodes side by
        side rather than letting one node speak for the deployment. Private keys never appear.
      tags:
        - AdminCerts
      responses:
        "200":
          description: The node's certificate inventory (admin_pki_certificates.v1).
  /admin/pki/operations:
    get:
      summary: The staged PKI operation in flight, with every stage computed from what is measurably true.
      description: >-
        Requires admin.certs.read. Replacing what devices trust is four acts in a fixed order — distribute,
        wait until every device holds it, switch the Edge onto it, withdraw the others — and getting the
        order wrong strands devices. Only the INTENT is stored (which certificate the rotation is moving to,
        who started it, when); every stage is computed from live facts: is it distributed, do devices report
        holding it, does the Edge present a chain it verifies, has the fleet re-handshaked, are the others
        gone. A stored stage drifts the moment anything happens outside the wizard — a restart, a direct API
        call, a rollback — and a progress display that disagrees with the deployment is worse than none.
        Each unfinished stage carries the gate's own reason for blocking it.
      tags:
        - AdminCerts
      responses:
        "200":
          description: The operation and its computed stages (admin_pki_operations.v1); in_flight=false when idle.
    post:
      summary: Start a staged operation towards a target certificate.
      description: >-
        Requires admin.certs.write and -pki-operation-store. Records the intent only. One operation at a
        time — a second is refused rather than silently replacing the first.
      tags:
        - AdminCerts
      responses:
        "200":
          description: The operation, with its stages already computed.
        "409":
          description: An operation is already in flight, or staged operations are not enabled here.
    delete:
      summary: Stop tracking the operation in flight.
      description: >-
        Requires admin.certs.write. Abandoning tracks nothing further; it does NOT undo what the completed
        stages already did — the deployment stays where they left it, which is exactly why the view is
        computed rather than remembered.
      tags:
        - AdminCerts
      responses:
        "200":
          description: The (now idle) view.
  /admin/pki/paths:
    get:
      summary: Every trust-carrying connection this node is an endpoint of, referencing the certificate inventory.
      description: >-
        Requires admin.certs.read. One row per path this node's configuration establishes — the device
        transport (with its recovery listener), the trust distribution and its serial, enrolment, connectors,
        interception, the upstream TLS trust, the admin surface, config pull and audit ingest — each carrying
        its real addresses, the far end's required client credential, a server-side status, and the
        `server_cert_id` of the /admin/pki/certificates item it presents, so the paths view and the
        certificates view cannot tell different stories. Semantic ids throughout; the Console translates and
        composes nodes side by side, adding only the entries it alone can know (its own origin).
      tags:
        - AdminCerts
      responses:
        "200":
          description: The node's path registry (admin_pki_paths.v1).
  /admin/pki/trust-refusals:
    get:
      summary: What devices declined to trust, and why, in their own words.
      description: >-
        Requires admin.certs.read. A device that refuses the Edge's certificate cannot report that it
        refused — the report would travel over the connection it just declined to make — so devices journal
        refusals locally and carry them on the first connection that works. This arrives late by
        construction; late is the only option a refusal has, and it is still the difference between a
        replacement that is explainable in a minute and one that is not explainable at all. Before this
        existed, a fleet that had refused a certificate and a fleet that was switched off produced the same
        silence at the Edge, which is why the 2026-07-31 outage took 47 minutes to attribute.
        Each row names the device, the certificate it saw, the verifier's own reason, when it first and last
        happened and how many handshakes it covers. `served_is_current` says whether the refused certificate
        is the one this node presents now: false is the ordinary case after a rollback, where the operator is
        reading why the thing they backed out of failed. Reporter-declared and bounded on arrival — a
        fingerprint here is compared with what this node serves, never believed.
      tags:
        - AdminCerts
      responses:
        "200":
          description: Refusals reported by devices (admin_trust_refusals.v1), most recent first.
  /admin/pki/readiness:
    get:
      summary: What is set up and what is still missing, for the PKI a deployment needs.
      description: >-
        Requires admin.state.read. Distinct from /healthz, which answers "should this node take traffic": a
        node can be perfectly healthy and still be missing every piece of a production PKI. This answers "is
        this deployment finished, and if not, what is the next thing to do" — the fact a Day-0 wizard needs
        before it can have screens, and the reason it exists before one.
        Every non-ok item carries a `consequence` stating what happens if it is left alone, because
        "not configured" alone does not tell an operator whether to care, and the consequence is what decides
        the order they work in. `production_safe` is false while ANY blocking item is unresolved and is
        deliberately not a percentage: a deployment missing one blocking piece is not 90% safe, it is unsafe.
        Items that do not apply yet are omitted rather than reported as gaps — demanding renewal before any
        certificate is issued would invent work, and a readiness view that invents work stops being read.
      tags:
        - AdminState
      responses:
        "200":
          description: The current assessment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        status: { type: string, enum: [ok, attention, missing, unknown] }
                        detail: { type: string }
                        consequence: { type: string }
                        blocking: { type: boolean }
                  ok: { type: integer }
                  attention: { type: integer }
                  missing: { type: integer }
                  production_safe: { type: boolean }
  /admin/transport-ca-readiness:
    get:
      summary: Which enrolled devices already pin a given transport CA (readiness before rotating it).
      description: >-
        Requires admin.steering.read. Answers the question an operator must settle BEFORE rotating the (T)
        transport CA: which devices already trust the CA about to be deployed. Rotating without it means
        switching and hoping — a device that has not picked up the new CA cannot recover on its own, because
        it can no longer verify the Edge and the new CA would have arrived over the tunnel it can no longer
        establish. Devices are enumerated from the ENROLLED INVENTORY, not from telemetry, so a device that
        has never reported still appears; deriving the list from telemetry would show a fleet 100% ready
        precisely because the devices missing the CA are the ones not talking. `silent` is kept separate from
        `not_ready` on purpose: "has not told us" (often a switched-off machine) is a different situation from
        "told us it does not have it", and only the second is fixed by waiting. `safe_to_cut` is true only when
        EVERY known device reports the CA — not a threshold, because the stragglers are exactly the devices
        that cannot recover. Observability only; it changes nothing. Tenant-scoped.
      tags:
        - AdminSteerExclusions
      parameters:
        - name: sha256
          in: query
          required: true
          schema:
            type: string
          description: SHA-256 of the CA certificate to check, hex (colons and case are accepted).
      responses:
        "200":
          description: Readiness for the requested CA.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha256: { type: string }
                  ready: { type: array, items: { type: string } }
                  not_ready: { type: array, items: { type: string } }
                  silent: { type: array, items: { type: string } }
                  ready_pct: { type: integer }
                  safe_to_cut: { type: boolean }
        "400":
          description: sha256 is required.
        "503":
          description: Device telemetry is not enabled, so readiness cannot be known.
  /admin/steer-exclusions/observed:
    get:
      summary: Query devices' self-reported effective steer-exclusion sets (reverse telemetry; filtered + paginated).
      description: Requires admin.steering.read. Returns a FILTERED, PAGINATED page (never the whole fleet — see docs/steer_exclusions_observed_telemetry_scale_design.md) of per-device reports of the merged exclusion set each endpoint actually applies, with each entry classified admin / floor / unmanaged. Each report carries admin_app_signing_ids and unmanaged_app_signing_ids (the flagged, non-admin non-floor entries). Response includes total_estimate and next_cursor. Observability only — never feeds enforcement. Tenant-scoped.
      tags:
        - AdminSteerExclusions
      parameters:
        - name: device
          in: query
          schema:
            type: string
          description: Device identity exact, or prefix match when it ends with `*`.
        - name: group
          in: query
          schema:
            type: string
          description: Device-group exact match.
        - name: app
          in: query
          schema:
            type: string
          description: Only devices whose effective set contains this AppID (drift query).
        - name: anomalous
          in: query
          schema:
            type: string
          description: "true to return only devices with at least one unmanaged (non-admin, non-floor) exclusion."
        - name: limit
          in: query
          schema:
            type: integer
          description: Page size (default 50, max 500).
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque forward-pagination cursor from a prior response's next_cursor.
      responses:
        "200":
          description: One page of device reports plus total_estimate and next_cursor.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/steer-exclusions/observed/by-app:
    get:
      summary: Aggregate observed exclusions by AppID across the fleet (drift view).
      description: Requires admin.steering.read. Returns, per AppID, how many reporting devices currently apply it and its class (admin / floor / unmanaged — unmanaged wins if it is unmanaged on any device), unmanaged first. Top `limit` (default 100, max 1000). Tenant-scoped, observability only.
      tags:
        - AdminSteerExclusions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          description: Max AppIDs returned (default 100, max 1000).
      responses:
        "200":
          description: Per-AppID device counts and class, plus device_total.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/steer-exclusions/resolved:
    get:
      summary: Preview the admin-resolved steer-exclusion set the Edge would serve a device.
      description: Requires admin.steering.read. Resolves the authored (admin) steer-exclusion policies for the given device (tenant + its device-group + device scopes) — the layer-3 set the Edge would sign and deliver on the device's next poll. This is the forward preview (authored intent), distinct from /observed (what the device actually applies). Tenant-scoped.
      tags:
        - AdminSteerExclusions
      parameters:
        - name: device
          in: query
          required: true
          schema:
            type: string
          description: The device identity to resolve the authored set for.
      responses:
        "200":
          description: The resolved authored exclusion set for the device.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/steer-exclusions/{id}:
    delete:
      summary: Delete a steer-exclusion policy.
      description: Requires admin.steering.write. Removes the tenant's steer-exclusion policy by id.
      tags:
        - AdminSteerExclusions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/steer-exclusions/{id}/versions:
    get:
      summary: List the version history of a steer-exclusion policy.
      description: Requires admin.steering.read. Returns every recorded version (newest first) for rollback.
      tags:
        - AdminSteerExclusions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Version history for the steer-exclusion policy.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Config versioning is not enabled.
  /admin/steer-exclusions/{id}/rollback:
