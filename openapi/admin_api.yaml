  /admin/rules:
    get:
      summary: List the tenant's authored unified rules.
      description: Requires admin.policy.read. Returns the authored `source → destination` rules (with their service selector and action) across the east-west and egress planes. Optional ?plane filters to one plane. inspection_source_warning identifies identity_context_unavailable or no_resolved_device for pre-TLS inspection source selection; access-policy compilation is separate. See docs/policy_and_endpoint_model_design.md.
