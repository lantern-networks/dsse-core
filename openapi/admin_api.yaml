      type: object
      required:
        - schema_version
        - tenant_id
        - generated_at
        - window_decisions
        - by_decision
        - deny_count
        - deny_rate_percent
        - step_up_count
        - by_actor_type
        - by_service_family
        - top_deny_reason_codes
        - top_denied_policies
        - generation_method
        - no_secret_attestation
      properties:
        schema_version:
          type: string
          enum:
            - ai_ops_access_trends.v1
        tenant_id:
          type: string
        generated_at:
          type: string
          format: date-time
        window:
          type: object
          description: The range the caller asked for. requested is the preset name (24h/7d/30d) or "custom" for an absolute from/to.
          properties:
            requested:
              type: string
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        coverage:
          type: object
          description: The range the retained decisions could actually answer. truncated is true only when the store is full AND its oldest survivor is newer than the window start — older activity existed and was evicted.
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            decisions:
              type: integer
              minimum: 0
            retained:
              type: integer
              minimum: 0
            capacity:
              type: integer
            truncated:
              type: boolean
        window_decisions:
          type: integer
          minimum: 0
          description: Number of retained decisions aggregated (bounded by the in-memory decision store capacity).
        by_decision:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        deny_count:
          type: integer
          minimum: 0
        deny_rate_percent:
          type: integer
          minimum: 0
          maximum: 100
        step_up_count:
          type: integer
          minimum: 0
          description: Count of require_* (step-up) decisions.
        by_actor_type:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        by_service_family:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        top_deny_reason_codes:
          type: array
          items:
            $ref: "#/components/schemas/AiOpsCountRow"
        top_denied_policies:
          type: array
          items:
            $ref: "#/components/schemas/AiOpsCountRow"
        generation_method:
          type: string
          enum:
            - deterministic_no_llm
        no_secret_attestation:
          type: boolean
