                cidr:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: The connector's governed routes after the change.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/connectors/{connector_id}/runtime-secret/rotate:
    post:
      summary: Rotate a tenant-scoped connector runtime secret.
      description: Requires admin.connectors.write. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. Bearer automation requests do not use CSRF. The target connector must belong to the authenticated admin tenant; cross-tenant targets return 404. The server stores only a runtime secret hash, returns the raw replacement secret once, and records non-secret Admin audit metadata with connector_metadata_recorded_scope=none.
      tags:
