  /admin/tenants/{tenant_id}/data-footprint:
    get:
      summary: How much of a tenant is still held on THIS node, per store.
      description: >
        Requires admin.tenant.admin (super-admin, cross-tenant). Counts what this node still holds for a
        tenant: administrator accounts, enrolled identities, log files on this node's disk, and every
        tenant-keyed Postgres table. Run it before an erasure to see what there is, and after one to see that
        there is nothing. It works for a tenant that has already been deleted, which is when the question
        matters most. A store that could not be counted reports -1 with an error rather than 0 — an unknown is
        never an absence — and every store this node cannot reach is named in not_counted, including the other
        Edges, since a tenant's logs live on every node that served it.
      tags:
        - AdminTenantModel
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: What this node still holds for the tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  node:
                    type: string
                    description: Which node this footprint describes. One node's zero is not the fleet's zero.
                  counted_at:
                    type: string
                  total:
                    type: integer
                  stores:
                    type: array
                    items:
                      type: object
                      properties:
                        store:
                          type: string
                        count:
                          type: integer
                          description: Records or files. -1 means the count FAILED and is not evidence of absence.
                        error:
                          type: string
                        note:
                          type: string
                  not_counted:
                    type: array
                    description: Stores this node cannot reach, named so a zero is not read as covering them.
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/tenants/{tenant_id}/purge:
    post:
      summary: Erase everything this node holds for a terminated tenant. Irreversible.
      description: >
        Requires admin.tenant.admin (super-admin, cross-tenant). Erases the tenant from every store this node
        can reach — administrator accounts, enrolled identities (their shared identity claims released), this
        node's log partition, and every tenant-keyed Postgres table — then re-counts and returns the footprint
        as evidence. complete=true means THIS node holds nothing; remaining.not_counted names the stores and
        the other nodes it does not speak for.


        Deliberately separate from DELETE /admin/tenants/{tenant_id}: deleting an organization is routine,
        erasure is irreversible and removes the record of what was done, so it must never happen as a side
        effect. Three gates: the organization must already be deleted (409 if it still exists), the operator
        tenant is refused (409), and the caller must retype the id in confirm_tenant_id (400 otherwise).


        The tenant's deletion tombstone is erased last and only when nothing else failed — removing it while an
        Edge has not applied the deletion would un-delete the tenant on that node.
      tags:
        - AdminTenantModel
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_tenant_id]
              properties:
                confirm_tenant_id:
                  type: string
                  description: Must equal the path tenant_id. There is no undo behind this call.
      responses:
        "200":
          description: What was erased, and what is left afterwards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  node:
                    type: string
                  purged_at:
                    type: string
                  complete:
                    type: boolean
                    description: True only when this node holds nothing afterwards. Says nothing about other nodes.
                  erased:
                    type: array
                    items:
                      type: object
                      properties:
                        store:
                          type: string
                        count:
                          type: integer
                        error:
                          type: string
                  failures:
                    type: array
                    items:
                      type: string
                  remaining:
                    type: object
                    description: The post-erasure footprint — the evidence, in the same shape as the data-footprint route.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The organization still exists (delete it first), or it is the operator tenant.
  /admin/tenant-install-bundle/{tenant}:
    get:
      summary: The certificate authorities to EMBED in this organization's agent installer.
      description: >-
        Requires admin.enrollment.read for your OWN organization, or admin.tenant.admin for another's.
        Returns, in ONE answer, the material an agent installer must embed for this organization: the
        transport anchors the endpoint pins to verify the Edge, the interception root it must hold for its
        traffic to be inspected, and the signed trust bundle it starts from.


        Why at install time: trust that arrives over the network has to be trusted before it arrives — the
        agent must already accept something in order to accept the document telling it what to accept. Fixing
        the bundle in the installer removes that circle for the FIRST trust decision, and makes a device's
        organization a property of the artifact it was installed from rather than of a runtime lookup.
        Replacing an authority afterwards stays a bundle operation, not a re-install: the bundle holds lists
        and a monotonic serial, so an overlap carrying old and new together is the normal state of a rotation.


        Deliberately one answer rather than three downloads — an installer assembled from parts fetched at
        different moments is how a package ends up pinning one organization's transport anchor beside
        another's interception root. interception_root_is_own=false means the value returned is the
        deployment's shared anchor because this organization has no issuer of its own yet; complete=false
        means something is missing and the installer should refuse rather than ship an agent that trusts
        nothing.
      tags:
        - AdminTenantModel
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The install material for this organization.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  transport_ca_pem:
                    type: string
                  interception_root_pem:
                    type: string
                  interception_root_is_own:
                    type: boolean
                  trust_bundle:
                    type: object
                    additionalProperties: true
                  complete:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/tenant-interception-authority:
    post:
      summary: Delegate interception for this organization to the operator.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin; naming another organization additionally goes
        through the operator envelope.


        An IMPORT, not a creation, and that distinction is the ownership line. What an organization's devices
        trust is its interception ROOT, which stays with the organization — offline, in every device's store.
        What is handed over here is an issuing authority THAT ROOT SIGNED for the operator, and the control
        plane uses it to mint a per-Edge tier valid for hours. Creating a root here would mean asking every
        device to trust something the operator made.


        Because the root does not change, nothing on any device changes: a rotation of the per-Edge tier is
        invisible to the browser, which is why interception can be delegated this way while a transport
        certificate needs an announced overlap.


        It is verified before it is accepted — the issuing certificate must be a CA, must chain to the root
        given with it, and the key must belong to it. Each of those failures would otherwise appear as a
        certificate error in front of a user, with nothing on this side to explain it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root_pem, issuing_cert_pem, issuing_key_pem]
              properties:
                tenant_id:
                  type: string
                  description: Operators only; a tenant admin's own organization comes from the session.
                root_pem:
                  type: string
                  description: The organization's interception root — what its devices already trust.
                issuing_cert_pem:
                  type: string
                  description: The authority that root signed for the operator.
                issuing_key_pem:
                  type: string
                  description: Its private key. Held by the control plane, never handed to an Edge as-is.
      responses:
        "200":
          description: The delegation was accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  imported_at: { type: string }
                  applies_to: { type: string }
        "400": { description: The chain does not link, the key does not match, or it is not a CA. }
        "403": { description: Naming another organization without the rights the envelope requires. }

    get:
      summary: Whose root this organization's traffic is inspected under, and whether a replacement is staged.
      description: >
        Requires admin.certs.read or admin.tenant.admin. Answered by the node that HOLDS the authority.


        A staged authority is NOT signing, and the answer says so: promoting before every device holds the
        incoming root took every HTTPS site away from a fleet for eighteen minutes on 2026-08-19. Read
        GET /admin/interception-authority-rotation on an Edge before promoting; withdrawing takes nothing away.


        Never returns key material, and the root key is not here at all — it is the organization's.
      responses:
        "200":
          description: The authority, or has_authority false when the deployment's own root is used.
        "409":
          description: This node holds no per-organization interception authorities.
  /admin/tenant-transport-authority:
    get:
      summary: Where this organization's transport authority stands.
      description: >
        Requires admin.certs.read or admin.tenant.admin. The read a screen asks before it offers to rotate or
        to retire, so it does not have to deduce the answer: whether a rotation is in flight is a fact the
        control plane holds, and an Edge's anchor count says something else — how far the fleet has got. After
        a promotion the two look identical while the previous authority still exists and still needs retiring.
      responses:
        "200":
          description: The organization's authority, and whether it is moving.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  has_authority: { type: boolean }
                  server_name: { type: string }
                  in_force_since: { type: string }
                  rotating: { type: boolean }
                  incoming_since: { type: string }
        "403": { description: Not permitted for this organization. }
    post:
      summary: Create this organization's transport authority, if it has none.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin; naming another organization additionally goes through the operator
        envelope, like every other cross-organization PKI act.


        The authority is the CA that signs the certificate this organization's devices meet when they connect,
        and it is held on the CONTROL PLANE rather than on the Edges. That is what lets an Edge added under
        load serve the organization at all: it is handed short-lived server material on request instead of
        having a five-year key placed on it as a file, which is what every per-organization certificate was
        until 2026-08-20 — measured, on this repository's own scale-out definition, as carrying none of them.


        The NAME is given here, at the moment the authority is created, because the name devices are told to
        send and the certificate they meet have to stay together. Asking again returns the authority that
        already exists: replacing one is a rotation (publish the new anchor, measure adoption, withdraw the
        old), never a side effect of a second call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server_name]
              properties:
                tenant_id:
                  type: string
                  description: Operators only; a tenant admin's own organization is taken from the session.
                server_name:
                  type: string
                  description: The name this organization's agents will send, e.g. northwind.dsse.invalid.
      responses:
        "200":
          description: The authority, existing or newly created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  server_name: { type: string }
                  anchor_pem: { type: string, description: What this organization's devices verify their Edge with. }
                  created_at: { type: string }
                  applies_to: { type: string }
        "400": { description: No name was given, or it could not be created. }
        "403": { description: Naming another organization without the rights the envelope requires. }

  /admin/tenant-transport-authority/rotate:
    post:
      summary: Give this organization a SECOND transport authority, beside the one in force.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin; naming another organization additionally goes
        through the operator envelope, like every other cross-organization PKI act.


        Additive, and that is the whole point. Nothing stops being served and nothing stops being trusted: the
        incoming authority is handed to every Edge as a second material, each Edge announces it beside the one
        it serves, and each starts serving it only once that organization's devices have been measured holding
        it. The decision to switch stays where the evidence is.


        Until 2026-08-20 there was no way to do this at all — EnsureCA was idempotent, RemoveTenant destroyed,
        and the only path to a different authority was to delete the one an organization had and create
        another. That is the order that stranded a device for thirty-one minutes that morning, and no operator
        should be asked to perform it.


        Refused while a rotation is already in flight: two incoming authorities at once would ask every device
        to hold three anchors and leave nobody able to say which one the fleet is moving to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  description: Operators only; a tenant admin's own organization is taken from the session.
      responses:
        "200":
          description: The incoming authority. Its anchor is what devices will be asked to adopt.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  server_name: { type: string }
                  anchor_pem: { type: string }
                  created_at: { type: string }
                  applies_to: { type: string }
        "403": { description: Not permitted for this organization, or the envelope refused it. }
        "409": { description: A rotation is already in flight, or this organization has no authority to rotate. }
        "501": { description: This control plane holds no transport authorities. }
  /admin/tenant-transport-authority/retire-previous:
    post:
      summary: End a rotation - the incoming authority becomes the only one.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin; naming another organization additionally goes
        through the operator envelope.


        The destructive half, and a separate act because it rests on different evidence. Each Edge decides when
        to START serving the incoming authority, from what it can measure about that organization's devices;
        only an operator can decide the previous authority is finished. Doing it while an Edge has not promoted
        yet takes that Edge out - it loses the authority it was serving - which is the failure the rest of this
        shape exists to avoid, one level up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  description: Operators only; a tenant admin's own organization is taken from the session.
      responses:
        "200":
          description: The authority that is now the only one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  server_name: { type: string }
                  anchor_pem: { type: string }
                  created_at: { type: string }
                  applies_to: { type: string }
        "403": { description: Not permitted for this organization, or the envelope refused it. }
        "409": { description: This organization is not moving to a new authority. }
        "501": { description: This control plane holds no transport authorities. }
  /admin/tenant-device-authority:
    post:
      summary: Have this deployment enrol this organization's devices, instead of a CA it runs itself.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin; naming another organization additionally goes
        through the operator envelope, like every other cross-organization PKI act.


        There are two ways an organization's devices come to have identities. It can register its OWN device
        CA through /admin/tenant-cas, hold the key, and issue certificates itself — the right shape for a
        customer that wants independence, and the only one that existed. Or this deployment can hold an
        authority on its behalf and issue through POST /enroll, which is the managed-service arrangement and
        the only one a customer with no PKI can use.


        Before this route existed the second was promised and not kept: an administrator could mint an
        enrolment token for their organization (201) and every device presenting it was refused (403), because
        the Edge held one device-identity signer and a certificate signed by it would have identified their
        laptops as the node's organization.


        Creating it is an ACT, not a side effect. An authority minted on first sight of an organization would
        decide the identity basis of somebody's fleet without being asked, and would override the choice of a
        customer who intends to bring their own CA. Asking again returns the authority that already exists.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  description: Operators only; a tenant admin's own organization is taken from the session.
                display_name:
                  type: string
                  description: >
                    What to call this organization in the certificate subject, so an operator reading a device
                    certificate can say whose it is. The tenant id is authoritative either way.
      responses:
        "200":
          description: The organization's device-identity authority.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  anchor_pem:
                    type: string
                    description: >
                      The certificate every Edge registers so a device enrolled under it is resolved to this
                      organization at the handshake.
                  created_at: { type: string }
                  applies_to: { type: string }
        "403":
          description: The caller may not act on that organization's PKI, or holds no active elevation over it.
        "501":
          description: This control plane holds no device-identity authorities.
    get:
      summary: What this organization's devices are enrolled under, and whether it is moving.
      description: >
        Requires admin.certs.read or admin.tenant.admin. Answered by the node that HOLDS the authority — a
        control plane. An Edge says so rather than reporting every organization as having none.


        Three tiers of per-organization authority had grown a full set of acts and a readiness answer each,
        and only the transport tier could be READ. A screen could say nothing about the tier that decides
        whether an organization's devices are admitted at all.


        During a rotation the signer is NOT the authority in force — the incoming one signs, because that is
        how devices migrate. After an abandonment it is the authority in force again while both stay admitted.
        Those are opposite states, so the answer names which, rather than only "rotating".

        With readiness=1 during a rotation, retirement_readiness contains allowed, reason and checked_at.
        This read-only preview uses the same shared inventory, observation freshness and regional TLS evidence
        as the retirement POST. It does not reserve permission; the POST always checks again.
      parameters:
        - in: query
          name: readiness
          schema: { type: string, enum: ["1"] }
          description: Include the control plane's read-only retirement verification during a rotation.
      responses:
        "200":
          description: The authority, or has_authority false when this organization uses the deployment's own.
        "409":
          description: This node holds no per-organization device-identity authorities.
        "503":
          description: The durable authority snapshot could not be read; stale metadata is not returned.
  /admin/tenant-device-authority/rotate:
    post:
      summary: Begin moving this organization's devices onto a new device-identity authority.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin; naming another organization additionally goes
        through the operator envelope, like every other cross-organization PKI act.


        Until 2026-08-22 this authority — the one that signs every device's client certificate — could not be
        rotated at all. A compromised key had no supported replacement, on a product whose pitch is
        per-organization PKI.


        A device rotation runs the OTHER WAY ROUND from a transport one. On the transport side the Edge
        presents the certificate and devices verify it, so the rotation waits for devices to TRUST the new
        authority. Here the device presents the certificate and the Edge verifies it, so the rotation waits for
        devices to be RE-ISSUED under the new authority. From this call onward every enrolment and every
        renewal comes from the incoming authority, and BOTH remain anchors so the devices that have not renewed
        yet are still admitted. Nothing is taken away until /retire-previous.


        One rotation at a time: a second incoming authority would spread devices across three, and "has
        everybody moved?" would have no single answer to measure against.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  description: Operators only; a tenant admin's own organization is taken from the session.
      responses:
        "200":
          description: The incoming authority. Every Edge picks it up on its next material fetch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  anchor_pem: { type: string }
                  created_at: { type: string }
                  rotating: { type: boolean }
                  note: { type: string }
        "403":
          description: The caller may not act on that organization's PKI, or holds no active elevation over it.
        "409":
          description: This organization has no device-identity authority, or is already mid-rotation.
        "501":
          description: This control plane holds no device-identity authorities.
  /admin/tenant-device-authority/abandon-rotation:
    post:
      summary: Give up on a device-identity rotation without refusing the devices that already moved.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin.


        A device rotation cannot be abandoned by dropping the incoming authority. It SIGNS from the moment the
        rotation starts — that is how devices migrate — so by the time anybody decides the rotation was a
        mistake, real devices hold real certificates from it. Dropping it would refuse exactly the devices
        that did what they were told.


        So signing returns to the authority in force and BOTH stay admitted. Dropping the abandoned one is the
        ordinary retirement act afterwards, gated on the same readiness answer
        (GET /admin/device-authority-rotation) — which, after an abandonment, retires the abandoned authority
        rather than promoting it.
      responses:
        "200":
          description: The organization, signing under the authority in force, both still admitted.
        "409":
          description: This organization is not rotating, or the rotation was already abandoned.
  /admin/tenant-device-authority/retire-previous:
    post:
      summary: End the rotation — the incoming device-identity authority becomes the only one.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin; naming another organization additionally goes
        through the operator envelope, like every other cross-organization PKI act.


        THIS IS THE DESTRUCTIVE HALF, and it is destructive in a way the transport retirement is not. The
        moment the fleet stops registering the outgoing anchor, every device still presenting a certificate
        from it is refused AT THE HANDSHAKE — including a laptop that was switched off for the whole rotation,
        which is precisely the one nobody was watching. There is no fail-open and there must not be: admitting
        an unknown authority is the thing device identity exists to prevent.


        Ask each Edge GET /admin/device-authority-rotation first. Only an Edge has seen what a device actually
        presented at a handshake; the control plane holds the act and cannot know the answer.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  description: Operators only; a tenant admin's own organization is taken from the session.
      responses:
        "200":
          description: The promoted authority, now the only one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  anchor_pem: { type: string }
                  created_at: { type: string }
                  rotating: { type: boolean }
                  note: { type: string }
        "403":
          description: The caller may not act on that organization's PKI, or holds no active elevation over it.
        "409":
          description: This organization is not moving to a new device-identity authority.
        "501":
          description: This control plane holds no device-identity authorities.
  /admin/device-authority-rotation:
    get:
      summary: Which of this organization's devices have moved onto the incoming device-identity authority.
      description: >
        Requires admin.endpoints.read. Answered by an EDGE, because only an Edge has seen a handshake.


        Read before /admin/tenant-device-authority/retire-previous, which refuses every device that has not
        moved. The evidence is deviceCertificateFact.AnchorSHA256 — the CA a device's chain ACTUALLY ENDED AT
        on a verified handshake, not a self-report and not the issuer's name (two authorities can share a
        common name, and this deployment has that).


        SILENCE IS NOT READINESS. A device the enrolled ledger holds but this node has never seen present a
        certificate is reported in never_seen and counted against the rotation, never folded into "everybody
        has moved" — the switched-off laptop is the whole failure mode. So is a device presenting an authority
        that is neither: on_something_else is a question to answer, not a rounding error.
      responses:
        "200":
          description: The rotation's state on this node.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  rotating: { type: boolean }
                  incoming_sha256: { type: string }
                  outgoing_sha256: { type: string }
                  moved: { type: array, items: { type: string } }
                  still_on_outgoing: { type: array, items: { type: string } }
                  on_something_else: { type: array, items: { type: string } }
                  never_seen: { type: array, items: { type: string } }
                  may_retire_previous: { type: boolean }
                  note: { type: string }
  /admin/tenant-interception-authority/promote:
    post:
      summary: Make the staged interception authority the one every Edge signs under.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin; naming another organization additionally goes
        through the operator envelope.


        THIS IS THE DANGEROUS HALF. An interception rotation runs the transport way round — the Edge presents
        the certificate and the device verifies it — so every device that has not adopted the incoming root
        loses every HTTPS site the moment the fleet signs under it. That is the eighteen minutes of
        2026-08-19, which happened with both sides reporting healthy throughout.


        Read GET /admin/interception-authority-rotation on each Edge first. Only an Edge collects what a device
        reports HOLDING, and that report is the only evidence the switch is safe.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  description: Operators only; a tenant admin's own organization is taken from the session.
      responses:
        "200":
          description: The promoted authority, now the only one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  imported_at: { type: string }
                  staged: { type: boolean }
        "403":
          description: The caller may not act on that organization's PKI, or holds no active elevation over it.
        "409":
          description: This organization has nothing staged.
        "501":
          description: This control plane accepts no delegated interception authorities.
  /admin/tenant-interception-authority/withdraw-incoming:
    post:
      summary: Abandon a staged interception authority without promoting it.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin.


        The way back, and it matters as much as the way forward: without it a staged authority that turns out
        to be wrong — the wrong pathLenConstraint, the wrong root, a key nobody can produce — could only be got
        rid of by promoting it, which is the one thing it must not do. The organization stays on the authority
        it is signing under and the root devices were asked to adopt stops being announced.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id: { type: string }
      responses:
        "200":
          description: The authority in force, with nothing staged beside it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  imported_at: { type: string }
                  staged: { type: boolean }
        "403":
          description: The caller may not act on that organization's PKI.
        "409":
          description: This organization has nothing staged.
        "501":
          description: This control plane accepts no delegated interception authorities.
  /admin/interception-authority-rotation:
    get:
      summary: Which of this organization's devices report holding the staged interception root.
      description: >
        Requires admin.endpoints.read. Answered by an EDGE, because only an Edge collects what a device
        reports holding (pinned_interception_root_sha256).


        Read before /admin/tenant-interception-authority/promote, which takes every HTTPS site away from every
        device that has not adopted the incoming root.


        SILENCE IS NOT READINESS. A device the enrolled ledger holds that has reported nothing about its roots
        is counted in never_reported and held against the promotion — it is the machine that was switched off
        during the rotation, which is the failure this whole shape exists to prevent.
      responses:
        "200":
          description: The rotation's state on this node.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  rotating: { type: boolean }
                  incoming_sha256: { type: string }
                  current_sha256: { type: string }
                  holds: { type: array, items: { type: string } }
                  does_not_hold: { type: array, items: { type: string } }
                  never_reported: { type: array, items: { type: string } }
                  may_promote: { type: boolean }
                  note: { type: string }
  /admin/tenant-transport-authority/rename:
    post:
      summary: Move this organization onto a new transport server name, keeping the old one answering.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin.


        An organization created before ids were issued takes its transport name from its id, and those ids are
        the customer's own word: tenant_northwind is served as "northwind.dsse.invalid". SNI is plaintext and
        this deployment strips ECH, so every observer between a device and the Edge is told which company that
        laptop belongs to. Organizations created since are safe — their ids are unguessable, so the derived
        names are — which leaves exactly the ones that predate it, and until now they had no way to change.


        The certificate carries BOTH names while the rename is in flight, along with both folded paths
        (recovery and enrolment) for each, because transport certificate selection is keyed BY NAME: a
        certificate that stops carrying the old one fails the handshake for every device still sending it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id: { type: string }
                server_name:
                  type: string
                  description: The new name. Choose one that does not name the customer.
      responses:
        "200":
          description: The organization, now served under both names.
        "403":
          description: The caller may not act on that organization's PKI.
        "409":
          description: Already renaming, or the name is already the one in force.
  /admin/tenant-transport-authority/abandon-rotation:
    post:
      summary: Give up on a transport CA rotation.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin.


        THE WAY BACK for the CA half of the transport tier. An incoming authority is only ANNOUNCED — nothing
        is served under it until a promotion — so un-announcing it takes nothing away from any device. A
        device that already adopted it carries an anchor nobody signs with until its next trust bundle.


        Contrast abandon-rename, which cannot simply drop the new name: devices DIAL a name.
      responses:
        "200":
          description: The organization, on one authority again.
        "409":
          description: This organization is not moving to a new authority.
  /admin/tenant-transport-authority/abandon-rename:
    post:
      summary: Give up on a rename and go back to the name devices already know.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin.


        THE WAY BACK. A rename is announced to the fleet, and until this existed the only way to END one was to
        retire the previous name — which fails the handshake for every device that has not adopted.


        This TURNS THE RENAME AROUND rather than cancelling it: the organization goes back to the name it was
        being moved off, and the name it was being moved TO becomes the previous name. The certificate carries
        both throughout, so this act drops nothing.


        It has to work that way. A device that already adopted the new name fetches its next trust bundle OVER
        THE TUNNEL, so a version of this that simply stopped serving the new name stranded exactly the devices
        that had done what they were told — measured, and it took a fleet off the network. Retiring the
        previous name is still the only act that drops one, and it is the one with the readiness gate.
      responses:
        "200":
          description: The organization, back on the name it was moved off, with the abandoned one still served.
        "409":
          description: This organization is not being renamed, so there is nothing to abandon.
  /admin/tenant-transport-authority/retire-previous-name:
    post:
      summary: Stop carrying the previous transport name.
      description: >
        Requires admin.enrollment.write or admin.tenant.admin.


        THE DESTRUCTIVE HALF. Every device still sending the previous name fails the handshake from the moment
        the fleet picks this up — not a policy refusal with a message, a TLS failure on the path the device
        uses to be told anything at all. Read GET /admin/transport-name-rename on each Edge first.
      responses:
        "200":
          description: The organization, now served under one name.
        "409":
          description: This organization is not moving off another name.
  /admin/transport-name-rename:
    get:
      summary: Which of this organization's devices have moved onto the new transport name.
      description: >
        Requires admin.endpoints.read. Answered by an EDGE, because only an Edge collects what a device reports
        sending (transport_server_name_sent).


        SILENCE IS NOT READINESS. A device that has not said which name it sends is counted against the
        retirement — it is the laptop that was switched off during the rename, and dropping the old name takes
        its connection away the moment it comes back. An agent that does not report transport_server_name_sent
        cannot finish a rename, and this says so rather than assuming.
      responses:
        "200":
          description: The rename's state on this node.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  renaming: { type: boolean }
                  server_name: { type: string }
                  previous_server_name: { type: string }
                  sending_new: { type: array, items: { type: string } }
                  still_sending_previous: { type: array, items: { type: string } }
                  sending_something_else: { type: array, items: { type: string } }
                  never_reported: { type: array, items: { type: string } }
                  may_retire_previous: { type: boolean }
                  note: { type: string }
  /admin/tenant-cas:
    get:
      summary: List the CAs that identify each tenant's devices.
      description: >
        Requires admin.enrollment.read or admin.tenant.admin. Returns which organizations have an identity
        basis at all, and whether a registration made here would survive a restart (durable=false means the
        node has no -transport-tenant-ca-registry path and the registration lives only in memory).

        Each entry DESCRIBES its authorities rather than counting them: common name, fingerprint, validity and
        days_left per CA (soonest expiry first), plus days_until_first_expiry. That certificate's lapse stops
        every device of the organization at the handshake at the same moment, and until 2026-08-16 the surface
        answered `ca_count: 1` — the one expiry with fleet-wide blast radius was the one nothing reported. The
        Edge also says it out loud at boot and daily, because a screen nobody opens is not a signal.


        A tenant admin sees its OWN organization's entry; an operator (admin.tenant.admin) sees them all.
        There is deliberately no withheld count: on the device screens a count exists so a tenant is never
        shown a smaller version of its own fleet, but another organization's CA is not a diminished view of
        this caller's world — and the number of them is the membership figure this list should not publish.
      tags:
        - AdminTenantModel
      responses:
        "200":
          description: Registered tenant CAs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_cas:
                    type: array
                    items:
                      type: object
                      properties:
                        tenant_id:
                          type: string
                        ca_count:
                          type: integer
                  durable:
                    type: boolean
                  registry_path:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: This node has no tenant CA registry configured.
    post:
      summary: Register the CA that identifies an organization's devices. Takes effect immediately.
      description: >
        Requires admin.enrollment.write for your OWN organization, or admin.tenant.admin for another's. A
        device CA is the one PKI domain already shaped correctly — the customer holds the issuing key and the
        operator only verifies — so operating it is a tenant act; registering one for a DIFFERENT organization
        means every device that CA issues is admitted as that organization's, which is a fleet-sized act on
        somebody else's tenant and needs operator rights. The check runs before either half below, so a
        refusal leaves the node's trust set untouched.


        The CA lands in TWO places, because half of it is worse than neither: the
        device TRUST set, so the handshake accepts a certificate issued by it, and the tenant ATTRIBUTION
        registry, so a verified chain resolves back to the owning organization. Trust is applied first; if
        attribution then fails the response is 409 and says the CA is trusted but attributed to nobody, rather
        than reporting a plain failure for a node whose state has already changed.


        A CA already registered to another organization is refused: it identifies every device already holding
        a certificate under it, so re-pointing it would move a whole fleet between customers. The organization
        must exist. No restart is needed.
      tags:
        - AdminTenantModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, ca_pem]
              properties:
                tenant_id:
                  type: string
                ca_pem:
                  type: string
                  description: PEM, one or more CA certificates.
      responses:
        "201":
          description: Registered and live on this node.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  ca_added:
                    type: integer
                  trusted:
                    type: boolean
                  durable:
                    type: boolean
                    description: False when the registration is live but would not survive a restart.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The organization does not exist.
        "409":
          description: The CA already identifies another organization (it is now trusted but not attributed).
        "501":
          description: This node has no tenant CA registry, or no runtime device-trust store.
  /admin/tenant-cas/{tenant_id}/{sha256}:
    delete:
      summary: Withdraw ONE of an organization's device CAs, so a rotation can be finished.
      description: >-
        Requires admin.enrollment.write for your OWN organization, or admin.tenant.admin for another's.


        A device CA is replaced by registering both at once and re-issuing device certificates under the new
        one; that overlap is the method. Ending it used to mean withdrawing the organization's CAs as a set and
        re-registering the survivor — a window in which its devices were admitted by nothing at all.


        Refused with 409 when this is the organization's LAST CA: that is not the end of a rotation but the end
        of its ability to admit anything, and it has its own act (DELETE /admin/tenant-cas/{tenant_id}).
        Refused too while any of its devices was last admitted UNDER this CA, or has never been seen presenting
        a certificate on this node — withdrawing then does not degrade those devices, it stops them connecting
        at their next handshake with no way back in, because the credential they would renew with is the one
        that just stopped being trusted. A device that has been switched off through the whole rotation is
        exactly that case. Measured from the anchor each verified chain ended at, by fingerprint rather than by
        issuer name: two authorities can share a common name, and this deployment has that already.


        An organization with no enrolled devices is allowed, and a device that cannot be measured is accounted
        for by name through the anchor acknowledgement store.
      tags:
        - AdminTenantModel
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
        - name: sha256
          in: path
          required: true
          description: SHA-256 of the CA certificate, lowercase hex.
          schema:
            type: string
      responses:
        "200":
          description: Withdrawn; the response carries how many CAs the organization has left.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not a CA registered to this organization.
        "409":
          description: The last CA, or devices are still admitted under it.
        "501":
          description: This node has no tenant CA registry configured.
  /admin/tenant-cas/{tenant_id}:
    delete:
      summary: Withdraw an organization's identifying CAs.
      description: >
        Requires admin.enrollment.write for your OWN organization, or admin.tenant.admin for another's.
        Withdrawing your own is how a CA rotation ends. Withdrawing somebody else's stops admitting their
        entire fleet, which is the loudest cross-tenant write on this surface and is not a tenant act.


        Its devices stop resolving to that organization. The certificate stays in
        the device trust set — withdraw it there too to stop admitting those devices entirely, which the
        response says rather than leaving to be inferred.
      tags:
        - AdminTenantModel
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Withdrawn.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  ca_removed:
                    type: integer
                  durable:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: This node has no tenant CA registry configured.
  /admin/connectors:
    get:
      summary: List tenant-scoped admin connector registrations.
      description: Requires admin.connectors.read. Returns Admin-safe connector registration metadata for the authenticated tenant only. Raw private base URLs, raw connector metadata values, runtime secret hashes, runtime secrets, source IPs, actor users, payloads, credentials, tokens, TLS/cert, Apple, and device material are intentionally excluded.
      tags:
        - AdminConnectorManagement
