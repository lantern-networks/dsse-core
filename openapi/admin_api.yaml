  /admin/api-tokens/{token_id}/revoke:
    post:
      summary: Revoke an admin API token.
      description: Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. Revocation emits admin_api_token_revoked audit event. Bearer automation requests do not use CSRF; Admin API Token authentication may revoke only the authenticating token itself, while AdminSession, legacy emergency token, and lab bootstrap identities may revoke tenant tokens they are authorized to manage.
      tags:
        - AdminAuth
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Admin API token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAPIToken"
