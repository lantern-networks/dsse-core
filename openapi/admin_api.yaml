      description: Requires admin.connectors.read. Read-only projection (Connector UX Slice 1) that aggregates the authenticated tenant's connectors by connector_group_id into Sites. Secret-safe — built from the AdminConnector DTO, so raw private base URLs, runtime secrets, hashes, and metadata values are never returned. Cross-tenant connectors are excluded by tenant scope.
