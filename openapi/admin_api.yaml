          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/api-tokens/{token_id}/rotate:
    post:
      summary: Rotate an admin API token.
      description: Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. Rotation revokes the existing token, returns a replacement raw token once, and emits admin_api_token_rotated audit event. Bearer automation requests do not use CSRF; Admin API Token authentication may rotate only the authenticating token itself, while AdminSession, legacy emergency token, and lab bootstrap identities may rotate tenant tokens they are authorized to manage.
      tags:
        - AdminAuth
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_at:
                  type: string
                  format: date-time
                  description: Optional expiry for the replacement token. If omitted, the server uses the standard API token lifetime.
      responses:
        "201":
          description: Admin API token rotated; replacement raw token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAPITokenCreateResponse"
        "400":
          description: Token cannot be rotated.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
