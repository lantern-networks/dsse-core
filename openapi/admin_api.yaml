    get:
      summary: List tenant-scoped Application Catalog entries.
      description: Requires admin.applications.read. Returns metadata-only application catalog entries for the authenticated tenant. Raw hosts, domains, endpoints, IPs, users, payloads, credentials, tokens, TLS/cert, Apple, and device material are intentionally excluded.
      tags:
        - AdminApplicationCatalog
      parameters:
        - name: application_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - private_app
              - saas
          description: Optional exact application type filter.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - draft
              - disabled
          description: Optional exact status filter.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Maximum rows returned. Values outside 1..1000 are clamped by the server.
      responses:
        "200":
          description: Tenant application catalog list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationCatalogList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Upsert a tenant-scoped Application Catalog entry.
      description: Requires admin.applications.write. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. Bearer automation requests do not use CSRF. This increment stores a process-local metadata-only application catalog; runtime route-profile hot reload and policy bundle SaaS catalog compilation are deferred.
      tags:
        - AdminApplicationCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCatalogEntry"
      responses:
        "200":
          description: Upserted application catalog entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationCatalogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/applications/{application_id}:
    get:
      summary: Get a tenant-scoped Application Catalog entry.
      description: Requires admin.applications.read. Returns one metadata-only application catalog entry by identifier within the authenticated tenant scope.
      tags:
        - AdminApplicationCatalog
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
          description: Tenant-scoped application identifier. Slash characters are rejected by the server.
      responses:
        "200":
          description: Tenant application catalog detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationCatalogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete an operator-authored Application Catalog entry.
      description: Requires admin.applications.write. Removes a tenant-scoped operator-authored application. Deleting an entry also drops it from the published route overlay, so a PUBLISHED app becomes unreachable on delete (fail-closed; no separate unpublish needed). Config-seed entries (derived from the route profiles / SaaS catalog at boot) are NOT deletable and return 404 — they are reconstructed from configuration on every restart; edit configuration or disable the entry instead. An unknown id (including any id outside the authenticated tenant) returns 404. Policies that reference the deleted application_id are left untouched (they simply match no application now) — tidy them manually. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token; Bearer automation requests do not use CSRF.
      tags:
        - AdminApplicationCatalog
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
          description: Tenant-scoped application identifier. Slash characters are rejected by the server.
      responses:
        "200":
          description: Application deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  application_id:
                    type: string
                  deleted:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/applications/{application_id}/publish:
    post:
      summary: Publish a Private App (Connector UX Slice 2 + Slice 5 CIDR collision guard).
      description: Requires admin.applications.write. Sets published=true plus the runtime route (destination, destination_port, publish_protocol web|tcp|network, connector_group_id, routing_namespace) on the tenant-scoped catalog entry; the edge merges published entries on top of the startup file route map. Publishing creates REACHABILITY only — authorization stays with policy (Published != Allow). The response review block (published_route / policy_assigned / users_allowed_now) makes the unauthorized-until-bound state explicit. Slice 5 — when publish_protocol=network and the destination is a CIDR, the route is checked against the tenant's other published network routes and connector reachable_routes; an overlap in the same scope (same namespace AND same site, or an ambiguous CIDR with no namespace) is rejected with 409 unless override_cidr_collision=true AND the caller holds admin.connectors.write (the  explicit high-risk approval, audited). A differing routing_namespace or connector_group_id (site) avoids a collision. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token; Bearer automation requests do not use CSRF.
      tags:
        - AdminApplicationCatalog
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
          description: Tenant-scoped application identifier. Slash characters are rejected by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                destination:
                  type: string
                  description: Private destination host the published route resolves to.
                destination_port:
                  type: integer
                  minimum: 0
                  maximum: 65535
                publish_protocol:
                  type: string
                  enum:
                    - web
                    - tcp
                    - network
                connector_group_id:
                  type: string
                routing_namespace:
                  type: string
                  description: Slice 5. Site / virtual-network id that scopes a network (CIDR) route so overlapping private ranges coexist across sites. Consulted only for publish_protocol=network. Empty namespace + an overlapping CIDR is ambiguous and blocked by default.
                override_cidr_collision:
                  type: boolean
                  description: Slice 5. Explicit high-risk approval to publish a network route despite a detected CIDR collision. Honored only when the caller also holds admin.connectors.write; the override is audited (admin_route_collision_override_approved).
                application_sensitivity:
                  type: string
      responses:
        "200":
          description: Application published; includes the entry and a Published-vs-Allow review block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPublishResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Slice 5 CIDR route collision — the network route overlaps an existing route in the same scope. Resolve via an FQDN route, a routing namespace, a specific Site, a narrower host route, or an explicit high-risk override (override_cidr_collision=true with admin.connectors.write).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPublishCIDRCollision"
  /admin/applications/{application_id}/unpublish:
    post:
      summary: Unpublish a Private App (Connector UX Slice 2).
      description: Requires admin.applications.write. Sets published=false, withdrawing the published route overlay (the edge falls back to any startup file route). Returns the entry and the review block.
      tags:
        - AdminApplicationCatalog
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
          description: Tenant-scoped application identifier. Slash characters are rejected by the server.
      responses:
        "200":
          description: Application unpublished; includes the entry and review block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPublishResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/applications/{application_id}/reachability:
    post:
      summary: Test reachability of a Private App (Connector UX Slice 3).
      description: >-
        Requires admin.applications.read. Probes the application's destination through the connector that fronts
        it (DNS, TCP, TLS, HTTP — scoped on the connector side to its reachable_routes as an SSRF guard) and
        layers a policy simulation (a pure decision dry-run) on top. No real user traffic is flowed: the probe
        is bounded and body-less and the policy step evaluates without proxying, logging a decision, or writing
        any store. Tenant-scoped and secret-safe (the audit records the verdict only — never the destination
        host, resolved IPs, or certificate fields). When no connected connector fronts the app the result is a
        fail-closed no_connector / no_tunnel outcome that still includes the policy simulation.
      tags:
        - AdminApplicationCatalog
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
          description: Tenant-scoped application identifier. Slash characters are rejected by the server.
      responses:
        "200":
          description: Reachability diagnostics — per-layer results, selected connector, and policy simulation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version:
                    type: string
                  application_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - ok
                      - no_connector
                      - no_tunnel
                      - probe_failed
                  reachable:
                    type: boolean
                  failure_layer:
                    type: string
                    enum:
                      - route
                      - dns
                      - tcp
                      - tls
                      - http
                  suggested_action:
                    type: string
                  connector:
                    type: object
                    properties:
                      connector_id:
                        type: string
                      name:
                        type: string
                      connector_group_id:
                        type: string
                      edge_region_id:
                        type: string
                      tunnel_connected:
                        type: boolean
                  destination:
                    type: object
                    properties:
                      host:
                        type: string
                      port:
                        type: integer
                      probe_protocol:
                        type: string
                  probe:
                    type: object
                    description: Secret-safe per-layer probe result (DNS/TCP/TLS/HTTP, resolved IPs, public cert fields, HTTP status). Never contains payload bytes or key material.
                  policy_simulation:
                    type: object
                    description: Pure policy dry-run (decision, permitted, reason_codes, policy_assigned, users_allowed_now). No traffic is flowed.
                  route_error:
                    type: object
                    description: >-
                      Connector UX Slice 6. A ROUTE-LEVEL error distinct from the policy decision. The only kind
                      today is "residency": the fronting connector's region is outside the tenant's residency boundary,
                      so the route is unusable for a residency reason — the same fail-closed decision the live egress
                      dialer enforces. Surfaced separately from policy_simulation so an operator can tell "denied by
                      policy" from "unreachable across the residency boundary". Omitted when there is no route error.
                    properties:
                      kind:
                        type: string
                        enum:
                          - residency
                      connector_region:
                        type: string
                      serving_region:
                        type: string
                      allowed_regions:
                        type: array
                        items:
                          type: string
                      message:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/intercept/bypass-hosts:
    get:
      summary: List configured decrypt-bypass host patterns for the requesting tenant.
      description: Requires admin.swg.read. Returns the local engine's tenant-specific host selection, including deployment defaults, that tenant's curated-catalog overrides and authored bypass rules applying to any source. Device-specific exceptions are applied separately using the authenticated source device and are not flattened into this list. It excludes other tenants' rules. This configuration listing does not include dynamic pin-learning state or prove independent Edge delivery or actual traffic inspection.
      tags:
        - AdminPolicyCandidateReview
      responses:
        "200":
          description: Configured bypass patterns for the requesting tenant; empty if this node has no interception engine.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/fleet/tenant-erasure/{tenant_id}:
    get:
      summary: Is a tenant's erasure complete across the whole fleet?
      description: >
        Requires admin.tenant.admin. A tenant's logs sit on the disk of every node that served it, so no single
        node can answer this — and the fleet list cannot either, because membership there is "whoever is
        reporting now" and a node that is merely powered off drops out of it within one poll.


        This reads the remembered answers instead: every node that has EVER answered about this tenant, with
        its last answer, marked stale once it has gone quiet. complete=true requires all of them clean. A node
        that reported it still held data and then went silent keeps the erasure incomplete, because a machine
        that is switched off has not stopped holding what is on its disk. Nobody having answered is not
        completion either, and `coverage` says so in words rather than leaving it to be inferred from an empty
        list.
      tags:
        - AdminTenantModel
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Each node's last answer, and whether the erasure is complete across the fleet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  complete:
                    type: boolean
                  coverage:
                    type: string
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        node_id:
                          type: string
                        clean:
                          type: boolean
                        remaining:
                          type: integer
                        reported_at:
                          type: string
                        stale:
                          type: boolean
                          description: This node has not answered within the fleet freshness window; its last answer still counts.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/fleet/identity-claim/claim:
    post:
      summary: Take the one-time claim on a device identity. Asked by an Edge, decided by the authority.
      description: >-
        Requires admin.enrollment.write. "Has this identity already enrolled" is a one-time decision, and a
        one-time decision taken by more than one process needs one place to take it — the enrolled ledger cannot
        be that place, because it answers from memory and saves as a blob, so two issuers each decide alone.


        claimed=false is an ANSWER (somebody else holds it). An error is NOT an answer: a claim that could not
        be taken must never read as taken-by-nobody, which is the precise shape in which two issuers both mint a
        certificate for one device name. grant is the administrator's re-enrolment permission counter; a claim
        may be taken only under a grant newer than the standing one.
      tags:
        - AdminEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                identity:
                  type: string
                grant:
                  type: integer
      responses:
        "200":
          description: Whether the claim was taken, or why it could not be decided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  claimed:
                    type: boolean
                  error:
                    type: string
        "401":
          description: Not authenticated.
  /admin/fleet/identity-claim/release:
    post:
      summary: Give back a claim a node took and could not honour.
      description: >-
        Requires admin.enrollment.write. Best-effort by construction: if it fails the identity stays claimed and
        an administrator's re-arm is the way back, which is safe and inconvenient rather than the other way
        round. Only removes a claim at the SAME grant it was taken under, so it can never undo a newer
        administrator decision that arrived in between.
      tags:
        - AdminEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                identity:
                  type: string
                grant:
                  type: integer
      responses:
        "200":
          description: Released, or why it could not be.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          description: Not authenticated.
  /admin/fleet/identity-claim/backfill:
    post:
      summary: Record identities that were already enrolled before the shared claim existed.
      description: >-
        Requires admin.enrollment.write. An empty claim table hands the existing fleet away: creating it does
        not populate it, so every identity enrolled before the upgrade has no claim — and a new issuer, which
        has no local marker for them either, takes the empty claim and issues a certificate for a name already
        in use. An Edge calls this at start-up with everything it knows to be enrolled, and refuses to enrol
        anybody until it succeeds.
      tags:
        - AdminEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                claims:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: How many claims were recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded:
                    type: integer
                  error:
                    type: string
        "401":
          description: Not authenticated.
  /admin/fleet/enrolment-token/verify:
    post:
      summary: May this one-time enrolment token be used? Asked by an Edge, answered by the authority.
      description: >-
        Requires admin.enrollment.write. A device reaches an EDGE to enrol, because that is where the transport
        is; deciding that a certificate may be issued is the control plane's, because that is where authority
        lives. So an Edge that pulls its config holds no enrolment-token store at all and asks here.


        The answer is 200 with a REASON on refusal, not an HTTP error, because the caller has to tell "no,
        because it is spent" from "the authority did not respond" — and because POST /enroll treats an UNKNOWN
        secret as possibly-the-shared-token and falls through to its other eligibility modes. A reason flattened
        into prose would break that path silently. Reasons: unknown | used | revoked | expired | wrong_tenant.
      tags:
        - AdminEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secret:
                  type: string
                  description: The token secret the device presented.
                tenant_id:
                  type: string
      responses:
        "200":
          description: The token, or a reason it cannot be used.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: object
                  error:
                    type: string
        "401":
          description: Not authenticated.
  /admin/fleet/enrolment-token/spend:
    post:
      summary: Spend a one-time enrolment token. The single conditional write the fleet shares.
      description: >-
        Requires admin.enrollment.write. The half that makes "one-time" mean once across EVERY Edge rather than
        once per Edge: the spend is one conditional UPDATE and the authority makes it. An Edge asks; it does not
        decide, and while this is unreachable no device can enrol there — enrolment is growth, and the devices
        already enrolled are unaffected.


        Same answer shape as verify: 200 with a reason on refusal.
      tags:
        - AdminEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The token id returned by verify.
                tenant_id:
                  type: string
                device_id:
                  type: string
                  description: The device the token is being spent for, so the record names the machine.
      responses:
        "200":
          description: The spent token, or a reason it could not be spent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: object
                  error:
                    type: string
        "401":
          description: Not authenticated.
  /admin/fleet/config-status:
    get:
      summary: Which Edges hold the control plane's current configuration.
      description: >-
        Requires admin.policy.read. Answers the question an admin API could not answer before 2026-08-10: a
        per-node admin endpoint reports for the node that was asked, and the Console asks exactly one, so
        "applied" meant "applied on whichever Edge the console front door proxies to". Each Edge reports the CP
        generation it has applied on every config-bundle poll; this returns those reports judged against the
        control plane's CURRENT generation. Served by the control plane.


        The fleet is whatever is reporting NOW — an instance whose last report has aged out is simply absent
        from the list, not listed as failed. Several Edges may share a region behind a load balancer, so rows
        are per INSTANCE.
      tags:
        - AdminPolicy
      responses:
        "200":
          description: The control plane's generation and every Edge that has reported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  control_plane_generation:
                    type: integer
                    format: int64
                  control_plane_epoch:
                    type: string
                  in_sync:
                    type: boolean
                    description: >-
                      True only when at least one Edge has reported AND every one of them is current. An empty
                      fleet is NOT in sync — "nobody has reported" and "everybody agrees" must not render the
                      same banner.
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        region_id:
                          type: string
                        cluster_id:
                          type: string
                        generation:
                          type: integer
                          format: int64
                        epoch:
                          type: string
                        have_applied:
                          type: boolean
                        rule_count:
                          type: integer
                        last_error:
                          type: string
                        reported_at:
                          type: string
                          format: date-time
                        status:
                          type: string
                          description: >-
                            current | lagging | never_applied | error. About CONFIGURATION only — there is no
                            state for "gone". The fleet is whatever is reporting now: instances are created and
                            destroyed continuously, so one that stops reporting has almost always been removed,
                            and keeping it as a fault turns a routine scale-in into an alarm while asserting an
                            expected count the control plane has no way to know.
                          enum: [current, lagging, never_applied, error]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: An Edge reports which configuration generation it is running.
      description: >-
        Requires admin.policy.read. Called by each Edge on every config-bundle poll, using the same bearer it
        already uses to PULL the bundle. Push rather than poll because the control plane cannot reach the Edges
        — in the reference deployment one Edge's admin API is not published at all, and in production the Edges
        are behind the boundary.
      tags:
        - AdminPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region_id]
              properties:
                region_id:
                  type: string
                cluster_id:
                  type: string
                generation:
                  type: integer
                  format: int64
                epoch:
                  type: string
                have_applied:
                  type: boolean
                rule_count:
                  type: integer
                last_error:
                  type: string
      responses:
        "204":
          description: Report recorded.
        "400":
          description: Malformed report, or one that does not identify its Edge.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/policy-candidates:
    get:
      summary: List tenant-scoped allow/bypass policy candidates.
      description: Requires admin.policy_candidates.read. Returns metadata-only policy candidates for operator review. Raw logs, endpoints, IPs, hosts, users, payloads, credentials, tokens, TLS/cert, Apple, and device material are intentionally excluded.
      tags:
        - AdminPolicyCandidateReview
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - approved
              - rejected
              - dismissed
          description: Optional exact status filter.
        - name: candidate_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - allow_policy
              - bypass_policy
          description: Optional exact candidate type filter.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Maximum rows returned. Values outside 1..1000 are clamped by the server.
      responses:
        "200":
          description: Tenant policy candidate list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCandidateList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Upsert a tenant-scoped allow/bypass policy candidate.
      description: Requires admin.policy_candidates.write. Mutating Admin UI requests authenticated by AdminSession cookie require x-csrf-token matching the server-side session secret. Bearer automation requests do not use CSRF. This process-local metadata-only candidate store does not materialize policy, compile bundles, or hot reload runtime enforcement.
      tags:
        - AdminPolicyCandidateReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCandidate"
      responses:
        "200":
          description: Upserted policy candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCandidate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/cert-pin-bypass:
    post:
      summary: Manually add a known pinned site to the TLS decrypt-bypass.
      description: >-
        Requires admin.policy_candidates.review. Registers a named host the operator already knows pins its
        certificate, without waiting for the detector to surface it. Creates an approved cert-pinning bypass
        candidate and materializes it in one call — the same path a detected-then-adopted candidate takes — so
        it becomes a first-class Egress bypass rule visible and revocable alongside detected ones. The host must
        be a named host, not a raw IP literal (a bypass no-decrypts its destination; you cannot attribute a bare
        IP). This is an explicit admin action, so it does not violate the never-auto-bypass invariant.
      tags:
        - AdminPolicyCandidateReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - host
              properties:
                host:
                  type: string
                  description: The named host to decrypt-bypass (e.g. gateway.example.com). Raw IP literals are rejected.
      responses:
        "200":
          description: The materialized cert-pin bypass candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCandidate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/policy-candidates/{candidate_id}:
    get:
      summary: Get a tenant-scoped allow/bypass policy candidate.
      description: Requires admin.policy_candidates.read. Returns one metadata-only policy candidate by identifier within the authenticated tenant scope.
      tags:
        - AdminPolicyCandidateReview
      parameters:
        - name: candidate_id
          in: path
          required: true
          schema:
            type: string
          description: Tenant-scoped candidate identifier. Slash characters are rejected by the server.
      responses:
        "200":
          description: Tenant policy candidate detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCandidate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/policy-candidates/{candidate_id}/review:
    post:
      summary: Review a tenant-scoped allow/bypass policy candidate.
      description: Requires admin.policy_candidates.review. The review action updates candidate status only; policy materialization, bundle signing, and runtime hot reload are deferred.
      tags:
        - AdminPolicyCandidateReview
      parameters:
        - name: candidate_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCandidateReviewRequest"
      responses:
        "200":
          description: Reviewed policy candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCandidate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/policy-candidates/{candidate_id}/materialize:
    post:
      summary: Materialize an approved bypass policy candidate.
      description: Requires admin.policy_candidates.review. Applies an already-approved candidate (e.g. a cert-pinning bypass proposal) by adding its host to the interception bypass set and marking it materialized. Detection never auto-bypasses; only this explicit admin step makes a bypass live. Approving without materializing leaves the host intercepted.
      tags:
        - AdminPolicyCandidateReview
      parameters:
        - name: candidate_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Materialized policy candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCandidate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/policy-candidates/{candidate_id}/approve-private-app:
    post:
      summary: Approve a connector-discovered candidate into a published Private App.
      description: >-
        Requires admin.policy_candidates.review. Connector UX Slice 4. Promotes a connector_discovered candidate
        (a destination a connector declared it can reach, not yet published) into a published Private App via the
        Slice 2 publish path, then marks the candidate approved (removing it from pending). This is a SEPARATE
        path from /materialize: it only publishes reachability and never writes a TLS decrypt-bypass rule, and it
        is refused (400) for any non-connector_discovered candidate. Published != Allow — the response review
        block shows the freshly published app authorizes nobody until a policy is bound (fail-closed).
      tags:
        - AdminPolicyCandidateReview
      parameters:
        - name: candidate_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                publish_protocol:
                  type: string
                  enum:
                    - web
                    - tcp
                    - network
                  description: Publish app type. Defaults to the candidate's suggested protocol, then web.
                application_id:
                  type: string
                  description: Optional application id for the published app. Defaults to the candidate id.
                name:
                  type: string
                  description: Optional display name. Defaults to the destination.
                connector_group_id:
                  type: string
                  description: Optional Site / connector group. Defaults to the candidate's observed-from site.
                destination_port:
                  type: integer
                  minimum: 0
                  maximum: 65535
                review_reason_code:
                  type: string
                  description: Non-secret review reason code.
              additionalProperties: false
      responses:
        "200":
          description: The published Private App, the approved candidate, and the Published != Allow review block.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version:
                    type: string
                  application:
                    $ref: "#/components/schemas/ApplicationCatalogEntry"
                  candidate:
                    $ref: "#/components/schemas/PolicyCandidate"
                  review:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/connector-discovery/refresh:
    post:
      summary: Refresh connector-discovered Private App candidates.
      description: >-
        Requires admin.policy_candidates.write. Connector UX Slice 4. Derives candidates from the
        reachable_routes − published diff (destinations a tenant's connectors declare they can reach that are not
        yet a published Private App) and writes each as a PENDING candidate. It never auto-publishes or
        auto-allows — the only effect is proposing pending review items (fail-closed). Tenant-scoped and
        secret-safe (reachable-route domains are non-secret; private base URLs and secrets are never touched).
      tags:
        - AdminPolicyCandidateReview
      responses:
        "200":
          description: The connector-discovered candidates after the refresh.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version:
                    type: string
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/PolicyCandidate"
                  count:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: The discovery diff could not be completed because of an internal store boundary error.
