          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Count of NHIs per severity bucket (none|medium|high).
        identities:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - nhi_type
              - severity
              - signals
            properties:
              id:
                type: string
              name:
                type: string
              nhi_type:
                type: string
              severity:
                type: string
                enum:
                  - none
                  - medium
                  - high
              signals:
                type: array
                items:
                  type: string
                  enum:
                    - owner_unset
                    - no_expiry_long_lived
                    - scope_overbroad
                    - unused
            additionalProperties: false
        no_secret_attestation:
          type: boolean
          description: Always true. The report carries non-secret enums only — no credentials, secrets, or scope-as-data.
    DecisionExplanation:
      type: object
      required:
        - schema_version
        - decision_id
        - tenant_id
        - decision
        - summary_ja
        - summary_en
        - matched_conditions
        - reason_codes
        - generated_at
        - generation_method
        - no_secret_attestation
      properties:
        schema_version:
          type: string
          enum:
            - ai_ops_decision_explanation.v1
        decision_id:
          type: string
        tenant_id:
          type: string
        decision:
          type: string
          description: The recorded decision value (allow|deny|require_reauthentication|require_human_approval|require_workload_attestation|...).
        policy_id:
          type: string
        summary_ja:
          type: string
          description: Top-level Japanese explanation derived from the decision value plus the most salient reason code.
        summary_en:
          type: string
          description: Top-level English explanation.
        matched_conditions:
          type: array
          items:
            type: string
        reason_codes:
          type: array
          items:
            type: object
            required:
              - code
              - category
              - severity
              - ja
              - en
              - known
            properties:
              code:
                type: string
              category:
                type: string
                description: policy|identity|approval|risk|tls|tool|ransomware|reauth|attestation|other.
              severity:
                type: string
                enum:
                  - info
                  - warning
                  - critical
              ja:
                type: string
              en:
                type: string
              remediation:
                type: string
              known:
                type: boolean
                description: false when the reason code is not in the explainer table; it is then restated verbatim, never fabricated.
            additionalProperties: false
        generated_at:
          type: string
          format: date-time
        generation_method:
          type: string
          enum:
            - deterministic_no_llm
          description: Always deterministic_no_llm for this endpoint. No LLM and no external call; the optional self-hosted OSS-LLM narrative layer is a separate endpoint.
        no_secret_attestation:
          type: boolean
          description: Always true. Derived solely from the already-redacted decision record; emits non-secret enums + fixed templates only.
