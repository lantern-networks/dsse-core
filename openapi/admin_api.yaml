        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: Domain Event Outbox stats reader is not configured for this Edge process.
  /admin/domain-event-outbox/health:
    get:
      summary: Return tenant-scoped Domain Event Outbox delivery health.
      description: Requires admin.domain_events.delivery.read. Converts Domain Event Outbox counts and oldest pending/publishing timestamps into an operator-facing health status for alerting and UI triage.
      tags:
